    // --- VISUAL RENDERING ROUTINES ---
    function drawHeart(ctx, x, y, size) {
      ctx.save();
      ctx.translate(x, y);
      ctx.beginPath();
      const topY = -size / 2;
      ctx.moveTo(0, topY + size * 0.3);
      ctx.bezierCurveTo(-size * 0.35, topY, -size * 0.75, topY + size * 0.35, -size * 0.75, topY + size * 0.65);
      ctx.bezierCurveTo(-size * 0.75, topY + size * 1.1, -size * 0.2, topY + size * 1.45, 0, topY + size * 1.8);
      ctx.bezierCurveTo(size * 0.2, topY + size * 1.45, size * 0.75, topY + size * 1.1, size * 0.75, topY + size * 0.65);
      ctx.bezierCurveTo(size * 0.75, topY + size * 0.35, size * 0.35, topY, 0, topY + size * 0.3);
      ctx.closePath();
      ctx.fillStyle = '#ff0055';
      ctx.shadowColor = '#ff0055';
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.restore();
    }

    function drawHUD(ctx) {
      ctx.save();
      
      // Top background panel
      ctx.fillStyle = 'rgba(6, 0, 20, 0.75)';
      ctx.fillRect(0, 0, V_WIDTH, 50);

      // Bottom glowing border line
      ctx.strokeStyle = 'rgba(0, 255, 255, 0.25)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, 50);
      ctx.lineTo(V_WIDTH, 50);
      ctx.stroke();

      // Lives
      for (let i = 0; i < 3; i++) {
        if (i < player.lives) {
          drawHeart(ctx, 30 + i * 26, 26, 11);
        } else {
          // Empty/dashed heart outline
          ctx.save();
          ctx.translate(30 + i * 26, 26);
          ctx.beginPath();
          const size = 11;
          const topY = -size / 2;
          ctx.moveTo(0, topY + size * 0.3);
          ctx.bezierCurveTo(-size * 0.35, topY, -size * 0.75, topY + size * 0.35, -size * 0.75, topY + size * 0.65);
          ctx.bezierCurveTo(-size * 0.75, topY + size * 1.1, -size * 0.2, topY + size * 1.45, 0, topY + size * 1.8);
          ctx.bezierCurveTo(size * 0.2, topY + size * 1.45, size * 0.75, topY + size * 1.1, size * 0.75, topY + size * 0.65);
          ctx.bezierCurveTo(size * 0.75, topY + size * 0.35, size * 0.35, topY, 0, topY + size * 0.3);
          ctx.closePath();
          ctx.strokeStyle = 'rgba(255, 0, 85, 0.35)';
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.restore();
        }
      }

      // Shield Timer (if active)
      if (player.shieldActive) {
        ctx.font = `bold 10px 'Orbitron', monospace`;
        ctx.fillStyle = '#00ffff';
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 4;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(`SHIELD: ${Math.ceil(player.shieldTimer)}s`, 110, 25);
      }

      // Wave Status
      ctx.font = `14px 'Orbitron', monospace`;
      ctx.fillStyle = '#8888ff';
      ctx.shadowColor = '#8888ff';
      ctx.shadowBlur = 4;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`WAVE ${waveManager.currentWave}`, V_WIDTH / 2, 25);

      // Score
      ctx.font = `bold 16px 'Orbitron', monospace`;
      ctx.fillStyle = '#39ff14';
      ctx.shadowColor = '#39ff14';
      ctx.shadowBlur = 8;
      ctx.textAlign = 'right';
      ctx.fillText(`${score.toString().padStart(6, '0')}`, V_WIDTH - 25, 25);

      ctx.restore();

      // Boss Health Bar (if any boss is active)
      const activeBoss = enemies.find(e => e.type.startsWith('BOSS'));
      if (activeBoss) {
        ctx.save();
        const barW = 280;
        const barH = 8;
        const barX = (V_WIDTH - barW) / 2;
        const barY = 65;

        // Boss Name
        ctx.font = `bold 10px 'Orbitron', monospace`;
        ctx.fillStyle = activeBoss.color;
        ctx.shadowColor = activeBoss.color;
        ctx.shadowBlur = 6;
        ctx.textAlign = 'center';
        let bossName = "GOLIATH PRIME";
        if (activeBoss.type === 'BOSS2') bossName = "NEBULA DREADNOUGHT";
        if (activeBoss.type === 'BOSS3') bossName = "INTERGALACTIC EMPEROR";
        ctx.fillText(bossName, V_WIDTH / 2, barY - 6);

        // Bar Background
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.fillRect(barX, barY, barW, barH);

        // Bar Fill
        const ratio = activeBoss.hp / activeBoss.maxHp;
        ctx.fillStyle = activeBoss.color;
        ctx.shadowColor = activeBoss.color;
        ctx.shadowBlur = 10;
        ctx.fillRect(barX, barY, barW * ratio, barH);

        // Bar Border
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 1;
        ctx.strokeRect(barX, barY, barW, barH);
        ctx.restore();
      }
    }

    function drawGlitchText(ctx, text, x, y, fontSize, scaleRatio) {
      ctx.save();
      ctx.font = `${fontSize}px 'Orbitron', sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      let offset = 0;
      if (Math.floor(tick / 5) % 6 === 0 && Math.random() > 0.35) {
        offset = (1.5 + Math.random() * 2) * scaleRatio;
      }

      if (offset > 0) {
        ctx.fillStyle = '#ff0055';
        ctx.fillText(text, x + offset, y + (Math.random() - 0.5) * 2);
        
        ctx.fillStyle = '#00ffff';
        ctx.fillText(text, x - offset, y + (Math.random() - 0.5) * 2);
      }

      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 15;
      ctx.fillText(text, x, y);
      
      ctx.restore();
    }

    function drawButton(ctx, btn, x, y, w, h) {
      btn.x = x - w / 2;
      btn.y = y - h / 2;
      btn.w = w;
      btn.h = h;

      ctx.save();
      ctx.translate(x, y);

      let pulse = 0.5 + Math.sin(tick * 0.12) * 0.5;
      
      ctx.fillStyle = btn.hover ? 'rgba(0, 255, 255, 0.18)' : 'rgba(10, 0, 32, 0.8)';
      ctx.fillRect(-w / 2, -h / 2, w, h);

      ctx.strokeStyle = btn.hover ? '#39ff14' : '#00ffff';
      ctx.shadowColor = btn.hover ? '#39ff14' : '#00ffff';
      ctx.shadowBlur = btn.hover ? 16 : 8 + pulse * 6;
      ctx.lineWidth = btn.hover ? 3 : 2;
      
      // Cyberpunk border details
      ctx.beginPath();
      const cut = 6;
      ctx.moveTo(-w/2 + cut, -h/2);
      ctx.lineTo(w/2 - cut, -h/2);
      ctx.lineTo(w/2, -h/2 + cut);
      ctx.lineTo(w/2, h/2 - cut);
      ctx.lineTo(w/2 - cut, h/2);
      ctx.lineTo(-w/2 + cut, h/2);
      ctx.lineTo(-w/2, h/2 - cut);
      ctx.lineTo(-w/2, -h/2 + cut);
      ctx.closePath();
      ctx.stroke();

      ctx.font = `bold 14px 'Orbitron', sans-serif`;
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowBlur = 3;
      ctx.fillText(btn.text, 0, 0);

      ctx.restore();
    }

    function drawMuteButton(ctx, x, y, w, h) {
      ctx.save();
      ctx.translate(x, y);

      const hover = buttons.muteButton.hover;
      ctx.fillStyle = hover ? 'rgba(0, 255, 255, 0.18)' : 'rgba(10, 0, 32, 0.8)';
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = hover ? '#39ff14' : '#00ffff';
      ctx.shadowColor = hover ? '#39ff14' : '#00ffff';
      ctx.shadowBlur = hover ? 12 : 5;
      ctx.lineWidth = 1.5;
      ctx.strokeRect(0, 0, w, h);

      // Draw speaker icon
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.moveTo(4, 7);
      ctx.lineTo(8, 7);
      ctx.lineTo(13, 3);
      ctx.lineTo(13, 21);
      ctx.lineTo(8, 17);
      ctx.lineTo(4, 17);
      ctx.closePath();
      ctx.fill();

      if (audioEngine.muted) {
        // Red X
        ctx.strokeStyle = '#ff0055';
        ctx.shadowColor = '#ff0055';
        ctx.shadowBlur = 8;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(16, 8);
        ctx.lineTo(21, 16);
        ctx.moveTo(21, 8);
        ctx.lineTo(16, 16);
        ctx.stroke();
      } else {
        // Cyan sound waves
        ctx.strokeStyle = '#00ffff';
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 6;
        ctx.lineWidth = 1.5;
        
        ctx.beginPath();
        ctx.arc(11, 12, 4, -Math.PI / 3, Math.PI / 3);
        ctx.stroke();
        
        ctx.beginPath();
        ctx.arc(11, 12, 7, -Math.PI / 3, Math.PI / 3);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawWaveBanner(ctx, waveNum, timer, duration) {
      ctx.save();
      let opacity = 1.0;
      const elapsed = duration - timer;
      if (elapsed < 0.5) opacity = elapsed / 0.5;
      else if (timer < 0.5) opacity = timer / 0.5;

      ctx.globalAlpha = opacity;
      ctx.font = `bold 28px 'Orbitron', sans-serif`;
      ctx.fillStyle = '#00ffff';
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 15;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`WAVE ${waveNum}`, V_WIDTH / 2, V_HEIGHT / 2 - 10);

      ctx.font = `11px 'Orbitron', sans-serif`;
      ctx.fillStyle = '#39ff14';
      ctx.shadowColor = '#39ff14';
      ctx.shadowBlur = 5;
      ctx.fillText(`PREPARAR SISTEMA DE VOO`, V_WIDTH / 2, V_HEIGHT / 2 + 20);

      ctx.restore();
    }

    function drawPlayableBorders(ctx) {
      ctx.save();
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#00ffff';
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 2;

      // Left Border Line
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, V_HEIGHT);
      ctx.stroke();

      // Right Border Line
      ctx.beginPath();
      ctx.moveTo(V_WIDTH, 0);
      ctx.lineTo(V_WIDTH, V_HEIGHT);
      ctx.stroke();

      // Small details at boundaries
      ctx.fillStyle = '#00ffff';
      ctx.fillRect(-4, 10, 8, 4);
      ctx.fillRect(-4, V_HEIGHT - 14, 8, 4);
      ctx.fillRect(V_WIDTH - 4, 10, 8, 4);
      ctx.fillRect(V_WIDTH - 4, V_HEIGHT - 14, 8, 4);
      
      ctx.restore();
    }

    // --- GAME ENGINE PROCESSORS ---
    function checkCollisions() {
      // 1. Bullet colliders
      for (let b = bullets.length - 1; b >= 0; b--) {
        const bullet = bullets[b];
        
        if (bullet.isEnemy) {
          // Check player collision
          if (gameState === 'PLAYING') {
            const hitRadius = Math.max(player.width, player.height) * 0.45;
            const dist = Math.hypot(bullet.x - player.x, bullet.y - player.y);
            const bulletRadius = bullet.isFireball ? 11 : 3;
            if (dist < hitRadius + bulletRadius) {
              bullet.active = false;
              if (!player.invulnerable && !player.shieldActive) {
                const hit = player.triggerDamage();
                if (hit) waveManager.waveDamageTaken = true;
                if (player.lives <= 0) triggerGameOver();
              } else if (player.shieldActive) {
                // Shield impact particles
                for (let i = 0; i < 5; i++) {
                  particles.push(new Particle(bullet.x, bullet.y, '#00ffff'));
                }
              }
            }
          }
        } else {
          // Player laser hits enemies
          for (let e = enemies.length - 1; e >= 0; e--) {
            const enemy = enemies[e];
            const dist = Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y);
            const colLimit = (bullet.width / 2) + (enemy.width / 2);
            
            if (dist < colLimit + 2) {
              bullet.active = false;
              
              const destroyed = enemy.takeDamage(bullet.damage);
              if (destroyed) {
                audioEngine.playEnemyExplosion();
                score += enemy.scoreValue;
                waveManager.enemiesDestroyed++;

                const isBossWave = (waveManager.currentWave === 10 || waveManager.currentWave === 20 || waveManager.currentWave === 30);
                if (enemy.guaranteedDrop) {
                  powerups.push(new PowerUp(enemy.x, enemy.y, enemy.guaranteedDrop));
                } else if (!isBossWave) {
                  // Collectible items spawned on even waves (only if not boss wave)
                  const isEvenWave = (waveManager.currentWave % 2 === 0);
                  if (isEvenWave && Math.random() < 0.22) { // 22% chance of drop
                    const type = Math.random() < 0.5 ? 'WEAPON' : 'SHIELD';
                    powerups.push(new PowerUp(enemy.x, enemy.y, type));
                  }
                }

                // Spawn explosion particles
                for (let i = 0; i < 12; i++) {
                  particles.push(new Particle(enemy.x, enemy.y, enemy.color));
                }

                // Check Wave Completion
                let waveCleared = false;
                if (isBossWave) {
                  if (enemy.type.startsWith('BOSS')) {
                    waveCleared = true;
                  }
                } else {
                  if (waveManager.enemiesDestroyed >= waveManager.enemiesTotal) {
                    waveCleared = true;
                  }
                }

                if (waveCleared) {
                  // Destroy remaining enemies
                  enemies.forEach(otherEnemy => {
                    if (otherEnemy !== enemy) {
                      otherEnemy.active = false;
                      for (let i = 0; i < 8; i++) {
                        particles.push(new Particle(otherEnemy.x, otherEnemy.y, otherEnemy.color));
                      }
                    }
                  });
                  // Clear enemy bullets
                  bullets = bullets.filter(b => !b.isEnemy);

                  // Perfect Wave Bonus Check
                  if (!waveManager.waveDamageTaken) {
                    score += 100;
                    // Trigger visual celebration indicator
                    for (let p = 0; p < 25; p++) {
                      particles.push(new Particle(V_WIDTH / 2, V_HEIGHT / 2, '#39ff14'));
                    }
                  }
                  audioEngine.playWaveClear();
                  if (waveManager.currentWave >= 30) {
                    gameState = 'VICTORY';
                    if (score > highscore) {
                      highscore = score;
                      localStorage.setItem('intergalactic_neon_highscore', highscore.toString());
                    }
                  } else {
                    waveManager.startWave(waveManager.currentWave + 1);
                  }
                }
              }
              break;
            }
          }
        }
      }

      // 2. Direct player ship collision with enemy bodies
      if (gameState === 'PLAYING') {
        for (let e = enemies.length - 1; e >= 0; e--) {
          const enemy = enemies[e];
          const hitRadius = Math.max(player.width, player.height) * 0.45;
          const enemyRadius = enemy.width * 0.45;
          const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
          
          if (dist < hitRadius + enemyRadius) {
            if (!player.invulnerable && !player.shieldActive) {
              const hit = player.triggerDamage();
              if (hit) waveManager.waveDamageTaken = true;
            } else if (player.shieldActive) {
              // Shield block particles
              for (let i = 0; i < 8; i++) {
                particles.push(new Particle(enemy.x, enemy.y, '#00ffff'));
              }
            }
            
            // Re-bound enemy damage and destroy
            enemy.active = false;
            waveManager.enemiesDestroyed++;
            audioEngine.playEnemyExplosion();

            const isBossWave = (waveManager.currentWave === 10 || waveManager.currentWave === 20 || waveManager.currentWave === 30);
            if (enemy.guaranteedDrop) {
              powerups.push(new PowerUp(enemy.x, enemy.y, enemy.guaranteedDrop));
            } else if (!isBossWave) {
              // Collectible items spawned on even waves (onda sim, onda não)
              const isEvenWave = (waveManager.currentWave % 2 === 0);
              if (isEvenWave && Math.random() < 0.22) {
                const type = Math.random() < 0.5 ? 'WEAPON' : 'SHIELD';
                powerups.push(new PowerUp(enemy.x, enemy.y, type));
              }
            }

            for (let i = 0; i < 12; i++) {
              particles.push(new Particle(enemy.x, enemy.y, enemy.color));
            }

            if (player.lives <= 0) {
              triggerGameOver();
              break;
            }

            // Check wave completion if last enemy is rammed
            let waveCleared = false;
            if (isBossWave) {
              if (enemy.type.startsWith('BOSS')) {
                waveCleared = true;
              }
            } else {
              if (waveManager.enemiesDestroyed >= waveManager.enemiesTotal) {
                waveCleared = true;
              }
            }

            if (waveCleared) {
              enemies.forEach(otherEnemy => {
                if (otherEnemy !== enemy) {
                  otherEnemy.active = false;
                  for (let i = 0; i < 8; i++) {
                    particles.push(new Particle(otherEnemy.x, otherEnemy.y, otherEnemy.color));
                  }
                }
              });
              bullets = bullets.filter(b => !b.isEnemy);

              if (!waveManager.waveDamageTaken) {
                score += 100;
                for (let p = 0; p < 25; p++) {
                  particles.push(new Particle(V_WIDTH / 2, V_HEIGHT / 2, '#39ff14'));
                }
              }
              audioEngine.playWaveClear();
              if (waveManager.currentWave >= 30) {
                gameState = 'VICTORY';
                if (score > highscore) {
                  highscore = score;
                  localStorage.setItem('intergalactic_neon_highscore', highscore.toString());
                }
              } else {
                waveManager.startWave(waveManager.currentWave + 1);
              }
            }
          }
        }
      }

      // 3. Player overlap with collectible powerups
      if (gameState === 'PLAYING') {
        for (let i = powerups.length - 1; i >= 0; i--) {
          const pu = powerups[i];
          const dist = Math.hypot(player.x - pu.x, player.y - pu.y);
          const colLimit = (player.width / 2) + (pu.width / 2);
          
          if (dist < colLimit) {
            pu.active = false;
            if (pu.type === 'WEAPON') {
              if (player.weaponLevel < 5) {
                player.weaponLevel++;
                audioEngine.playPowerUp();
              }
            } else if (pu.type === 'SHIELD') {
              player.activateShield(30);
              audioEngine.playPowerUp();
            }
            score += 15;
          }
        }
      }

      // Cleanup inactive entities
      bullets = bullets.filter(b => b.active);
      enemies = enemies.filter(e => e.active);
    }

    // --- MAIN GAME LOOP IMPLEMENTATION ---
    let lastTime = performance.now();
    function loop(time) {
      const dt = Math.min(0.08, (time - lastTime) / 1000); // Caps deltaTime on tab unfocus
      lastTime = time;
      tick++;

      // Update background globally
      starfield.update(dt);

      // Rendering sequence
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      starfield.draw(ctx);

      // Set scale relative to playable virtual zone
      ctx.save();
      ctx.translate(offsetX, offsetY);
      ctx.scale(scale, scale);

      // Clip bounds
      ctx.beginPath();
      ctx.rect(0, 0, V_WIDTH, V_HEIGHT);
      ctx.clip();

      if (gameState === 'PLAYING') {
        waveTime += dt;
        
        // Dynamic +10 points every 10 seconds of active survival
        if (waveManager.state === 'PLAYING') {
          pointsTimer += dt;
          if (pointsTimer >= 10.0) {
            pointsTimer -= 10.0;
            score += 10;
          }
        }
        
        // 1. Update entities
        player.update(dt, bullets);
        waveManager.update(dt, enemies);

        // Enemies update & shooting
        const speedMult = 1.0 + (waveManager.currentWave - 1) * 0.08;
        enemies.forEach(e => {
          e.update(dt, waveTime, speedMult);
          
          // Random shooting chance (~1.5% chance per frame at 60fps)
          if (e.active && e.y > 0 && Math.random() < 0.015) {
            bullets.push(new Bullet(e.x, e.y + 12, true));
          }
        });

        bullets.forEach(b => b.update(dt));
        particles.forEach(p => p.update(dt));
        powerups.forEach(pu => pu.update(dt));

        // 2. Resolve collisions
        checkCollisions();

        // Cleanup dead particles and powerups
        particles = particles.filter(p => p.life > 0);
        powerups = powerups.filter(pu => pu.active);

        // 3. Render entities
        enemies.forEach(e => e.draw(ctx));
        bullets.forEach(b => b.draw(ctx));
        powerups.forEach(pu => pu.draw(ctx));
        particles.forEach(p => p.draw(ctx));
        player.draw(ctx);

        // Render Wave overlay if transitioning
        if (waveManager.state === 'TRANSITION') {
          drawWaveBanner(ctx, waveManager.currentWave, waveManager.transitionTimer, waveManager.transitionDuration);
        }

        // Playable side boundaries
        drawPlayableBorders(ctx);

        // HUD panel layer
        drawHUD(ctx);

      } else if (gameState === 'MENU') {
        // Floating spaceship decoration
        const shipOsc = Math.sin(tick * 0.045) * 8;
        player.x = V_WIDTH / 2;
        player.y = V_HEIGHT - 210 + shipOsc;
        player.draw(ctx);

        // Title and buttons
        drawGlitchText(ctx, "INTERGALACTIC", V_WIDTH / 2, 215, 30, scale);
        drawGlitchText(ctx, "NEON", V_WIDTH / 2, 258, 44, scale);
        
        ctx.font = `bold 12px 'Orbitron', sans-serif`;
        ctx.fillStyle = '#ff6600';
        ctx.shadowColor = '#ff6600';
        ctx.shadowBlur = 6;
        ctx.textAlign = 'center';
        ctx.fillText("DEFEND THE GALAXY", V_WIDTH / 2, 308);

        drawButton(ctx, buttons.startButton, V_WIDTH / 2, 430, 210, 48);
        drawPlayableBorders(ctx);

      } else if (gameState === 'GAME_OVER') {
        // Render background particles
        particles.forEach(p => p.update(dt));
        particles = particles.filter(p => p.life > 0);
        particles.forEach(p => p.draw(ctx));

        drawGlitchText(ctx, "GAME OVER", V_WIDTH / 2, 230, 36, scale);

        ctx.font = `15px 'Orbitron', sans-serif`;
        ctx.fillStyle = '#39ff14';
        ctx.textAlign = 'center';
        ctx.shadowBlur = 6;
        ctx.fillText(`SCORE: ${score}`, V_WIDTH / 2, 305);
        
        ctx.fillStyle = '#00ffff';
        ctx.fillText(`HIGH SCORE: ${highscore}`, V_WIDTH / 2, 340);

        drawButton(ctx, buttons.restartButton, V_WIDTH / 2, 450, 170, 45);
        drawButton(ctx, buttons.menuButton, V_WIDTH / 2, 515, 170, 45);
        drawPlayableBorders(ctx);
      } else if (gameState === 'VICTORY') {
        // Render background particles
        particles.forEach(p => p.update(dt));
        particles = particles.filter(p => p.life > 0);
        particles.forEach(p => p.draw(ctx));

        drawGlitchText(ctx, "VICTORY", V_WIDTH / 2, 230, 40, scale);
        
        ctx.font = `bold 16px 'Orbitron', sans-serif`;
        ctx.fillStyle = '#ffd700';
        ctx.textAlign = 'center';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ffd700';
        ctx.fillText("VOCE SALVOU A GALAXIA!", V_WIDTH / 2, 290);

        ctx.font = `14px 'Orbitron', sans-serif`;
        ctx.fillStyle = '#39ff14';
        ctx.shadowColor = '#39ff14';
        ctx.shadowBlur = 6;
        ctx.fillText(`SCORE FINAL: ${score}`, V_WIDTH / 2, 335);

        ctx.fillStyle = '#00ffff';
        ctx.fillText(`RECORD: ${highscore}`, V_WIDTH / 2, 370);

        drawButton(ctx, buttons.restartButton, V_WIDTH / 2, 470, 170, 45);
        drawButton(ctx, buttons.menuButton, V_WIDTH / 2, 535, 170, 45);
        drawPlayableBorders(ctx);
      }
      
      // Draw Mute Button globally on all screens
      drawMuteButton(ctx, buttons.muteButton.x, buttons.muteButton.y, buttons.muteButton.w, buttons.muteButton.h);

      ctx.restore();
      requestAnimationFrame(loop);
    }

    // --- HIGH-DPI CANVAS MANAGEMENT & SCALE FACTOR ---
    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const W = window.innerWidth;
      const H = window.innerHeight;
      
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      
      ctx.scale(dpr, dpr);
      
      // Compute responsive scaling constraints
      scale = Math.min(W / V_WIDTH, H / V_HEIGHT);
      offsetX = (W - V_WIDTH * scale) / 2;
      offsetY = (H - V_HEIGHT * scale) / 2;

      starfield.resize();
    }

    window.addEventListener('resize', resize);
    
    // --- CONTROLS LISTENERS ---
    function convertCoords(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const screenX = clientX - rect.left;
      const screenY = clientY - rect.top;
      const x = (screenX - offsetX) / scale;
      const y = (screenY - offsetY) / scale;
      return { x, y };
    }

    function handleMove(clientX, clientY) {
      const { x, y } = convertCoords(clientX, clientY);
      if (gameState === 'PLAYING') {
        player.targetX = x;
        player.targetY = y;
      }
    }

    // Keyboard bindings for Desktop
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      audioEngine.init();
      audioEngine.resume();
    });
    window.addEventListener('keyup', e => {
      keys[e.key] = false;
    });

    // Process keyboard inputs on ticking frame
    function processKeyboardInputs() {
      if (gameState !== 'PLAYING') return;
      const moveSpeed = 360 * 0.016; // approx velocity frame scale
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
        player.targetX = player.x - moveSpeed;
      }
      if (keys['ArrowRight'] || keys['d'] || keys['D']) {
        player.targetX = player.x + moveSpeed;
      }
      if (keys['ArrowUp'] || keys['w'] || keys['W']) {
        player.targetY = player.y - moveSpeed;
      }
      if (keys['ArrowDown'] || keys['s'] || keys['S']) {
        player.targetY = player.y + moveSpeed;
      }
    }
    // inject into request loop cycle
    setInterval(processKeyboardInputs, 16);

    // Mouse movement binding
    window.addEventListener('mousemove', e => {
      const { x, y } = convertCoords(e.clientX, e.clientY);
      
      buttons.muteButton.hover = isInside(x, y, buttons.muteButton);

      if (gameState === 'MENU') {
        buttons.startButton.hover = isInside(x, y, buttons.startButton);
      } else if (gameState === 'GAME_OVER' || gameState === 'VICTORY') {
        buttons.restartButton.hover = isInside(x, y, buttons.restartButton);
        buttons.menuButton.hover = isInside(x, y, buttons.menuButton);
      }
      handleMove(e.clientX, e.clientY);
    });

    // Touch support bindings
    window.addEventListener('touchstart', e => {
      audioEngine.init();
      audioEngine.resume();
      if (e.touches.length > 0) {
        const touch = e.touches[0];
        const { x, y } = convertCoords(touch.clientX, touch.clientY);
        
        if (isInside(x, y, buttons.muteButton)) {
          audioEngine.toggleMute();
          e.preventDefault();
          return;
        }

        if (gameState === 'PLAYING') {
          player.targetX = x;
          player.targetY = y;
        } else if (gameState === 'MENU') {
          if (isInside(x, y, buttons.startButton)) startGame();
        } else if (gameState === 'GAME_OVER' || gameState === 'VICTORY') {
          if (isInside(x, y, buttons.restartButton)) startGame();
          else if (isInside(x, y, buttons.menuButton)) goToMenu();
        }
      }
    }, { passive: false });

    window.addEventListener('touchmove', e => {
      if (e.touches.length > 0) {
        const touch = e.touches[0];
        handleMove(touch.clientX, touch.clientY);
      }
    }, { passive: false });

    // Desktop Click trigger trigger
    window.addEventListener('click', e => {
      audioEngine.init();
      audioEngine.resume();
      const { x, y } = convertCoords(e.clientX, e.clientY);

      if (isInside(x, y, buttons.muteButton)) {
        audioEngine.toggleMute();
        return;
      }

      if (gameState === 'MENU') {
        if (isInside(x, y, buttons.startButton)) startGame();
      } else if (gameState === 'GAME_OVER' || gameState === 'VICTORY') {
        if (isInside(x, y, buttons.restartButton)) startGame();
        else if (isInside(x, y, buttons.menuButton)) goToMenu();
      }
    });

    // Launch application sequence
    resize();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
