<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Intergalactic Neon — Space Shooter</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050010;
      font-family: 'Orbitron', monospace;
    }
    
    #gameCanvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #audioNotice {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: rgba(0, 255, 255, 0.4);
      pointer-events: none;
      z-index: 10;
      text-align: center;
      letter-spacing: 1px;
      text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
    }

    #footerNotice {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: rgba(255, 255, 255, 0.35);
      pointer-events: none;
      z-index: 10;
      text-align: center;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 5px rgba(0, 255, 255, 0.2);
    }

    /* ===== NAME INPUT OVERLAY ===== */
    #nameInputOverlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(5, 0, 16, 0.98);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      font-family: 'Orbitron', monospace;
      user-select: text !important;
      -webkit-user-select: text !important;
      touch-action: auto !important;
    }
    #nameInputOverlay .overlay-title {
      color: #00ffff;
      font-size: clamp(18px, 5vw, 28px);
      letter-spacing: 6px;
      text-shadow: 0 0 25px #00ffff, 0 0 50px rgba(0,255,255,0.3);
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    #nameInputOverlay .overlay-subtitle {
      color: #8888ff;
      font-size: clamp(9px, 2.5vw, 13px);
      letter-spacing: 4px;
      margin-bottom: 36px;
    }
    #nameInputOverlay .input-label {
      color: #aaaaff;
      font-size: clamp(8px, 2vw, 11px);
      letter-spacing: 4px;
      margin-bottom: 14px;
      text-transform: uppercase;
    }
    #playerNameInput {
      background: rgba(0, 255, 255, 0.04);
      border: 2px solid #00ffff;
      border-radius: 3px;
      color: #ffffff;
      font-family: 'Orbitron', monospace;
      font-size: clamp(14px, 4vw, 20px);
      letter-spacing: 5px;
      padding: 14px 22px;
      text-align: center;
      width: min(300px, 80vw);
      outline: none;
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.25), inset 0 0 15px rgba(0,255,255,0.03);
      margin-bottom: 30px;
      text-transform: uppercase;
      caret-color: #00ffff;
      user-select: text;
      -webkit-user-select: text;
    }
    #playerNameInput::placeholder { color: rgba(0,255,255,0.25); }
    #playerNameInput:focus {
      border-color: #39ff14;
      box-shadow: 0 0 35px rgba(57,255,20,0.4), inset 0 0 15px rgba(57,255,20,0.05);
    }
    #confirmNameBtn {
      background: transparent;
      border: 2px solid #39ff14;
      border-radius: 3px;
      color: #39ff14;
      cursor: pointer;
      font-family: 'Orbitron', monospace;
      font-size: clamp(10px, 3vw, 14px);
      letter-spacing: 5px;
      padding: 14px 44px;
      text-transform: uppercase;
      box-shadow: 0 0 18px rgba(57,255,20,0.3);
      transition: all 0.2s;
    }
    #confirmNameBtn:hover, #confirmNameBtn:active {
      background: rgba(57,255,20,0.12);
      box-shadow: 0 0 35px rgba(57,255,20,0.6);
    }
    .overlay-glow-line {
      width: min(280px, 75vw);
      height: 1px;
      background: linear-gradient(90deg, transparent, #00ffff, transparent);
      margin: 22px 0;
      opacity: 0.6;
    }
    #nameInputError {
      color: #ff0055;
      font-size: 9px;
      letter-spacing: 2px;
      margin-top: -20px;
      margin-bottom: 16px;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="audioNotice">CLIQUE OU TOQUE NA TELA PARA ATIVAR O SOM SINTETIZADO</div>
  <div id="footerNotice">Criado por Mateus Cruz</div>

  <!-- Name Input Overlay -->
  <div id="nameInputOverlay">
    <div class="overlay-title">INTERGALACTIC NEON</div>
    <div class="overlay-subtitle">S P A C E &nbsp; S H O O T E R</div>
    <div class="overlay-glow-line"></div>
    <div class="input-label">Identificação do piloto</div>
    <input id="playerNameInput" type="text" maxlength="12"
      placeholder="SEU NOME" autocomplete="off" autocorrect="off"
      autocapitalize="characters" spellcheck="false" />
    <div id="nameInputError"></div>
    <button id="confirmNameBtn">ENTRAR</button>
    <div class="overlay-glow-line"></div>
  </div>

  <script>
    // --- UTILS & CORE SETTINGS ---
    const V_WIDTH = 480;   // Virtual logic width
    const V_HEIGHT = 800;  // Virtual logic height
    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;
    
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const isOverlayActive = () => {
      const overlay = document.getElementById('nameInputOverlay');
      return overlay && overlay.style.display !== 'none';
    };
    
    let gameState = 'MENU'; // MENU, PLAYING, GAME_OVER, VICTORY, LEADERBOARD
    let score = 0;
    let highscore = 0;
    try {
      highscore = parseInt(localStorage.getItem('intergalactic_neon_highscore') || '0', 10);
    } catch (e) {
      console.warn("Storage read failed:", e);
    }
    let tick = 0;

    // --- PLAYER IDENTITY & LEADERBOARD ---
    let playerName = '';
    try {
      playerName = localStorage.getItem('ig_neon_playername') || '';
    } catch (e) {
      console.warn("Storage read failed:", e);
    }
    let leaderboard = [];
    let leaderboardLoaded = false;
    let leaderboardError = false;
    let scoreSaved = false;

    // Stable per-device UID for deduplication (stored in localStorage)
    const PLAYER_UID = (() => {
      let uid = null;
      try {
        uid = localStorage.getItem('ig_neon_uid');
        if (!uid) {
          uid = Math.random().toString(36).substr(2, 10) + Date.now().toString(36);
          localStorage.setItem('ig_neon_uid', uid);
        }
      } catch (e) {
        console.warn("Storage failed:", e);
        uid = Math.random().toString(36).substr(2, 10) + Date.now().toString(36);
      }
      return uid;
    })();

    const JSONBIN_API_KEY = '$2a$10$N6l9Rvj6RAqZ8GFgi0okK.lhg2M/r1puSG4KleYm6rtaFyAQdesaq';
    const JSONBIN_BASE = 'https://api.jsonbin.io/v3';
    // Fixed shared bin — all players write to the same ranking
    const LEADERBOARD_BIN_ID = '6a295ad8f5f4af5e29d7f64e';

    let clientIP = '';
    async function fetchClientIP() {
      try {
        const res = await fetch('https://api.ipify.org?format=json');
        if (res.ok) {
          const data = await res.json();
          clientIP = data.ip || '';
        }
      } catch (e) {
        console.warn("IP fetch failed:", e);
      }
    }

    async function loadLeaderboard() {
      leaderboardLoaded = false;
      leaderboardError = false;
      try {
        const res = await fetch(`${JSONBIN_BASE}/b/${LEADERBOARD_BIN_ID}/latest`, {
          headers: { 'X-Access-Key': JSONBIN_API_KEY }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        // Filter out seed/test entries and keep only real scores
        leaderboard = (Array.isArray(data.record) ? data.record : [])
          .filter(r => r.name !== 'TEST');
        leaderboardLoaded = true;

        // Auto-identify player from leaderboard if not already in localStorage
        if (!playerName || playerName.length === 0) {
          let match = leaderboard.find(r => r.uid === PLAYER_UID);
          if (!match && clientIP) {
            match = leaderboard.find(r => r.ip === clientIP);
          }
          if (match && match.name) {
            playerName = match.name;
            try {
              localStorage.setItem('ig_neon_playername', playerName);
            } catch (e) {
              console.warn("Storage write failed:", e);
            }
            const overlay = document.getElementById('nameInputOverlay');
            if (overlay) {
              overlay.style.display = 'none';
            }
          }
        }
      } catch (e) {
        console.warn('Leaderboard load failed:', e);
        leaderboard = [];
        leaderboardError = true;
        leaderboardLoaded = true;
      }
    }

    async function saveScore(name, finalScore, wave) {
      if (scoreSaved) return;
      scoreSaved = true;
      try {
        // 1. Read current records
        const res = await fetch(`${JSONBIN_BASE}/b/${LEADERBOARD_BIN_ID}/latest`, {
          headers: { 'X-Access-Key': JSONBIN_API_KEY }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        let records = (Array.isArray(data.record) ? data.record : [])
          .filter(r => r.name !== 'TEST');

        const newEntry = {
          name: (name || 'PILOTO').toUpperCase().substring(0, 12),
          score: finalScore,
          wave: wave,
          uid: PLAYER_UID,
          ip: clientIP || '',
          date: new Date().toLocaleDateString('pt-BR')
        };

        // 2. Update if better score, else push new entry
        let existingIdx = records.findIndex(r => r.uid === PLAYER_UID);
        if (existingIdx === -1 && clientIP) {
          existingIdx = records.findIndex(r => r.ip === clientIP);
        }

        if (existingIdx >= 0) {
          if (records[existingIdx].uid !== PLAYER_UID) {
            newEntry.uid = PLAYER_UID;
          }
          if (finalScore > records[existingIdx].score) {
            records[existingIdx] = newEntry;
          } else {
            records[existingIdx].uid = PLAYER_UID;
            if (clientIP) records[existingIdx].ip = clientIP;
          }
        } else {
          records.push(newEntry);
        }

        records.sort((a, b) => b.score - a.score);
        records = records.slice(0, 100);

        // 3. Save back
        const putRes = await fetch(`${JSONBIN_BASE}/b/${LEADERBOARD_BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Access-Key': JSONBIN_API_KEY
          },
          body: JSON.stringify(records)
        });
        if (!putRes.ok) throw new Error(`PUT HTTP ${putRes.status}`);

        leaderboard = records;
      } catch (e) {
        console.warn('Score save failed:', e);
      }
    }

    // Boot: pre-load ranking and client IP on page open
    (async () => {
      await fetchClientIP();
      await loadLeaderboard();
    })();

    // --- PROCEDURAL AUDIO ENGINE ---
    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.padGain = null;
        this.reverbNode = null;
        this.oscillators = [];
        this.lfos = [];
        this.initialized = false;
        this.muted = false;
      }

      init() {
        if (this.initialized) return;
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
          
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.setValueAtTime(this.muted ? 0 : 0.15, this.ctx.currentTime);
          this.masterGain.connect(this.ctx.destination);

          // Simulate Reverb with procedural Impulse Response buffer
          this.reverbNode = this.ctx.createConvolver();
          this.reverbNode.buffer = this.createReverbBuffer(2.0, 2.0);
          this.reverbNode.connect(this.masterGain);

          this.startAmbientPad();
          this.initialized = true;

          const notice = document.getElementById('audioNotice');
          if (notice) notice.style.display = 'none';
        } catch (e) {
          console.warn("Web Audio API not supported/blocked:", e);
        }
      }

      toggleMute() {
        this.muted = !this.muted;
        if (this.ctx && this.masterGain) {
          this.masterGain.gain.setValueAtTime(this.muted ? 0 : 0.15, this.ctx.currentTime);
        }
        return this.muted;
      }

      resume() {
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      createReverbBuffer(duration, decay) {
        const sampleRate = this.ctx ? this.ctx.sampleRate : 44100;
        const len = sampleRate * duration;
        const buffer = this.ctx.createBuffer(2, len, sampleRate);
        
        for (let channel = 0; channel < 2; channel++) {
          const channelData = buffer.getChannelData(channel);
          for (let i = 0; i < len; i++) {
            const t = i / sampleRate;
            channelData[i] = (Math.random() * 2 - 1) * Math.pow(1 - t / duration, decay);
          }
        }
        return buffer;
      }

      startAmbientPad() {
        // A minor chord frequencies: A1(55Hz), A2(110Hz), E3(164.81Hz), A3(220Hz), C4(261.63Hz)
        const notes = [
          { freq: 55, type: 'triangle', vol: 0.15 },
          { freq: 110, type: 'triangle', vol: 0.12 },
          { freq: 164.81, type: 'sine', vol: 0.08 },
          { freq: 220, type: 'sine', vol: 0.08 },
          { freq: 261.63, type: 'sine', vol: 0.06 }
        ];

        this.padGain = this.ctx.createGain();
        this.padGain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        this.padGain.connect(this.masterGain);
        this.padGain.connect(this.reverbNode);

        notes.forEach((note, index) => {
          const osc = this.ctx.createOscillator();
          osc.type = note.type;
          osc.frequency.setValueAtTime(note.freq, this.ctx.currentTime);

          const oscGain = this.ctx.createGain();
          oscGain.gain.setValueAtTime(note.vol, this.ctx.currentTime);

          osc.connect(oscGain);
          oscGain.connect(this.padGain);
          osc.start();
          this.oscillators.push(osc);

          // Slow LFO to modulate volumes for a breathing sound (approx 0.07Hz - 0.13Hz)
          const lfo = this.ctx.createOscillator();
          lfo.frequency.setValueAtTime(0.06 + index * 0.015, this.ctx.currentTime);

          const lfoGain = this.ctx.createGain();
          lfoGain.gain.setValueAtTime(note.vol * 0.6, this.ctx.currentTime);

          lfo.connect(lfoGain);
          lfoGain.connect(oscGain.gain);
          lfo.start();

          this.lfos.push({ osc: lfo, gain: lfoGain });
        });
      }

      playPlayerShoot() {
        if (!this.initialized) return;
        this.resume();
        const now = this.ctx.currentTime;

        // Beep sweep
        const osc = this.ctx.createOscillator();
        const oscGain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(1300, now + 0.08);

        oscGain.gain.setValueAtTime(0.1, now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

        osc.connect(oscGain);
        oscGain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.08);

        // Filtered noise pulse
        const bufferSize = this.ctx.sampleRate * 0.06;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noiseNode = this.ctx.createBufferSource();
        noiseNode.buffer = noiseBuffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1100, now);
        filter.Q.setValueAtTime(4, now);

        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.12, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

        noiseNode.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(this.masterGain);

        noiseNode.start(now);
        noiseNode.stop(now + 0.06);
      }

      playEnemyExplosion() {
        if (!this.initialized) return;
        this.resume();
        const now = this.ctx.currentTime;
        const duration = 0.2;

        const bufferSize = this.ctx.sampleRate * duration;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noiseNode = this.ctx.createBufferSource();
        noiseNode.buffer = noiseBuffer;

        const lpFilter = this.ctx.createBiquadFilter();
        lpFilter.type = 'lowpass';
        lpFilter.frequency.setValueAtTime(900, now);
        lpFilter.frequency.exponentialRampToValueAtTime(80, now + duration);

        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.35, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        noiseNode.connect(lpFilter);
        lpFilter.connect(noiseGain);
        
        noiseGain.connect(this.masterGain);
        noiseGain.connect(this.reverbNode); // send explosions to reverb

        noiseNode.start(now);
        noiseNode.stop(now + duration);
      }

      playPlayerHit() {
        if (!this.initialized) return;
        this.resume();
        const now = this.ctx.currentTime;
        const duration = 0.3;

        const osc = this.ctx.createOscillator();
        const gainNode = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(170, now);
        osc.frequency.linearRampToValueAtTime(30, now + duration);

        gainNode.gain.setValueAtTime(0.35, now);
        gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);

        const lpFilter = this.ctx.createBiquadFilter();
        lpFilter.type = 'lowpass';
        lpFilter.frequency.setValueAtTime(350, now);

        osc.connect(lpFilter);
        lpFilter.connect(gainNode);
        gainNode.connect(this.masterGain);

        osc.start(now);
        osc.stop(now + duration);
      }

      playGameOver() {
        if (!this.initialized) return;
        this.resume();
        const now = this.ctx.currentTime;
        const duration = 1.3;
        const freqs = [98, 131, 185, 233]; // Dissonant chords

        freqs.forEach((freq) => {
          const osc = this.ctx.createOscillator();
          const gainNode = this.ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, now);
          osc.frequency.exponentialRampToValueAtTime(freq * 0.35, now + duration);

          gainNode.gain.setValueAtTime(0.14, now);
          gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);

          const lpFilter = this.ctx.createBiquadFilter();
          lpFilter.type = 'lowpass';
          lpFilter.frequency.setValueAtTime(280, now);

          osc.connect(lpFilter);
          lpFilter.connect(gainNode);
          gainNode.connect(this.masterGain);
          gainNode.connect(this.reverbNode);

          osc.start(now);
          osc.stop(now + duration);
        });
      }

      playWaveClear() {
        if (!this.initialized) return;
        this.resume();
        const now = this.ctx.currentTime;
        const chord = [440, 554.37, 659.25, 880]; // A major

        chord.forEach((freq, idx) => {
          const startTime = now + idx * 0.12;
          const osc = this.ctx.createOscillator();
          const gainNode = this.ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.05, startTime + 0.4);

          gainNode.gain.setValueAtTime(0, startTime);
          gainNode.gain.linearRampToValueAtTime(0.18, startTime + 0.05);
          gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + 0.45);

          osc.connect(gainNode);
          gainNode.connect(this.masterGain);
          gainNode.connect(this.reverbNode);

          osc.start(startTime);
          osc.stop(startTime + 0.45);
        });
      }

      playPowerUp() {
        if (!this.initialized) return;
        this.resume();
        const now = this.ctx.currentTime;
        const chord = [330, 440, 554.37, 659.25, 880]; // Ascending chime

        chord.forEach((freq, idx) => {
          const startTime = now + idx * 0.06;
          const osc = this.ctx.createOscillator();
          const gainNode = this.ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);

          gainNode.gain.setValueAtTime(0, startTime);
          gainNode.gain.linearRampToValueAtTime(0.15, startTime + 0.03);
          gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);

          osc.connect(gainNode);
          gainNode.connect(this.masterGain);

          osc.start(startTime);
          osc.stop(startTime + 0.25);
        });
      }

      playShieldDeflect() {
        if (!this.initialized) return;
        this.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gainNode = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(500, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.08);

        gainNode.gain.setValueAtTime(0.12, now);
        gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

        osc.connect(gainNode);
        gainNode.connect(this.masterGain);

        osc.start(now);
        osc.stop(now + 0.1);
      }

      playForcefieldOn() {
        if (!this.initialized) return;
        this.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gainNode = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(440, now + 0.25);

        gainNode.gain.setValueAtTime(0.16, now);
        gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

        osc.connect(gainNode);
        gainNode.connect(this.masterGain);

        osc.start(now);
        osc.stop(now + 0.3);
      }

      playForcefieldOff() {
        if (!this.initialized) return;
        this.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gainNode = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.2);

        gainNode.gain.setValueAtTime(0.14, now);
        gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

        osc.connect(gainNode);
        gainNode.connect(this.masterGain);

        osc.start(now);
        osc.stop(now + 0.25);
      }

      playSuperpower() {
        if (!this.initialized) return;
        this.resume();
        const now = this.ctx.currentTime;
        const duration = 1.2;

        const osc1 = this.ctx.createOscillator();
        const gain1 = this.ctx.createGain();
        osc1.type = 'sawtooth';
        osc1.frequency.setValueAtTime(120, now);
        osc1.frequency.linearRampToValueAtTime(30, now + duration);
        gain1.gain.setValueAtTime(0.3, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc1.connect(gain1);
        gain1.connect(this.masterGain);

        const osc2 = this.ctx.createOscillator();
        const gain2 = this.ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(250, now);
        osc2.frequency.exponentialRampToValueAtTime(950, now + duration * 0.8);
        gain2.gain.setValueAtTime(0.2, now);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc2.connect(gain2);
        gain2.connect(this.masterGain);

        osc1.start(now);
        osc1.stop(now + duration);
        osc2.start(now);
        osc2.stop(now + duration);
      }
    }

    const audioEngine = new AudioEngine();

    // --- BACKGROUND STARFIELD ---
    class Star {
      constructor(layer) {
        this.layer = layer;
        this.reset(true);
      }

      reset(randomY = false) {
        this.x = Math.random() * window.innerWidth;
        this.y = randomY ? Math.random() * window.innerHeight : -10;
        
        if (this.layer === 0) {
          this.speed = 15 + Math.random() * 10;
          this.size = 0.7 + Math.random() * 0.4;
          this.color = Math.random() < 0.2 ? '#6655bb' : '#ffffff';
        } else if (this.layer === 1) {
          this.speed = 40 + Math.random() * 20;
          this.size = 1.2 + Math.random() * 0.5;
          this.color = Math.random() < 0.3 ? '#8866cc' : '#ffffff';
        } else {
          this.speed = 85 + Math.random() * 30;
          this.size = 1.8 + Math.random() * 0.7;
          this.color = Math.random() < 0.4 ? '#00ffff' : '#ffffff';
        }
      }

      update(dt) {
        this.y += this.speed * dt;
        if (this.y > window.innerHeight) {
          this.reset(false);
        }
      }

      draw(ctx) {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
      }
    }

    class Nebula {
      constructor() {
        this.reset(true);
      }

      reset(randomY = false) {
        this.x = Math.random() * window.innerWidth;
        this.y = randomY ? Math.random() * window.innerHeight : -250;
        this.radius = 150 + Math.random() * 150;
        this.speed = 8 + Math.random() * 10;
        const colors = [
          { r: 26, g: 0, b: 58, a: 0.15 },
          { r: 61, g: 0, b: 102, a: 0.12 },
          { r: 10, g: 0, b: 32, a: 0.18 }
        ];
        this.color = colors[Math.floor(Math.random() * colors.length)];
      }

      update(dt) {
        this.y += this.speed * dt;
        if (this.y - this.radius > window.innerHeight) {
          this.reset(false);
        }
      }

      draw(ctx) {
        ctx.save();
        let grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
        grad.addColorStop(0, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.color.a})`);
        grad.addColorStop(0.5, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.color.a * 0.4})`);
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    class StarField {
      constructor() {
        this.stars = [];
        this.nebulae = [];

        const starCounts = [70, 35, 15];
        for (let layer = 0; layer < 3; layer++) {
          for (let i = 0; i < starCounts[layer]; i++) {
            this.stars.push(new Star(layer));
          }
        }

        for (let i = 0; i < 4; i++) {
          this.nebulae.push(new Nebula());
        }
      }

      update(dt) {
        this.nebulae.forEach(n => n.update(dt));
        this.stars.forEach(s => s.update(dt));
      }

      draw(ctx) {
        ctx.fillStyle = '#060015';
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        this.nebulae.forEach(n => n.draw(ctx));
        this.stars.forEach(s => s.draw(ctx));
      }

      resize() {
        this.stars.forEach(star => {
          star.x = Math.random() * window.innerWidth;
          if (star.y > window.innerHeight) star.y = Math.random() * window.innerHeight;
        });
        this.nebulae.forEach(n => {
          n.x = Math.random() * window.innerWidth;
          if (n.y - n.radius > window.innerHeight) n.y = Math.random() * window.innerHeight;
        });
      }
    }

    const starfield = new StarField();

    // --- BULLETS & PARTICLES ---
    class Bullet {
      constructor(x, y, isEnemy, weaponLevel = 1, angle = 0, damage = 1, isFireball = false) {
        this.x = x;
        this.y = y;
        this.isEnemy = isEnemy;
        this.weaponLevel = weaponLevel;
        this.angle = angle; // support spread angles
        this.damage = damage;
        this.isFireball = isFireball;
        this.speed = isEnemy ? (isFireball ? 240 : 280) : 650;
        this.width = isEnemy ? (isFireball ? 22 : 8) : 4;
        this.height = isEnemy ? (isFireball ? 22 : 8) : 16;
        
        // Scale bullet dimensions by level
        if (!isEnemy) {
          if (weaponLevel === 2) {
            this.width = 6;
            this.height = 16;
          } else if (weaponLevel === 3) {
            this.width = 8;
            this.height = 20;
          } else if (weaponLevel === 4) {
            this.width = 10;
            this.height = 22;
          } else if (weaponLevel >= 5) {
            this.width = 12;
            this.height = 24;
          }
        }
        
        this.active = true;
        this.trail = [];
      }

      update(dt) {
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > 5) this.trail.shift();

        if (this.isEnemy) {
          this.y += this.speed * Math.cos(this.angle) * dt;
          this.x += this.speed * Math.sin(this.angle) * dt;
        } else {
          // Adjust trajectory according to shoot angle
          this.y -= this.speed * Math.cos(this.angle) * dt;
          this.x += this.speed * Math.sin(this.angle) * dt;
        }

        if (this.y < -30 || this.y > V_HEIGHT + 30 || this.x < -30 || this.x > V_WIDTH + 30) {
          this.active = false;
        }
      }

      draw(ctx) {
        ctx.save();
        if (this.isEnemy) {
          if (this.isFireball) {
            // Draw Giant fireball
            ctx.shadowBlur = 24;
            ctx.shadowColor = '#ff3300';
            ctx.fillStyle = '#ff9900';
            
            // Draw fireball tail
            if (this.trail.length > 1) {
              ctx.strokeStyle = 'rgba(255, 51, 0, 0.25)';
              ctx.lineWidth = 14;
              ctx.beginPath();
              ctx.moveTo(this.trail[0].x, this.trail[0].y);
              for (let i = 1; i < this.trail.length; i++) {
                ctx.lineTo(this.trail[i].x, this.trail[i].y);
              }
              ctx.stroke();
            }

            ctx.beginPath();
            ctx.arc(this.x, this.y, 11, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(this.x, this.y, 5, 0, Math.PI * 2);
            ctx.fill();
          } else {
            // Glow and Energy ball
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ff0099';
            ctx.fillStyle = '#ff6600';
            
            // Draw tail trail
            if (this.trail.length > 1) {
              ctx.strokeStyle = 'rgba(255, 0, 153, 0.3)';
              ctx.lineWidth = 4;
              ctx.beginPath();
              ctx.moveTo(this.trail[0].x, this.trail[0].y);
              for (let i = 1; i < this.trail.length; i++) {
                ctx.lineTo(this.trail[i].x, this.trail[i].y);
              }
              ctx.stroke();
            }

            ctx.beginPath();
            ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
            ctx.fill();
          }
        } else {
          // Player Bullet (Modified by weaponLevel)
          let color = '#00ffff';
          let glow = '#00ffff';

          if (this.weaponLevel === 2) {
            color = '#ff00ff';
            glow = '#ff00ff';
          } else if (this.weaponLevel === 3) {
            color = '#ffaa00';
            glow = '#ffd700';
          } else if (this.weaponLevel === 4) {
            color = '#39ff14';
            glow = '#39ff14';
          } else if (this.weaponLevel >= 5) {
            color = '#bd00ff';
            glow = '#bd00ff';
          }

          ctx.shadowBlur = 12;
          ctx.shadowColor = glow;
          ctx.fillStyle = color;
          
          ctx.translate(this.x, this.y);
          ctx.rotate(this.angle);
          
          ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);

          // Bright inner core
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(-this.width / 4, -this.height / 2, this.width / 2, this.height);
        }
        ctx.restore();
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = 40 + Math.random() * 120;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.decay = 1.4 + Math.random() * 1.6;
        this.size = 2 + Math.random() * 2.5;
      }

      update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.vy += 30 * dt; // slight downward drift
        this.life -= this.decay * dt;
      }

      draw(ctx) {
        if (this.life <= 0) return;
        ctx.save();
        ctx.globalAlpha = this.life;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
    class Shockwave {
      constructor(x, y, maxRadius, color) {
        this.x = x;
        this.y = y;
        this.maxRadius = maxRadius;
        this.color = color || '#bd00ff';
        this.life = 1.0;
        this.decay = 2.0; // fades out in 0.5s
        this.radius = 0;
      }

      update(dt) {
        this.life -= this.decay * dt;
        this.radius = (1.0 - Math.max(0, this.life)) * this.maxRadius;
      }

      draw(ctx) {
        if (this.life <= 0) return;
        ctx.save();
        ctx.shadowBlur = 20;
        ctx.shadowColor = this.color;
        ctx.strokeStyle = this.color;
        ctx.globalAlpha = this.life;
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    // --- HOMING MISSILE ---
    class Missile {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 80; // initial downward nudge
        this.speed = 160;
        this.life = 3.0;   // explodes after 3 seconds
        this.active = true;
        this.trail = [];
        this.width = 10;
        this.height = 10;
        this.angle = 0;
      }

      update(dt) {
        this.life -= dt;
        if (this.life <= 0) {
          this.explode();
          return;
        }

        // Steer towards player
        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const dist = Math.hypot(dx, dy) || 1;
        const targetVx = (dx / dist) * this.speed;
        const targetVy = (dy / dist) * this.speed;
        const turnRate = 3.5; // steering aggressiveness
        this.vx += (targetVx - this.vx) * turnRate * dt;
        this.vy += (targetVy - this.vy) * turnRate * dt;

        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > 8) this.trail.shift();

        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.angle = Math.atan2(this.vy, this.vx);

        if (this.x < -60 || this.x > V_WIDTH + 60 || this.y < -60 || this.y > V_HEIGHT + 60) {
          this.active = false;
        }
      }

      explode() {
        this.active = false;
        // Explosion particles
        for (let i = 0; i < 20; i++) {
          particles.push(new Particle(this.x, this.y, i % 2 === 0 ? '#ff6600' : '#ff0055'));
        }
        audioEngine.playEnemyExplosion();
        // Damage player if in blast radius
        const blastRadius = 40;
        const dist = Math.hypot(player.x - this.x, player.y - this.y);
        if (dist < blastRadius && !player.shieldActive) {
          const hit = player.triggerDamage();
          if (hit) waveManager.waveDamageTaken = true;
          if (player.lives <= 0) triggerGameOver();
        } else if (dist < blastRadius && player.shieldActive) {
          for (let i = 0; i < 8; i++) particles.push(new Particle(player.x, player.y, '#00ffff'));
        }
      }

      draw(ctx) {
        if (!this.active) return;
        ctx.save();

        // Trail
        if (this.trail.length > 1) {
          ctx.strokeStyle = 'rgba(255, 100, 0, 0.35)';
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.moveTo(this.trail[0].x, this.trail[0].y);
          for (let i = 1; i < this.trail.length; i++) ctx.lineTo(this.trail[i].x, this.trail[i].y);
          ctx.stroke();
        }

        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        // Missile body
        ctx.shadowBlur = 18;
        ctx.shadowColor = '#ff6600';
        ctx.fillStyle = '#ff9900';
        ctx.fillRect(-10, -4, 20, 8);

        // Nose tip
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(10, 0);
        ctx.lineTo(6, -4);
        ctx.lineTo(6, 4);
        ctx.closePath();
        ctx.fill();

        // Fins
        ctx.fillStyle = '#ff0055';
        ctx.shadowColor = '#ff0055';
        ctx.beginPath();
        ctx.moveTo(-8, -4);
        ctx.lineTo(-12, -9);
        ctx.lineTo(-6, -4);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-8, 4);
        ctx.lineTo(-12, 9);
        ctx.lineTo(-6, 4);
        ctx.closePath();
        ctx.fill();

        // Life timer ring (shows how long until detonation)
        ctx.rotate(-this.angle);
        const lifeRatio = this.life / 3.0;
        ctx.strokeStyle = `rgba(255, 200, 0, ${0.6 + Math.sin(Date.now() * 0.01) * 0.4})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 14, -Math.PI / 2, -Math.PI / 2 + lifeRatio * Math.PI * 2);
        ctx.stroke();

        ctx.restore();
      }
    }

    class PowerUp {
      constructor(x, y, type = 'WEAPON') {
        this.x = x;
        this.y = y;
        this.type = type; // 'WEAPON', 'SHIELD', 'MEDKIT', or 'MISSILE_KIT'
        this.width = (type === 'MEDKIT' || type === 'MISSILE_KIT') ? 28 : 20;
        this.height = (type === 'MEDKIT' || type === 'MISSILE_KIT') ? 28 : 20;
        this.speed = type === 'MEDKIT' ? 70 : 95; // MEDKIT falls slower so player can catch it
        this.active = true;
        this.pulseTime = Math.random() * 100;
      }

      update(dt) {
        this.y += this.speed * dt;
        this.pulseTime += dt * 8;
        if (this.y > V_HEIGHT + 30) {
          this.active = false;
        }
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        const size = this.width / 2;
        const pulse = 1.0 + Math.sin(this.pulseTime) * 0.15;
        ctx.scale(pulse, pulse);

        if (this.type === 'WEAPON') {
          // Yellow powerup diamond
          ctx.shadowBlur = 15;
          ctx.shadowColor = '#ffd700';
          ctx.strokeStyle = '#ffd700';
          ctx.lineWidth = 2;
          ctx.fillStyle = 'rgba(255, 215, 0, 0.2)';

          ctx.beginPath();
          ctx.moveTo(0, -size);
          ctx.lineTo(size, 0);
          ctx.lineTo(0, size);
          ctx.lineTo(-size, 0);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.font = 'bold 9px "Orbitron", monospace';
          ctx.fillStyle = '#ffffff';
          ctx.shadowBlur = 0;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('W', 0, 0);
        } else if (this.type === 'SHIELD') {
          // Blue-cyan hexagon for Shield powerup
          ctx.shadowBlur = 15;
          ctx.shadowColor = '#00ffff';
          ctx.strokeStyle = '#00ffff';
          ctx.lineWidth = 2;
          ctx.fillStyle = 'rgba(0, 255, 255, 0.2)';

          ctx.beginPath();
          for (let i = 0; i < 6; i++) {
            const angle = i * Math.PI / 3 - Math.PI / 6;
            ctx.lineTo(Math.cos(angle) * size, Math.sin(angle) * size);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.font = 'bold 9px "Orbitron", monospace';
          ctx.fillStyle = '#ffffff';
          ctx.shadowBlur = 0;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('S', 0, 0);
        } else if (this.type === 'MEDKIT') {
          // Red glowing cross — emergency life restore
          ctx.shadowBlur = 22;
          ctx.shadowColor = '#ff0055';
          ctx.strokeStyle = '#ff0055';
          ctx.lineWidth = 2;
          ctx.fillStyle = 'rgba(255, 0, 85, 0.18)';

          // Outer circle background
          ctx.beginPath();
          ctx.arc(0, 0, size, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Cross arms
          const arm = size * 0.55;
          const thick = size * 0.28;
          ctx.fillStyle = '#ff0055';
          ctx.shadowBlur = 18;
          ctx.fillRect(-thick, -arm, thick * 2, arm * 2); // vertical
          ctx.fillRect(-arm, -thick, arm * 2, thick * 2); // horizontal

          // White inner shine
          ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
          ctx.shadowBlur = 0;
          ctx.fillRect(-thick * 0.5, -arm * 0.7, thick, arm * 1.4);
          ctx.fillRect(-arm * 0.7, -thick * 0.5, arm * 1.4, thick);
        } else if (this.type === 'MISSILE_KIT') {
          // Purple glowing missile icon — homing missile powerup
          ctx.shadowBlur = 22;
          ctx.shadowColor = '#bd00ff';
          ctx.strokeStyle = '#bd00ff';
          ctx.lineWidth = 2;
          ctx.fillStyle = 'rgba(189, 0, 255, 0.18)';

          // Pentagon border
          ctx.beginPath();
          for (let i = 0; i < 5; i++) {
            const angle = i * (Math.PI * 2 / 5) - Math.PI / 2;
            ctx.lineTo(Math.cos(angle) * size, Math.sin(angle) * size);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Missile silhouette inside
          ctx.fillStyle = '#ffffff';
          ctx.shadowBlur = 6;
          ctx.shadowColor = '#bd00ff';
          // Body
          ctx.fillRect(-size * 0.12, -size * 0.45, size * 0.24, size * 0.65);
          // Nose tip
          ctx.beginPath();
          ctx.moveTo(0, -size * 0.55);
          ctx.lineTo(-size * 0.12, -size * 0.35);
          ctx.lineTo(size * 0.12, -size * 0.35);
          ctx.closePath();
          ctx.fill();
          // Fins
          ctx.fillStyle = '#ff00ff';
          ctx.beginPath();
          ctx.moveTo(-size * 0.12, size * 0.15);
          ctx.lineTo(-size * 0.3, size * 0.35);
          ctx.lineTo(-size * 0.12, size * 0.22);
          ctx.closePath();
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(size * 0.12, size * 0.15);
          ctx.lineTo(size * 0.3, size * 0.35);
          ctx.lineTo(size * 0.12, size * 0.22);
          ctx.closePath();
          ctx.fill();
        } else if (this.type === 'SUPERPOWER') {
          // Golden star-shaped superpower kit
          ctx.shadowBlur = 25;
          ctx.shadowColor = '#ffd700';
          ctx.strokeStyle = '#ffd700';
          ctx.lineWidth = 2.5;
          ctx.fillStyle = 'rgba(255, 215, 0, 0.25)';

          ctx.beginPath();
          for (let i = 0; i < 16; i++) {
            const angle = i * Math.PI / 8 - Math.PI / 2;
            const r = (i % 2 === 0) ? size * 1.15 : size * 0.55;
            ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.font = 'bold 9px "Orbitron", monospace';
          ctx.fillStyle = '#ffffff';
          ctx.shadowBlur = 0;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('SP', 0, 0);
        }

        ctx.restore();
      }
    }

    // --- PLAYER HOMING MISSILE ---
    class PlayerMissile {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = -120; // initial upward nudge toward enemies
        this.speed = 300;
        this.damage = 4.0;   // 4x a normal bullet (improved!)
        this.blastRadius = 120; // improved blast radius (from 50 to 120)
        this.life = 2.0; // explodes after 2 seconds if no target hit
        this.active = true;
        this.trail = [];
        this.width = 12;
        this.height = 12;
        this.angle = -Math.PI / 2;
      }

      _nearestEnemy() {
        let best = null;
        let bestDist = Infinity;
        enemies.forEach(e => {
          if (!e.active) return;
          const d = Math.hypot(e.x - this.x, e.y - this.y);
          if (d < bestDist) { bestDist = d; best = e; }
        });
        return best;
      }

      update(dt) {
        this.life -= dt;
        if (this.life <= 0 || enemies.length === 0) {
          this.explode();
          return;
        }

        const target = this._nearestEnemy();
        if (target) {
          const dx = target.x - this.x;
          const dy = target.y - this.y;
          const dist = Math.hypot(dx, dy) || 1;
          const tx = (dx / dist) * this.speed;
          const ty = (dy / dist) * this.speed;
          const turn = 5.0;
          this.vx += (tx - this.vx) * turn * dt;
          this.vy += (ty - this.vy) * turn * dt;
        }

        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > 10) this.trail.shift();

        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.angle = Math.atan2(this.vy, this.vx);

        // Hit detection — explode on first enemy contact
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          if (!e.active) continue;
          const d = Math.hypot(e.x - this.x, e.y - this.y);
          if (d < (e.width / 2) + 8) {
            this.explode();
            return;
          }
        }

        if (this.x < -80 || this.x > V_WIDTH + 80 || this.y < -80 || this.y > V_HEIGHT + 80) {
          this.active = false;
        }
      }

      explode() {
        this.active = false;
        // Explosion particles — bigger than normal
        for (let i = 0; i < 30; i++) {
          particles.push(new Particle(this.x, this.y, i % 3 === 0 ? '#ffffff' : (i % 3 === 1 ? '#bd00ff' : '#ff00ff')));
        }
        // Spawn a glowing expanding purple shockwave ring
        particles.push(new Shockwave(this.x, this.y, this.blastRadius, '#bd00ff'));
        audioEngine.playEnemyExplosion();

        // Area damage — hits all enemies within blastRadius
        let anyDestroyed = false;
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          if (!e.active) continue;
          const d = Math.hypot(e.x - this.x, e.y - this.y);
          if (d < this.blastRadius) {
            const destroyed = e.takeDamage(this.damage);
            if (destroyed) {
              audioEngine.playEnemyExplosion();
              score += e.scoreValue;
              for (let p = 0; p < 10; p++) {
                particles.push(new Particle(e.x, e.y, e.color));
              }
              const isBossWave = (waveManager.currentWave === 8 || waveManager.currentWave === 16 || waveManager.currentWave === 24);
              if (!e.isLeftover && !isBossWave) waveManager.enemiesDestroyed++;
              anyDestroyed = true;
            }
          }
        }

        if (anyDestroyed) {
          const isBossWave = (waveManager.currentWave === 8 || waveManager.currentWave === 16 || waveManager.currentWave === 24);
          if (!isBossWave && waveManager.enemiesDestroyed >= waveManager.enemiesTotal) {
            triggerWaveClear();
          }
        }
      }

      draw(ctx) {
        if (!this.active) return;
        ctx.save();

        // Glowing purple trail
        if (this.trail.length > 1) {
          ctx.strokeStyle = 'rgba(189, 0, 255, 0.5)';
          ctx.lineWidth = 6;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(this.trail[0].x, this.trail[0].y);
          for (let i = 1; i < this.trail.length; i++) ctx.lineTo(this.trail[i].x, this.trail[i].y);
          ctx.stroke();
        }

        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        // Missile body — purple/magenta
        ctx.shadowBlur = 22;
        ctx.shadowColor = '#bd00ff';
        ctx.fillStyle = '#cc44ff';
        ctx.fillRect(-12, -4, 24, 8);

        // Bright nose
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(12, 0);
        ctx.lineTo(7, -5);
        ctx.lineTo(7, 5);
        ctx.closePath();
        ctx.fill();

        // Fins
        ctx.fillStyle = '#ff00ff';
        ctx.shadowColor = '#ff00ff';
        ctx.beginPath();
        ctx.moveTo(-8, -4);
        ctx.lineTo(-14, -10);
        ctx.lineTo(-6, -4);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-8, 4);
        ctx.lineTo(-14, 10);
        ctx.lineTo(-6, 4);
        ctx.closePath();
        ctx.fill();

        // Blast radius ring pulse
        ctx.rotate(-this.angle);
        const alpha = 0.15 + Math.sin(Date.now() * 0.008) * 0.1;
        ctx.strokeStyle = `rgba(189, 0, 255, ${alpha})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, 0, this.blastRadius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();
      }
    }
    class Player {
      constructor() {
        this.width = 36;
        this.height = 36;
        this.x = V_WIDTH / 2;
        this.y = V_HEIGHT - 80;
        this.targetX = V_WIDTH / 2;
        this.targetY = V_HEIGHT - 80;
        this.lives = 3;
        this.invulnerable = false;
        this.invulnerableTimer = 0;
        this.shieldActive = false;
        this.shieldTimer = 0;
        this.shootTimer = 0;
        this.shootCooldown = 0.3; // 300ms
        this.speed = 10; // interpolation rate
        this.weaponLevel = 1; // 1 (Default), 2 (Triple), 3 (Quad Heavy)
      }

      reset() {
        this.x = V_WIDTH / 2;
        this.y = V_HEIGHT - 80;
        this.targetX = V_WIDTH / 2;
        this.targetY = V_HEIGHT - 80;
        this.lives = 3;
        this.invulnerable = false;
        this.invulnerableTimer = 0;
        this.shieldActive = false;
        this.shieldTimer = 0;
        this.shootTimer = 0;
        this.weaponLevel = 1;
      }

      activateShield(duration) {
        this.shieldActive = true;
        this.shieldTimer = duration;
      }

      triggerDamage() {
        if (this.shieldActive || this.invulnerable) return false;
        this.lives--;
        audioEngine.playPlayerHit();
        if (this.lives > 0) {
          this.invulnerable = true;
          this.invulnerableTimer = 1.5;
        }
        return true;
      }

      update(dt, bullets) {
        // Interpolate horizontal & vertical position
        this.x += (this.targetX - this.x) * this.speed * dt;
        this.y += (this.targetY - this.y) * this.speed * dt;
        
        // Clamp boundaries
        const boundLimit = this.width / 2 + 10;
        if (this.x < boundLimit) this.x = boundLimit;
        if (this.x > V_WIDTH - boundLimit) this.x = V_WIDTH - boundLimit;

        const boundLimitY = this.height / 2 + 10;
        if (this.y < boundLimitY) this.y = boundLimitY;
        if (this.y > V_HEIGHT - boundLimitY) this.y = V_HEIGHT - boundLimitY;

        // Manage Invulnerability
        if (this.invulnerable) {
          this.invulnerableTimer -= dt;
          if (this.invulnerableTimer <= 0) {
            this.invulnerable = false;
          }
        }

        // Manage Shield
        if (this.shieldActive) {
          this.shieldTimer -= dt;
          if (this.shieldTimer <= 0) {
            this.shieldActive = false;
            this.shieldTimer = 0;
          }
        }

        // Auto Shooting
        if (gameState === 'PLAYING') {
          this.shootTimer += dt;
          if (this.shootTimer >= this.shootCooldown) {
            this.shootTimer = 0;
            
            // Firing patterns depending on weaponLevel
            if (this.weaponLevel === 1) {
              // Level 1: 2 parallel lasers (cyan), damage 1
              bullets.push(new Bullet(this.x - 10, this.y - 12, false, 1, 0, 1.0));
              bullets.push(new Bullet(this.x + 10, this.y - 12, false, 1, 0, 1.0));
            } else if (this.weaponLevel === 2) {
              // Level 2: 3 spread lasers (magenta), damage 1.2
              bullets.push(new Bullet(this.x, this.y - 12, false, 2, 0, 1.2)); // straight
              bullets.push(new Bullet(this.x - 12, this.y - 10, false, 2, -0.15, 1.2)); // left angled
              bullets.push(new Bullet(this.x + 12, this.y - 10, false, 2, 0.15, 1.2)); // right angled
            } else if (this.weaponLevel === 3) {
              // Level 3: 4 spread heavy lasers (gold/orange), damage 1.5
              bullets.push(new Bullet(this.x - 8, this.y - 14, false, 3, 0, 1.5)); // straight-left
              bullets.push(new Bullet(this.x + 8, this.y - 14, false, 3, 0, 1.5)); // straight-right
              bullets.push(new Bullet(this.x - 18, this.y - 10, false, 3, -0.28, 1.5)); // left angled
              bullets.push(new Bullet(this.x + 18, this.y - 10, false, 3, 0.28, 1.5)); // right angled
            } else if (this.weaponLevel === 4) {
              // Level 4: 5 spread heavy lasers (neon green), damage 2.0
              bullets.push(new Bullet(this.x, this.y - 15, false, 4, 0, 2.0)); // straight center
              bullets.push(new Bullet(this.x - 10, this.y - 12, false, 4, -0.15, 2.0)); // mid-left angled
              bullets.push(new Bullet(this.x + 10, this.y - 12, false, 4, 0.15, 2.0)); // mid-right angled
              bullets.push(new Bullet(this.x - 20, this.y - 10, false, 4, -0.30, 2.0)); // far-left angled
              bullets.push(new Bullet(this.x + 20, this.y - 10, false, 4, 0.30, 2.0)); // far-right angled
            } else {
              // Level 5: 6 spread heavy lasers (bright purple/violet), damage 2.5
              bullets.push(new Bullet(this.x - 5, this.y - 15, false, 5, -0.05, 2.5)); // mid-left-straight
              bullets.push(new Bullet(this.x + 5, this.y - 15, false, 5, 0.05, 2.5)); // mid-right-straight
              bullets.push(new Bullet(this.x - 15, this.y - 12, false, 5, -0.20, 2.5)); // mid-left angled
              bullets.push(new Bullet(this.x + 15, this.y - 12, false, 5, 0.18, 2.5)); // mid-right angled
              bullets.push(new Bullet(this.x - 25, this.y - 10, false, 5, -0.38, 2.5)); // far-left angled
              bullets.push(new Bullet(this.x + 25, this.y - 10, false, 5, 0.38, 2.5)); // far-right angled
            }
            audioEngine.playPlayerShoot();
          }
        }
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);

        // Flashing visibility calculation
        if (this.invulnerable && Math.floor(tick / 5) % 2 === 0) {
          ctx.restore();
          return;
        }

        const w = this.width;
        const h = this.height;

        // 1. Engine flame (colors match weapon level)
        if (Math.random() > 0.15) {
          ctx.beginPath();
          let flameGrad = ctx.createLinearGradient(0, h / 2 - 2, 0, h / 2 + 16 + Math.random() * 12);
          
          if (this.weaponLevel === 1) {
            flameGrad.addColorStop(0, '#00ffff');
            flameGrad.addColorStop(0.4, '#0088ff');
          } else if (this.weaponLevel === 2) {
            flameGrad.addColorStop(0, '#ff00ff');
            flameGrad.addColorStop(0.4, '#8800ff');
          } else if (this.weaponLevel === 3) {
            flameGrad.addColorStop(0, '#ffd700');
            flameGrad.addColorStop(0.4, '#ff5500');
          } else if (this.weaponLevel === 4) {
            flameGrad.addColorStop(0, '#39ff14');
            flameGrad.addColorStop(0.4, '#00aa00');
          } else {
            flameGrad.addColorStop(0, '#bd00ff');
            flameGrad.addColorStop(0.4, '#6600cc');
          }
          flameGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          
          ctx.fillStyle = flameGrad;
          ctx.moveTo(-5, h / 2 - 4);
          ctx.lineTo(5, h / 2 - 4);
          ctx.lineTo(0, h / 2 + 16 + Math.random() * 12);
          ctx.closePath();
          ctx.fill();
        }

        // Color configurations based on weapon level
        let mainColor = '#00ffff';
        let wingColor = '#39ff14';
        let glowColor = '#00ffff';

        if (this.weaponLevel === 2) {
          mainColor = '#ff00ff';
          wingColor = '#00ffff';
          glowColor = '#ff00ff';
        } else if (this.weaponLevel === 3) {
          mainColor = '#ff5500';
          wingColor = '#ffd700';
          glowColor = '#ffd700';
        } else if (this.weaponLevel === 4) {
          mainColor = '#39ff14';
          wingColor = '#00ffaa';
          glowColor = '#39ff14';
        } else if (this.weaponLevel >= 5) {
          mainColor = '#bd00ff';
          wingColor = '#ff00ff';
          glowColor = '#bd00ff';
        }

        ctx.shadowBlur = 12;
        ctx.shadowColor = glowColor;

        // Draw player ship designs (Shape changes dynamically with weapon levels)
        if (this.weaponLevel === 1) {
          // Level 1: Traditional triangular ship
          ctx.fillStyle = wingColor;
          ctx.beginPath();
          ctx.moveTo(0, -h / 2);
          ctx.quadraticCurveTo(-w / 3, h / 6, -w / 2, h / 2);
          ctx.quadraticCurveTo(-w / 4, h / 3, 0, h / 4);
          ctx.closePath();
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(0, -h / 2);
          ctx.quadraticCurveTo(w / 3, h / 6, w / 2, h / 2);
          ctx.quadraticCurveTo(w / 4, h / 3, 0, h / 4);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = mainColor;
          ctx.beginPath();
          ctx.moveTo(0, -h / 2);
          ctx.lineTo(-w / 3, h / 2.5);
          ctx.lineTo(w / 3, h / 2.5);
          ctx.closePath();
          ctx.fill();

        } else if (this.weaponLevel === 2) {
          // Level 2: Hexagonal wing extension style
          ctx.fillStyle = wingColor;
          ctx.beginPath();
          ctx.moveTo(-w / 4, -h / 4);
          ctx.lineTo(-w * 0.6, h / 3);
          ctx.lineTo(-w / 3, h / 2);
          ctx.closePath();
          ctx.fill();
          
          ctx.beginPath();
          ctx.moveTo(w / 4, -h / 4);
          ctx.lineTo(w * 0.6, h / 3);
          ctx.lineTo(w / 3, h / 2);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = wingColor;
          ctx.beginPath();
          ctx.moveTo(0, -h / 2);
          ctx.lineTo(-w / 2, h / 3);
          ctx.lineTo(0, h / 5);
          ctx.closePath();
          ctx.fill();
          
          ctx.beginPath();
          ctx.moveTo(0, -h / 2);
          ctx.lineTo(w / 2, h / 3);
          ctx.lineTo(0, h / 5);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = mainColor;
          ctx.beginPath();
          ctx.moveTo(0, -h / 2 - 4);
          ctx.lineTo(-w / 3, h / 3);
          ctx.lineTo(-w / 6, h / 2);
          ctx.lineTo(w / 6, h / 2);
          ctx.lineTo(w / 3, h / 3);
          ctx.closePath();
          ctx.fill();

        } else {
          // Level 3: Crescent-winged forward horns style
          ctx.fillStyle = wingColor;
          ctx.beginPath();
          ctx.moveTo(-w / 6, -h / 3);
          ctx.lineTo(-w * 0.7, h / 3);
          ctx.lineTo(-w * 0.5, h / 2);
          ctx.lineTo(-w / 3, h / 3);
          ctx.closePath();
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(w / 6, -h / 3);
          ctx.lineTo(w * 0.7, h / 3);
          ctx.lineTo(w * 0.5, h / 2);
          ctx.lineTo(w / 3, h / 3);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = mainColor;
          ctx.beginPath();
          ctx.moveTo(-w / 4, h / 4);
          ctx.lineTo(-w / 3, -h / 2);
          ctx.lineTo(-w / 6, -h / 4);
          ctx.closePath();
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(w / 4, h / 4);
          ctx.lineTo(w / 3, -h / 2);
          ctx.lineTo(w / 6, -h / 4);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = mainColor;
          ctx.beginPath();
          ctx.moveTo(0, -h / 2 - 8);
          ctx.lineTo(-w / 4, h / 3);
          ctx.lineTo(w / 4, h / 3);
          ctx.closePath();
          ctx.fill();
        }

        // 5. Cockpit
        if (this.weaponLevel === 1) {
          ctx.fillStyle = 'rgba(130, 225, 255, 0.75)';
        } else if (this.weaponLevel === 2) {
          ctx.fillStyle = 'rgba(255, 130, 225, 0.75)';
        } else {
          ctx.fillStyle = 'rgba(255, 225, 130, 0.85)';
        }
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, -h / 4);
        ctx.lineTo(-w / 7, h / 8);
        ctx.lineTo(w / 7, h / 8);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 6. Shield outline ring
        if (this.invulnerable) {
          ctx.shadowColor = glowColor;
          ctx.strokeStyle = `rgba(${this.weaponLevel === 1 ? '0, 255, 255' : (this.weaponLevel === 2 ? '255, 0, 255' : '255, 215, 0')}, ${0.4 + Math.sin(tick * 0.25) * 0.35})`;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(0, 0, w * 0.95, 0, Math.PI * 2);
          ctx.stroke();
        }

        // 30-Second Shield Bubble (Cyan)
        if (this.shieldActive) {
          ctx.shadowBlur = 18;
          ctx.shadowColor = '#00ffff';
          ctx.strokeStyle = `rgba(0, 255, 255, ${0.6 + Math.sin(tick * 0.15) * 0.25})`;
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.arc(0, 0, w * 1.1, 0, Math.PI * 2);
          ctx.stroke();
          
          // Soft fill
          ctx.fillStyle = `rgba(0, 255, 255, ${0.08 + Math.sin(tick * 0.1) * 0.04})`;
          ctx.beginPath();
          ctx.arc(0, 0, w * 1.1, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }
    }

    // --- ENEMY SHIPS & PROCEDURAL DRAWS ---
    function drawEnemyA(ctx, x, y, size, pulse) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(pulse, pulse);
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#ff6600';
      ctx.strokeStyle = '#ff6600';
      ctx.lineWidth = 2.5;

      // Hexagon shape
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        let angle = i * Math.PI / 3;
        let px = Math.cos(angle) * size;
        let py = Math.sin(angle) * (size * 0.8);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();

      // Yellow energy nucleus
      ctx.fillStyle = '#ffff00';
      ctx.shadowColor = '#ffff00';
      ctx.beginPath();
      ctx.arc(0, 0, size * 0.35, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawEnemyB(ctx, x, y, size, pulse) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(pulse, pulse);
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#ff0099';
      ctx.strokeStyle = '#ff0099';
      ctx.lineWidth = 2;

      // Antenna details
      ctx.beginPath();
      ctx.moveTo(-size / 3, -size / 2);
      ctx.lineTo(-size / 2 - 4, -size - 2);
      ctx.moveTo(size / 3, -size / 2);
      ctx.lineTo(size / 2 + 4, -size - 2);
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ffffff';
      ctx.beginPath();
      ctx.arc(-size / 2 - 4, -size - 2, 2.5, 0, Math.PI * 2);
      ctx.arc(size / 2 + 4, -size - 2, 2.5, 0, Math.PI * 2);

      // Rhombus with white borders

      ctx.moveTo(0, -size);
      ctx.lineTo(size * 0.75, 0);

      ctx.closePath();
      ctx.strokeStyle = '#ffffff';

      // Pink core

    function drawEnemyC(ctx, x, y, size, pulse) {

    function drawBoss1(ctx, x, y, size, pulse) {

      ctx.shadowColor = '#00ffcc';
      ctx.strokeStyle = '#00ffcc';
      ctx.lineWidth = 3;

      ctx.fillStyle = 'rgba(0, 255, 204, 0.15)';
      ctx.beginPath();
      ctx.ellipse(0, 0, size * 1.5, size * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Draw central cockpit dome
      ctx.fillStyle = 'rgba(0, 255, 255, 0.45)';

      ctx.arc(0, -size * 0.1, size * 0.6, Math.PI, 0);

      // Draw inner glow ring inside saucer
      ctx.strokeStyle = '#ffffff';

      const lightCount = 6;
      const timeSec = tick * 0.05;
      for (let i = 0; i < lightCount; i++) {

        const lx = Math.cos(angle) * (size * 1.3);
        const ly = Math.sin(angle) * (size * 0.4);
        
        // Alternating green/yellow flash
        const flash = Math.sin(timeSec + i) > 0;
        ctx.fillStyle = flash ? '#39ff14' : '#ffd700';
        ctx.shadowColor = flash ? '#39ff14' : '#ffd700';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(lx, ly, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw bottom thruster glow
      ctx.fillStyle = '#ff3300';
      ctx.shadowColor = '#ff3300';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(0, size * 0.4, size * 0.3, 0, Math.PI * 2);
      ctx.fill();
