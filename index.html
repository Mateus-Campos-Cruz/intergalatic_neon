<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Intergalactic Neon — Space Shooter</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050010;
      font-family: 'Orbitron', monospace;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    
    #gameCanvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #audioNotice {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: rgba(0, 255, 255, 0.4);
      pointer-events: none;
      z-index: 10;
      text-align: center;
      letter-spacing: 1px;
      text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
    }

    #footerNotice {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: rgba(255, 255, 255, 0.35);
      pointer-events: none;
      z-index: 10;
      text-align: center;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 5px rgba(0, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="audioNotice">CLIQUE OU TOQUE NA TELA PARA ATIVAR O SOM SINTETIZADO</div>
  <div id="footerNotice">Criado por Mateus Cruz</div>

  <script>
    // --- UTILS & CORE SETTINGS ---
    const V_WIDTH = 480;   // Virtual logic width
    const V_HEIGHT = 800;  // Virtual logic height
    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;
    
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let gameState = 'MENU'; // MENU, PLAYING, WAVE_CLEAR, GAME_OVER
    let score = 0;
    let highscore = parseInt(localStorage.getItem('intergalactic_neon_highscore') || '0', 10);
    let tick = 0;

    // --- PROCEDURAL AUDIO ENGINE ---
    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.padGain = null;
        this.reverbNode = null;
        this.oscillators = [];
        this.lfos = [];
        this.initialized = false;
        this.muted = false;
      }

      init() {
        if (this.initialized) return;
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
          
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.setValueAtTime(this.muted ? 0 : 0.15, this.ctx.currentTime);
          this.masterGain.connect(this.ctx.destination);

          // Simulate Reverb with procedural Impulse Response buffer
          this.reverbNode = this.ctx.createConvolver();
          this.reverbNode.buffer = this.createReverbBuffer(2.0, 2.0);
          this.reverbNode.connect(this.masterGain);

          this.startAmbientPad();
          this.initialized = true;

          const notice = document.getElementById('audioNotice');
          if (notice) notice.style.display = 'none';
        } catch (e) {
          console.warn("Web Audio API not supported/blocked:", e);
        }
      }

      toggleMute() {
        this.muted = !this.muted;
        if (this.ctx && this.masterGain) {
          this.masterGain.gain.setValueAtTime(this.muted ? 0 : 0.15, this.ctx.currentTime);
        }
        return this.muted;
      }

      resume() {
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      createReverbBuffer(duration, decay) {
        const sampleRate = this.ctx ? this.ctx.sampleRate : 44100;
        const len = sampleRate * duration;
        const buffer = this.ctx.createBuffer(2, len, sampleRate);
        
        for (let channel = 0; channel < 2; channel++) {
          const channelData = buffer.getChannelData(channel);
          for (let i = 0; i < len; i++) {
            const t = i / sampleRate;
            channelData[i] = (Math.random() * 2 - 1) * Math.pow(1 - t / duration, decay);
          }
        }
        return buffer;
      }

      startAmbientPad() {
        // A minor chord frequencies: A1(55Hz), A2(110Hz), E3(164.81Hz), A3(220Hz), C4(261.63Hz)
        const notes = [
          { freq: 55, type: 'triangle', vol: 0.15 },
          { freq: 110, type: 'triangle', vol: 0.12 },
          { freq: 164.81, type: 'sine', vol: 0.08 },
          { freq: 220, type: 'sine', vol: 0.08 },
          { freq: 261.63, type: 'sine', vol: 0.06 }
        ];

        this.padGain = this.ctx.createGain();
        this.padGain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        this.padGain.connect(this.masterGain);
        this.padGain.connect(this.reverbNode);

        notes.forEach((note, index) => {
          const osc = this.ctx.createOscillator();
          osc.type = note.type;
          osc.frequency.setValueAtTime(note.freq, this.ctx.currentTime);

          const oscGain = this.ctx.createGain();
          oscGain.gain.setValueAtTime(note.vol, this.ctx.currentTime);

          osc.connect(oscGain);
          oscGain.connect(this.padGain);
          osc.start();
          this.oscillators.push(osc);

          // Slow LFO to modulate volumes for a breathing sound (approx 0.07Hz - 0.13Hz)
          const lfo = this.ctx.createOscillator();
          lfo.frequency.setValueAtTime(0.06 + index * 0.015, this.ctx.currentTime);

          const lfoGain = this.ctx.createGain();
          lfoGain.gain.setValueAtTime(note.vol * 0.6, this.ctx.currentTime);

          lfo.connect(lfoGain);
          lfoGain.connect(oscGain.gain);
          lfo.start();

          this.lfos.push({ osc: lfo, gain: lfoGain });
        });
      }

      playPlayerShoot() {
        if (!this.initialized) return;
        this.resume();
        const now = this.ctx.currentTime;

        // Beep sweep
        const osc = this.ctx.createOscillator();
        const oscGain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(1300, now + 0.08);

        oscGain.gain.setValueAtTime(0.1, now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

        osc.connect(oscGain);
        oscGain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.08);

        // Filtered noise pulse
        const bufferSize = this.ctx.sampleRate * 0.06;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noiseNode = this.ctx.createBufferSource();
        noiseNode.buffer = noiseBuffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1100, now);
        filter.Q.setValueAtTime(4, now);

        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.12, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

        noiseNode.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(this.masterGain);

        noiseNode.start(now);
        noiseNode.stop(now + 0.06);
      }

      playEnemyExplosion() {
        if (!this.initialized) return;
        this.resume();
        const now = this.ctx.currentTime;
        const duration = 0.2;

        const bufferSize = this.ctx.sampleRate * duration;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noiseNode = this.ctx.createBufferSource();
        noiseNode.buffer = noiseBuffer;

        const lpFilter = this.ctx.createBiquadFilter();
        lpFilter.type = 'lowpass';
        lpFilter.frequency.setValueAtTime(900, now);
        lpFilter.frequency.exponentialRampToValueAtTime(80, now + duration);

        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.35, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        noiseNode.connect(lpFilter);
        lpFilter.connect(noiseGain);
        
        noiseGain.connect(this.masterGain);
        noiseGain.connect(this.reverbNode); // send explosions to reverb

        noiseNode.start(now);
        noiseNode.stop(now + duration);
      }

      playPlayerHit() {
        if (!this.initialized) return;
        this.resume();
        const now = this.ctx.currentTime;
        const duration = 0.3;

        const osc = this.ctx.createOscillator();
        const gainNode = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(170, now);
        osc.frequency.linearRampToValueAtTime(30, now + duration);

        gainNode.gain.setValueAtTime(0.35, now);
        gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);

        const lpFilter = this.ctx.createBiquadFilter();
        lpFilter.type = 'lowpass';
        lpFilter.frequency.setValueAtTime(350, now);

        osc.connect(lpFilter);
        lpFilter.connect(gainNode);
        gainNode.connect(this.masterGain);

        osc.start(now);
        osc.stop(now + duration);
      }

      playGameOver() {
        if (!this.initialized) return;
        this.resume();
        const now = this.ctx.currentTime;
        const duration = 1.3;
        const freqs = [98, 131, 185, 233]; // Dissonant chords

        freqs.forEach((freq) => {
          const osc = this.ctx.createOscillator();
          const gainNode = this.ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, now);
          osc.frequency.exponentialRampToValueAtTime(freq * 0.35, now + duration);

          gainNode.gain.setValueAtTime(0.14, now);
          gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);

          const lpFilter = this.ctx.createBiquadFilter();
          lpFilter.type = 'lowpass';
          lpFilter.frequency.setValueAtTime(280, now);

          osc.connect(lpFilter);
          lpFilter.connect(gainNode);
          gainNode.connect(this.masterGain);
          gainNode.connect(this.reverbNode);

          osc.start(now);
          osc.stop(now + duration);
        });
      }

      playWaveClear() {
        if (!this.initialized) return;
        this.resume();
        const now = this.ctx.currentTime;
        const chord = [440, 554.37, 659.25, 880]; // A major

        chord.forEach((freq, idx) => {
          const startTime = now + idx * 0.12;
          const osc = this.ctx.createOscillator();
          const gainNode = this.ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.05, startTime + 0.4);

          gainNode.gain.setValueAtTime(0, startTime);
          gainNode.gain.linearRampToValueAtTime(0.18, startTime + 0.05);
          gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + 0.45);

          osc.connect(gainNode);
          gainNode.connect(this.masterGain);
          gainNode.connect(this.reverbNode);

          osc.start(startTime);
          osc.stop(startTime + 0.45);
        });
      }

      playPowerUp() {
        if (!this.initialized) return;
        this.resume();
        const now = this.ctx.currentTime;
        const chord = [330, 440, 554.37, 659.25, 880]; // Ascending chime

        chord.forEach((freq, idx) => {
          const startTime = now + idx * 0.06;
          const osc = this.ctx.createOscillator();
          const gainNode = this.ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);

          gainNode.gain.setValueAtTime(0, startTime);
          gainNode.gain.linearRampToValueAtTime(0.15, startTime + 0.03);
          gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);

          osc.connect(gainNode);
          gainNode.connect(this.masterGain);

          osc.start(startTime);
          osc.stop(startTime + 0.25);
        });
      }
    }

    const audioEngine = new AudioEngine();

    // --- BACKGROUND STARFIELD ---
    class Star {
      constructor(layer) {
        this.layer = layer;
        this.reset(true);
      }

      reset(randomY = false) {
        this.x = Math.random() * window.innerWidth;
        this.y = randomY ? Math.random() * window.innerHeight : -10;
        
        if (this.layer === 0) {
          this.speed = 15 + Math.random() * 10;
          this.size = 0.7 + Math.random() * 0.4;
          this.color = Math.random() < 0.2 ? '#6655bb' : '#ffffff';
        } else if (this.layer === 1) {
          this.speed = 40 + Math.random() * 20;
          this.size = 1.2 + Math.random() * 0.5;
          this.color = Math.random() < 0.3 ? '#8866cc' : '#ffffff';
        } else {
          this.speed = 85 + Math.random() * 30;
          this.size = 1.8 + Math.random() * 0.7;
          this.color = Math.random() < 0.4 ? '#00ffff' : '#ffffff';
        }
      }

      update(dt) {
        this.y += this.speed * dt;
        if (this.y > window.innerHeight) {
          this.reset(false);
        }
      }

      draw(ctx) {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
      }
    }

    class Nebula {
      constructor() {
        this.reset(true);
      }

      reset(randomY = false) {
        this.x = Math.random() * window.innerWidth;
        this.y = randomY ? Math.random() * window.innerHeight : -250;
        this.radius = 150 + Math.random() * 150;
        this.speed = 8 + Math.random() * 10;
        const colors = [
          { r: 26, g: 0, b: 58, a: 0.15 },
          { r: 61, g: 0, b: 102, a: 0.12 },
          { r: 10, g: 0, b: 32, a: 0.18 }
        ];
        this.color = colors[Math.floor(Math.random() * colors.length)];
      }

      update(dt) {
        this.y += this.speed * dt;
        if (this.y - this.radius > window.innerHeight) {
          this.reset(false);
        }
      }

      draw(ctx) {
        ctx.save();
        let grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
        grad.addColorStop(0, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.color.a})`);
        grad.addColorStop(0.5, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.color.a * 0.4})`);
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    class StarField {
      constructor() {
        this.stars = [];
        this.nebulae = [];

        const starCounts = [70, 35, 15];
        for (let layer = 0; layer < 3; layer++) {
          for (let i = 0; i < starCounts[layer]; i++) {
            this.stars.push(new Star(layer));
          }
        }

        for (let i = 0; i < 4; i++) {
          this.nebulae.push(new Nebula());
        }
      }

      update(dt) {
        this.nebulae.forEach(n => n.update(dt));
        this.stars.forEach(s => s.update(dt));
      }

      draw(ctx) {
        ctx.fillStyle = '#060015';
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        this.nebulae.forEach(n => n.draw(ctx));
        this.stars.forEach(s => s.draw(ctx));
      }

      resize() {
        this.stars.forEach(star => {
          star.x = Math.random() * window.innerWidth;
          if (star.y > window.innerHeight) star.y = Math.random() * window.innerHeight;
        });
        this.nebulae.forEach(n => {
          n.x = Math.random() * window.innerWidth;
          if (n.y - n.radius > window.innerHeight) n.y = Math.random() * window.innerHeight;
        });
      }
    }

    const starfield = new StarField();

    // --- BULLETS & PARTICLES ---
    class Bullet {
      constructor(x, y, isEnemy, weaponLevel = 1, angle = 0, damage = 1, isFireball = false) {
        this.x = x;
        this.y = y;
        this.isEnemy = isEnemy;
        this.weaponLevel = weaponLevel;
        this.angle = angle; // support spread angles
        this.damage = damage;
        this.isFireball = isFireball;
        this.speed = isEnemy ? (isFireball ? 240 : 280) : 650;
        this.width = isEnemy ? (isFireball ? 22 : 8) : 4;
        this.height = isEnemy ? (isFireball ? 22 : 8) : 16;
        
        // Scale bullet dimensions by level
        if (!isEnemy) {
          if (weaponLevel === 2) {
            this.width = 6;
            this.height = 16;
          } else if (weaponLevel === 3) {
            this.width = 8;
            this.height = 20;
          } else if (weaponLevel === 4) {
            this.width = 10;
            this.height = 22;
          } else if (weaponLevel >= 5) {
            this.width = 12;
            this.height = 24;
          }
        }
        
        this.active = true;
        this.trail = [];
      }

      update(dt) {
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > 5) this.trail.shift();

        if (this.isEnemy) {
          this.y += this.speed * Math.cos(this.angle) * dt;
          this.x += this.speed * Math.sin(this.angle) * dt;
        } else {
          // Adjust trajectory according to shoot angle
          this.y -= this.speed * Math.cos(this.angle) * dt;
          this.x += this.speed * Math.sin(this.angle) * dt;
        }

        if (this.y < -30 || this.y > V_HEIGHT + 30 || this.x < -30 || this.x > V_WIDTH + 30) {
          this.active = false;
        }
      }

      draw(ctx) {
        ctx.save();
        if (this.isEnemy) {
          if (this.isFireball) {
            // Draw Giant fireball
            ctx.shadowBlur = 24;
            ctx.shadowColor = '#ff3300';
            ctx.fillStyle = '#ff9900';
            
            // Draw fireball tail
            if (this.trail.length > 1) {
              ctx.strokeStyle = 'rgba(255, 51, 0, 0.25)';
              ctx.lineWidth = 14;
              ctx.beginPath();
              ctx.moveTo(this.trail[0].x, this.trail[0].y);
              for (let i = 1; i < this.trail.length; i++) {
                ctx.lineTo(this.trail[i].x, this.trail[i].y);
              }
              ctx.stroke();
            }

            ctx.beginPath();
            ctx.arc(this.x, this.y, 11, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(this.x, this.y, 5, 0, Math.PI * 2);
            ctx.fill();
          } else {
            // Glow and Energy ball
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ff0099';
            ctx.fillStyle = '#ff6600';
            
            // Draw tail trail
            if (this.trail.length > 1) {
              ctx.strokeStyle = 'rgba(255, 0, 153, 0.3)';
              ctx.lineWidth = 4;
              ctx.beginPath();
              ctx.moveTo(this.trail[0].x, this.trail[0].y);
              for (let i = 1; i < this.trail.length; i++) {
                ctx.lineTo(this.trail[i].x, this.trail[i].y);
              }
              ctx.stroke();
            }

            ctx.beginPath();
            ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
            ctx.fill();
          }
        } else {
          // Player Bullet (Modified by weaponLevel)
          let color = '#00ffff';
          let glow = '#00ffff';

          if (this.weaponLevel === 2) {
            color = '#ff00ff';
            glow = '#ff00ff';
          } else if (this.weaponLevel === 3) {
            color = '#ffaa00';
            glow = '#ffd700';
          } else if (this.weaponLevel === 4) {
            color = '#39ff14';
            glow = '#39ff14';
          } else if (this.weaponLevel >= 5) {
            color = '#bd00ff';
            glow = '#bd00ff';
          }

          ctx.shadowBlur = 12;
          ctx.shadowColor = glow;
          ctx.fillStyle = color;
          
          ctx.translate(this.x, this.y);
          ctx.rotate(this.angle);
          
          ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);

          // Bright inner core
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(-this.width / 4, -this.height / 2, this.width / 2, this.height);
        }
        ctx.restore();
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = 40 + Math.random() * 120;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.decay = 1.4 + Math.random() * 1.6;
        this.size = 2 + Math.random() * 2.5;
      }

      update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.vy += 30 * dt; // slight downward drift
        this.life -= this.decay * dt;
      }

      draw(ctx) {
        if (this.life <= 0) return;
        ctx.save();
        ctx.globalAlpha = this.life;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    class PowerUp {
      constructor(x, y, type = 'WEAPON') {
        this.x = x;
        this.y = y;
        this.type = type; // 'WEAPON' or 'SHIELD'
        this.width = 20;
        this.height = 20;
        this.speed = 95;
        this.active = true;
        this.pulseTime = Math.random() * 100;
      }

      update(dt) {
        this.y += this.speed * dt;
        this.pulseTime += dt * 8;
        if (this.y > V_HEIGHT + 30) {
          this.active = false;
        }
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        const size = this.width / 2;
        const pulse = 1.0 + Math.sin(this.pulseTime) * 0.15;
        ctx.scale(pulse, pulse);

        if (this.type === 'WEAPON') {
          // Yellow powerup diamond with rotating outer borders
          ctx.shadowBlur = 15;
          ctx.shadowColor = '#ffd700';
          ctx.strokeStyle = '#ffd700';
          ctx.lineWidth = 2;
          ctx.fillStyle = 'rgba(255, 215, 0, 0.2)';

          ctx.beginPath();
          ctx.moveTo(0, -size);
          ctx.lineTo(size, 0);
          ctx.lineTo(0, size);
          ctx.lineTo(-size, 0);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.font = 'bold 9px "Orbitron", monospace';
          ctx.fillStyle = '#ffffff';
          ctx.shadowBlur = 0;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('W', 0, 0);
        } else {
          // Blue-cyan hexagon for Shield powerup
          ctx.shadowBlur = 15;
          ctx.shadowColor = '#00ffff';
          ctx.strokeStyle = '#00ffff';
          ctx.lineWidth = 2;
          ctx.fillStyle = 'rgba(0, 255, 255, 0.2)';

          ctx.beginPath();
          for (let i = 0; i < 6; i++) {
            const angle = i * Math.PI / 3 - Math.PI / 6;
            ctx.lineTo(Math.cos(angle) * size, Math.sin(angle) * size);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.font = 'bold 9px "Orbitron", monospace';
          ctx.fillStyle = '#ffffff';
          ctx.shadowBlur = 0;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('S', 0, 0);
        }

        ctx.restore();
      }
    }

    // --- PLAYER SHIP ---
    class Player {
      constructor() {
        this.width = 36;
        this.height = 36;
        this.x = V_WIDTH / 2;
        this.y = V_HEIGHT - 80;
        this.targetX = V_WIDTH / 2;
        this.targetY = V_HEIGHT - 80;
        this.lives = 3;
        this.invulnerable = false;
        this.invulnerableTimer = 0;
        this.shieldActive = false;
        this.shieldTimer = 0;
        this.shootTimer = 0;
        this.shootCooldown = 0.3; // 300ms
        this.speed = 10; // interpolation rate
        this.weaponLevel = 1; // 1 (Default), 2 (Triple), 3 (Quad Heavy)
      }

      reset() {
        this.x = V_WIDTH / 2;
        this.y = V_HEIGHT - 80;
        this.targetX = V_WIDTH / 2;
        this.targetY = V_HEIGHT - 80;
        this.lives = 3;
        this.invulnerable = false;
        this.invulnerableTimer = 0;
        this.shieldActive = false;
        this.shieldTimer = 0;
        this.shootTimer = 0;
        this.weaponLevel = 1;
      }

      activateShield(duration) {
        this.shieldActive = true;
        this.shieldTimer = duration;
      }

      triggerDamage() {
        if (this.shieldActive || this.invulnerable) return false;
        this.lives--;
        audioEngine.playPlayerHit();
        if (this.lives > 0) {
          this.invulnerable = true;
          this.invulnerableTimer = 1.5;
        }
        return true;
      }

      update(dt, bullets) {
        // Interpolate horizontal & vertical position
        this.x += (this.targetX - this.x) * this.speed * dt;
        this.y += (this.targetY - this.y) * this.speed * dt;
        
        // Clamp boundaries
        const boundLimit = this.width / 2 + 10;
        if (this.x < boundLimit) this.x = boundLimit;
        if (this.x > V_WIDTH - boundLimit) this.x = V_WIDTH - boundLimit;

        const boundLimitY = this.height / 2 + 10;
        if (this.y < boundLimitY) this.y = boundLimitY;
        if (this.y > V_HEIGHT - boundLimitY) this.y = V_HEIGHT - boundLimitY;

        // Manage Invulnerability
        if (this.invulnerable) {
          this.invulnerableTimer -= dt;
          if (this.invulnerableTimer <= 0) {
            this.invulnerable = false;
          }
        }

        // Manage Shield
        if (this.shieldActive) {
          this.shieldTimer -= dt;
          if (this.shieldTimer <= 0) {
            this.shieldActive = false;
            this.shieldTimer = 0;
          }
        }

        // Auto Shooting
        if (gameState === 'PLAYING') {
          this.shootTimer += dt;
          if (this.shootTimer >= this.shootCooldown) {
            this.shootTimer = 0;
            
            // Firing patterns depending on weaponLevel
            if (this.weaponLevel === 1) {
              // Level 1: 2 parallel lasers (cyan), damage 1
              bullets.push(new Bullet(this.x - 10, this.y - 12, false, 1, 0, 1.0));
              bullets.push(new Bullet(this.x + 10, this.y - 12, false, 1, 0, 1.0));
            } else if (this.weaponLevel === 2) {
              // Level 2: 3 spread lasers (magenta), damage 1.2
              bullets.push(new Bullet(this.x, this.y - 12, false, 2, 0, 1.2)); // straight
              bullets.push(new Bullet(this.x - 12, this.y - 10, false, 2, -0.15, 1.2)); // left angled
              bullets.push(new Bullet(this.x + 12, this.y - 10, false, 2, 0.15, 1.2)); // right angled
            } else if (this.weaponLevel === 3) {
              // Level 3: 4 spread heavy lasers (gold/orange), damage 1.5
              bullets.push(new Bullet(this.x - 8, this.y - 14, false, 3, 0, 1.5)); // straight-left
              bullets.push(new Bullet(this.x + 8, this.y - 14, false, 3, 0, 1.5)); // straight-right
              bullets.push(new Bullet(this.x - 18, this.y - 10, false, 3, -0.28, 1.5)); // left angled
              bullets.push(new Bullet(this.x + 18, this.y - 10, false, 3, 0.28, 1.5)); // right angled
            } else if (this.weaponLevel === 4) {
              // Level 4: 5 spread heavy lasers (neon green), damage 2.0
              bullets.push(new Bullet(this.x, this.y - 15, false, 4, 0, 2.0)); // straight center
              bullets.push(new Bullet(this.x - 10, this.y - 12, false, 4, -0.15, 2.0)); // mid-left angled
              bullets.push(new Bullet(this.x + 10, this.y - 12, false, 4, 0.15, 2.0)); // mid-right angled
              bullets.push(new Bullet(this.x - 20, this.y - 10, false, 4, -0.30, 2.0)); // far-left angled
              bullets.push(new Bullet(this.x + 20, this.y - 10, false, 4, 0.30, 2.0)); // far-right angled
            } else {
              // Level 5: 6 spread heavy lasers (bright purple/violet), damage 2.5
              bullets.push(new Bullet(this.x - 5, this.y - 15, false, 5, -0.05, 2.5)); // mid-left-straight
              bullets.push(new Bullet(this.x + 5, this.y - 15, false, 5, 0.05, 2.5)); // mid-right-straight
              bullets.push(new Bullet(this.x - 15, this.y - 12, false, 5, -0.20, 2.5)); // mid-left angled
              bullets.push(new Bullet(this.x + 15, this.y - 12, false, 5, 0.18, 2.5)); // mid-right angled
              bullets.push(new Bullet(this.x - 25, this.y - 10, false, 5, -0.38, 2.5)); // far-left angled
              bullets.push(new Bullet(this.x + 25, this.y - 10, false, 5, 0.38, 2.5)); // far-right angled
            }
            audioEngine.playPlayerShoot();
          }
        }
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);

        // Flashing visibility calculation
        if (this.invulnerable && Math.floor(tick / 5) % 2 === 0) {
          ctx.restore();
          return;
        }

        const w = this.width;
        const h = this.height;

        // 1. Engine flame (colors match weapon level)
        if (Math.random() > 0.15) {
          ctx.beginPath();
          let flameGrad = ctx.createLinearGradient(0, h / 2 - 2, 0, h / 2 + 16 + Math.random() * 12);
          
          if (this.weaponLevel === 1) {
            flameGrad.addColorStop(0, '#00ffff');
            flameGrad.addColorStop(0.4, '#0088ff');
          } else if (this.weaponLevel === 2) {
            flameGrad.addColorStop(0, '#ff00ff');
            flameGrad.addColorStop(0.4, '#8800ff');
          } else if (this.weaponLevel === 3) {
            flameGrad.addColorStop(0, '#ffd700');
            flameGrad.addColorStop(0.4, '#ff5500');
          } else if (this.weaponLevel === 4) {
            flameGrad.addColorStop(0, '#39ff14');
            flameGrad.addColorStop(0.4, '#00aa00');
          } else {
            flameGrad.addColorStop(0, '#bd00ff');
            flameGrad.addColorStop(0.4, '#6600cc');
          }
          flameGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          
          ctx.fillStyle = flameGrad;
          ctx.moveTo(-5, h / 2 - 4);
          ctx.lineTo(5, h / 2 - 4);
          ctx.lineTo(0, h / 2 + 16 + Math.random() * 12);
          ctx.closePath();
          ctx.fill();
        }

        // Color configurations based on weapon level
        let mainColor = '#00ffff';
        let wingColor = '#39ff14';
        let glowColor = '#00ffff';

        if (this.weaponLevel === 2) {
          mainColor = '#ff00ff';
          wingColor = '#00ffff';
          glowColor = '#ff00ff';
        } else if (this.weaponLevel === 3) {
          mainColor = '#ff5500';
          wingColor = '#ffd700';
          glowColor = '#ffd700';
        } else if (this.weaponLevel === 4) {
          mainColor = '#39ff14';
          wingColor = '#00ffaa';
          glowColor = '#39ff14';
        } else if (this.weaponLevel >= 5) {
          mainColor = '#bd00ff';
          wingColor = '#ff00ff';
          glowColor = '#bd00ff';
        }

        ctx.shadowBlur = 12;
        ctx.shadowColor = glowColor;

        // Draw player ship designs (Shape changes dynamically with weapon levels)
        if (this.weaponLevel === 1) {
          // Level 1: Traditional triangular ship
          ctx.fillStyle = wingColor;
          ctx.beginPath();
          ctx.moveTo(0, -h / 2);
          ctx.quadraticCurveTo(-w / 3, h / 6, -w / 2, h / 2);
          ctx.quadraticCurveTo(-w / 4, h / 3, 0, h / 4);
          ctx.closePath();
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(0, -h / 2);
          ctx.quadraticCurveTo(w / 3, h / 6, w / 2, h / 2);
          ctx.quadraticCurveTo(w / 4, h / 3, 0, h / 4);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = mainColor;
          ctx.beginPath();
          ctx.moveTo(0, -h / 2);
          ctx.lineTo(-w / 3, h / 2.5);
          ctx.lineTo(w / 3, h / 2.5);
          ctx.closePath();
          ctx.fill();

        } else if (this.weaponLevel === 2) {
          // Level 2: Hexagonal wing extension style
          ctx.fillStyle = wingColor;
          ctx.beginPath();
          ctx.moveTo(-w / 4, -h / 4);
          ctx.lineTo(-w * 0.6, h / 3);
          ctx.lineTo(-w / 3, h / 2);
          ctx.closePath();
          ctx.fill();
          
          ctx.beginPath();
          ctx.moveTo(w / 4, -h / 4);
          ctx.lineTo(w * 0.6, h / 3);
          ctx.lineTo(w / 3, h / 2);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = wingColor;
          ctx.beginPath();
          ctx.moveTo(0, -h / 2);
          ctx.lineTo(-w / 2, h / 3);
          ctx.lineTo(0, h / 5);
          ctx.closePath();
          ctx.fill();
          
          ctx.beginPath();
          ctx.moveTo(0, -h / 2);
          ctx.lineTo(w / 2, h / 3);
          ctx.lineTo(0, h / 5);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = mainColor;
          ctx.beginPath();
          ctx.moveTo(0, -h / 2 - 4);
          ctx.lineTo(-w / 3, h / 3);
          ctx.lineTo(-w / 6, h / 2);
          ctx.lineTo(w / 6, h / 2);
          ctx.lineTo(w / 3, h / 3);
          ctx.closePath();
          ctx.fill();

        } else {
          // Level 3: Crescent-winged forward horns style
          ctx.fillStyle = wingColor;
          ctx.beginPath();
          ctx.moveTo(-w / 6, -h / 3);
          ctx.lineTo(-w * 0.7, h / 3);
          ctx.lineTo(-w * 0.5, h / 2);
          ctx.lineTo(-w / 3, h / 3);
          ctx.closePath();
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(w / 6, -h / 3);
          ctx.lineTo(w * 0.7, h / 3);
          ctx.lineTo(w * 0.5, h / 2);
          ctx.lineTo(w / 3, h / 3);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = mainColor;
          ctx.beginPath();
          ctx.moveTo(-w / 4, h / 4);
          ctx.lineTo(-w / 3, -h / 2);
          ctx.lineTo(-w / 6, -h / 4);
          ctx.closePath();
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(w / 4, h / 4);
          ctx.lineTo(w / 3, -h / 2);
          ctx.lineTo(w / 6, -h / 4);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = mainColor;
          ctx.beginPath();
          ctx.moveTo(0, -h / 2 - 8);
          ctx.lineTo(-w / 4, h / 3);
          ctx.lineTo(w / 4, h / 3);
          ctx.closePath();
          ctx.fill();
        }

        // 5. Cockpit
        if (this.weaponLevel === 1) {
          ctx.fillStyle = 'rgba(130, 225, 255, 0.75)';
        } else if (this.weaponLevel === 2) {
          ctx.fillStyle = 'rgba(255, 130, 225, 0.75)';
        } else {
          ctx.fillStyle = 'rgba(255, 225, 130, 0.85)';
        }
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, -h / 4);
        ctx.lineTo(-w / 7, h / 8);
        ctx.lineTo(w / 7, h / 8);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 6. Shield outline ring
        if (this.invulnerable) {
          ctx.shadowColor = glowColor;
          ctx.strokeStyle = `rgba(${this.weaponLevel === 1 ? '0, 255, 255' : (this.weaponLevel === 2 ? '255, 0, 255' : '255, 215, 0')}, ${0.4 + Math.sin(tick * 0.25) * 0.35})`;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(0, 0, w * 0.95, 0, Math.PI * 2);
          ctx.stroke();
        }

        // 30-Second Shield Bubble (Cyan)
        if (this.shieldActive) {
          ctx.shadowBlur = 18;
          ctx.shadowColor = '#00ffff';
          ctx.strokeStyle = `rgba(0, 255, 255, ${0.6 + Math.sin(tick * 0.15) * 0.25})`;
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.arc(0, 0, w * 1.1, 0, Math.PI * 2);
          ctx.stroke();
          
          // Soft fill
          ctx.fillStyle = `rgba(0, 255, 255, ${0.08 + Math.sin(tick * 0.1) * 0.04})`;
          ctx.beginPath();
          ctx.arc(0, 0, w * 1.1, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }
    }

    const player = new Player();

    // --- ENEMY SHIPS & PROCEDURAL DRAWS ---
    function drawEnemyA(ctx, x, y, size, pulse) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(pulse, pulse);
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#ff6600';
      ctx.strokeStyle = '#ff6600';
      ctx.lineWidth = 2.5;

      // Hexagon shape
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        let angle = i * Math.PI / 3;
        let px = Math.cos(angle) * size;
        let py = Math.sin(angle) * (size * 0.8);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();

      // Yellow energy nucleus
      ctx.fillStyle = '#ffff00';
      ctx.shadowColor = '#ffff00';
      ctx.beginPath();
      ctx.arc(0, 0, size * 0.35, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawEnemyB(ctx, x, y, size, pulse) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(pulse, pulse);
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#ff0099';
      ctx.strokeStyle = '#ff0099';
      ctx.lineWidth = 2;

      // Antenna details
      ctx.beginPath();
      ctx.moveTo(-size / 3, -size / 2);
      ctx.lineTo(-size / 2 - 4, -size - 2);
      ctx.moveTo(size / 3, -size / 2);
      ctx.lineTo(size / 2 + 4, -size - 2);
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ffffff';
      ctx.beginPath();
      ctx.arc(-size / 2 - 4, -size - 2, 2.5, 0, Math.PI * 2);
      ctx.arc(size / 2 + 4, -size - 2, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Rhombus with white borders
      ctx.beginPath();
      ctx.moveTo(0, -size);
      ctx.lineTo(size * 0.75, 0);
      ctx.lineTo(0, size);
      ctx.lineTo(-size * 0.75, 0);
      ctx.closePath();
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      // Pink core
      ctx.fillStyle = '#ff0099';
      ctx.shadowColor = '#ff0099';
      ctx.beginPath();
      ctx.moveTo(0, -size + 4);
      ctx.lineTo(size * 0.75 - 3, 0);
      ctx.lineTo(0, size - 4);
      ctx.lineTo(-size * 0.75 + 3, 0);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function drawEnemyC(ctx, x, y, size, pulse) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(pulse, pulse);
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#ff003c';
      ctx.strokeStyle = '#ff003c';
      ctx.lineWidth = 2.5;

      // Inverted crescent shape
      ctx.beginPath();
      ctx.arc(0, -size * 0.2, size, 0.15 * Math.PI, 0.85 * Math.PI, false);
      ctx.quadraticCurveTo(0, size * 0.3, Math.cos(0.15 * Math.PI) * size, Math.sin(0.15 * Math.PI) * size - size * 0.2);
      ctx.closePath();
      ctx.fillStyle = '#ff003c';
      ctx.fill();
      ctx.stroke();

      // Gold highlight details
      ctx.strokeStyle = '#ffd700';
      ctx.shadowColor = '#ffd700';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, -size * 0.2, size * 0.65, 0.28 * Math.PI, 0.72 * Math.PI);
      ctx.stroke();

      ctx.restore();
    }

    function drawBoss1(ctx, x, y, size, pulse) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(pulse, pulse);
      ctx.shadowBlur = 20;
      ctx.shadowColor = '#00ffcc';
      ctx.strokeStyle = '#00ffcc';
      ctx.lineWidth = 3;

      // Draw main saucer body (ellipse)
      ctx.fillStyle = 'rgba(0, 255, 204, 0.15)';
      ctx.beginPath();
      ctx.ellipse(0, 0, size * 1.5, size * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Draw central cockpit dome
      ctx.fillStyle = 'rgba(0, 255, 255, 0.45)';
      ctx.strokeStyle = '#00ffff';
      ctx.beginPath();
      ctx.arc(0, -size * 0.1, size * 0.6, Math.PI, 0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Draw inner glow ring inside saucer
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(0, 5, size * 1.1, size * 0.25, 0, 0, Math.PI * 2);
      ctx.stroke();

      // Draw flashing green lights along the lower rim
      const lightCount = 6;
      const timeSec = tick * 0.05;
      for (let i = 0; i < lightCount; i++) {
        const angle = Math.PI * (0.2 + (i / (lightCount - 1)) * 0.6); // bottom half arc
        const lx = Math.cos(angle) * (size * 1.3);
        const ly = Math.sin(angle) * (size * 0.4);
        
        // Alternating green/yellow flash
        const flash = Math.sin(timeSec + i) > 0;
        ctx.fillStyle = flash ? '#39ff14' : '#ffd700';
        ctx.shadowColor = flash ? '#39ff14' : '#ffd700';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(lx, ly, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw bottom thruster glow
      ctx.fillStyle = '#ff3300';
      ctx.shadowColor = '#ff3300';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(0, size * 0.4, size * 0.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawBoss2(ctx, x, y, size, pulse) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(pulse, pulse);
      ctx.shadowBlur = 22;
      ctx.shadowColor = '#ff00ff';
      ctx.strokeStyle = '#ff00ff';
      ctx.lineWidth = 3.5;

      // Main rectangular heavy hull
      ctx.fillStyle = 'rgba(255, 0, 255, 0.12)';
      ctx.beginPath();
      ctx.rect(-size * 1.6, -size * 0.5, size * 3.2, size * 1.0);
      ctx.fill();
      ctx.stroke();

      // Central command bridge tower
      ctx.fillStyle = 'rgba(0, 255, 255, 0.25)';
      ctx.strokeStyle = '#00ffff';
      ctx.beginPath();
      ctx.moveTo(-size * 0.4, -size * 0.5);
      ctx.lineTo(-size * 0.3, -size * 0.9);
      ctx.lineTo(size * 0.3, -size * 0.9);
      ctx.lineTo(size * 0.4, -size * 0.5);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Cargo containers (3 blocks on the back deck)
      ctx.strokeStyle = '#ffaa00';
      ctx.fillStyle = 'rgba(255, 170, 0, 0.2)';
      const boxW = size * 0.6;
      const boxH = size * 0.5;
      const offsets = [-size * 1.1, -size * 0.3, size * 0.5];
      for (let i = 0; i < offsets.length; i++) {
        ctx.beginPath();
        ctx.rect(offsets[i], -size * 0.3, boxW, boxH);
        ctx.fill();
        ctx.stroke();
        // Cargo cross details
        ctx.beginPath();
        ctx.moveTo(offsets[i], -size * 0.3);
        ctx.lineTo(offsets[i] + boxW, -size * 0.3 + boxH);
        ctx.moveTo(offsets[i] + boxW, -size * 0.3);
        ctx.lineTo(offsets[i], -size * 0.3 + boxH);
        ctx.stroke();
      }

      // Side thruster pods
      ctx.strokeStyle = '#ff00ff';
      ctx.fillStyle = 'rgba(255, 0, 255, 0.2)';
      // Left thruster pod
      ctx.beginPath();
      ctx.rect(-size * 1.9, -size * 0.3, size * 0.3, size * 0.7);
      ctx.fill();
      ctx.stroke();
      // Right thruster pod
      ctx.beginPath();
      ctx.rect(size * 1.6, -size * 0.3, size * 0.3, size * 0.7);
      ctx.fill();
      ctx.stroke();

      // Engine fire glow from side pods
      ctx.fillStyle = '#00ffff';
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 10;
      if (Math.random() > 0.15) {
        ctx.beginPath();
        ctx.arc(-size * 1.75, size * 0.5, size * 0.18, 0, Math.PI * 2);
        ctx.arc(size * 1.75, size * 0.5, size * 0.18, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawBoss3(ctx, x, y, size, pulse) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(pulse, pulse);
      ctx.shadowBlur = 25;
      ctx.shadowColor = '#39ff14';
      ctx.strokeStyle = '#39ff14';
      ctx.lineWidth = 3.5;

      // 1. Central Body (Diamond shape)
      ctx.fillStyle = 'rgba(57, 255, 20, 0.15)';

      ctx.moveTo(0, -size * 0.7);
      ctx.lineTo(size * 0.7, 0);
      ctx.lineTo(0, size * 0.8);
      ctx.lineTo(-size * 0.7, 0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Body ribbed plates (horizontal lines)
      ctx.strokeStyle = 'rgba(57, 255, 20, 0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-size * 0.4, -size * 0.2);
      ctx.lineTo(size * 0.4, -size * 0.2);
      ctx.moveTo(-size * 0.5, 0);
      ctx.lineTo(size * 0.5, 0);
      ctx.moveTo(-size * 0.4, size * 0.2);
      ctx.lineTo(size * 0.4, size * 0.2);
      ctx.stroke();

      // 2. Claws
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#39ff14';
      ctx.fillStyle = 'rgba(57, 255, 20, 0.25)';

      // Left Claw Arm & Pincer
      ctx.beginPath();
      ctx.moveTo(-size * 0.5, -size * 0.2);
      ctx.quadraticCurveTo(-size * 1.3, -size * 0.6, -size * 1.1, -size * 1.0); // arm
      ctx.stroke();
      
      // Left Pincer hook
      ctx.beginPath();
      ctx.arc(-size * 1.1, -size * 1.0, size * 0.35, Math.PI * 0.5, Math.PI * 1.6);
      ctx.stroke();

      // Right Claw Arm & Pincer
      ctx.beginPath();
      ctx.moveTo(size * 0.5, -size * 0.2);
      ctx.quadraticCurveTo(size * 1.3, -size * 0.6, size * 1.1, -size * 1.0); // arm
      ctx.stroke();
      
      // Right Pincer hook
      ctx.beginPath();
      ctx.arc(size * 1.1, -size * 1.0, size * 0.35, -Math.PI * 0.6, Math.PI * 0.5);
      ctx.stroke();

      // 3. Articulated Tail
      ctx.strokeStyle = '#ffd700';
      ctx.shadowColor = '#ffd700';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, size * 0.5);
      // Curve tail up and over the boss head
      ctx.quadraticCurveTo(size * 1.2, size * 1.2, size * 1.1, 0);
      ctx.quadraticCurveTo(size * 0.9, -size * 1.1, 0, -size * 1.3);
      ctx.stroke();

      // Draw joint segments along the tail
      ctx.fillStyle = '#ffd700';
      const tailJoints = [
        { x: size * 0.45, y: size * 0.8 },
        { x: size * 0.95, y: size * 0.65 },
        { x: size * 1.1, y: size * 0.35 },
        { x: size * 1.05, y: size * 0.05 },
        { x: size * 0.85, y: -size * 0.35 },
        { x: size * 0.55, y: -size * 0.75 },
        { x: size * 0.25, y: -size * 1.05 }
      ];
      tailJoints.forEach(j => {
        ctx.beginPath();
        ctx.arc(j.x, j.y, 4, 0, Math.PI * 2);
        ctx.fill();
      });

      // 4. Stinger at the end of the tail
      ctx.fillStyle = '#ff3300';
      ctx.shadowColor = '#ff3300';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(0, -size * 1.3, 8, 0, Math.PI * 2);
      ctx.fill();
      
      // Outer stinger ring
      ctx.strokeStyle = '#ff3300';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, -size * 1.3, 13, 0, Math.PI * 2);
      ctx.stroke();

      // 5. Glowing Central Eye/Core
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#39ff14';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(0, -size * 0.4, size * 0.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    class Enemy {
      constructor(type, x, y, hp) {
        this.type = type;
        this.x = x;
        this.y = y;
        this.hp = hp;
        this.maxHp = hp;
        
        if (type.startsWith('BOSS')) {
          this.width = 70;
          this.height = 70;
          this.shootTimer = 0;
          this.scoreValue = type === 'BOSS1' ? 500 : (type === 'BOSS2' ? 1000 : 2500);
          this.color = type === 'BOSS1' ? '#ff003c' : (type === 'BOSS2' ? '#ff00ff' : '#39ff14');
          this.direction = 1;         // Boss 2 sweep direction
          this.minionWaveCount = 0;   // Boss 2 and 3 minion wave count
          this.minionTimer = 0;       // Boss 2 and 3 minion spawn frequency timer
          this.burstSequence = 6;     // Boss 1 burst sequence index (starts finished)
          this.burstTimer = 0;        // Boss 1 burst interval timer
          this.clawShootTimer = 0;    // Boss 3 claw firing timer
        } else {
          this.width = 34;
          this.height = 34;
          this.scoreValue = type === 'A' ? 10 : (type === 'B' ? 25 : 50);
          this.color = type === 'A' ? '#ff6600' : (type === 'B' ? '#ff0099' : '#ff003c');
        }
        
        this.active = true;
        this.pulseTime = Math.random() * 100;
        this.baseX = x;
        this.sineOffset = Math.random() * Math.PI * 2;
      }

      update(dt, waveTime, speedMultiplier) {
        this.pulseTime += dt * 6;

        // Motion behaviors
        if (this.type === 'A') {
          // Standard descend + slight wiggle
          this.y += 60 * speedMultiplier * dt;
          this.x = this.baseX + Math.sin(waveTime * 2.5 + this.sineOffset) * 15;
        } else if (this.type === 'B') {
          // Sweeping sine path
          this.y += 75 * speedMultiplier * dt;
          this.x = this.baseX + Math.sin(waveTime * 3.5 + this.sineOffset) * 45;
        } else if (this.type === 'C') {
          // Rapid wide swooping movement
          this.y += 95 * speedMultiplier * dt;
          this.x = this.baseX + Math.sin(waveTime * 2.0 + this.sineOffset) * 75;
        } else if (this.type === 'BOSS1') {
          // Goliath Prime (Disco Voador): descende até Y=130 e oscila horizontalmente
          if (this.y < 130) {
            this.y += 65 * dt;
          } else {
            this.y = 130;
            this.x = V_WIDTH / 2 + Math.sin(waveTime * 1.5) * 120;
          }
          
          this.shootTimer += dt;
          if (this.shootTimer >= 5.0) {
            this.shootTimer = 0;
            this.burstSequence = 0;
            this.burstTimer = 0.15; // Trigger first burst immediately
          }

          if (this.burstSequence < 6) {
            this.burstTimer += dt;
            if (this.burstTimer >= 0.15) {
              this.burstTimer -= 0.15;
              const baseAngle = this.burstSequence * 0.25; // Rotating pattern over time
              // Fire 7 bullets in an 8-bullet circle, leaving a clear gap (omitting index 0)
              for (let i = 1; i < 8; i++) {
                const angle = baseAngle + i * (Math.PI * 2 / 8);
                bullets.push(new Bullet(this.x, this.y + 20, true, 1, angle));
              }
              this.burstSequence++;
            }
          }
        } else if (this.type === 'BOSS2') {
          // Nebula Dreadnought (Nave Cargueira): descende até Y=120 e varre horizontalmente
          if (this.y < 120) {
            this.y += 65 * dt;
          } else {
            this.y = 120;
            this.x += this.direction * 75 * dt;
            if (this.x > V_WIDTH - 80) {
              this.x = V_WIDTH - 80;
              this.direction = -1;
            } else if (this.x < 80) {
              this.x = 80;
              this.direction = 1;
            }
          }

          // Shoots vertical bullet streams with a clear gap in the middle
          this.shootTimer += dt;
          if (this.shootTimer >= 2.2) {
            this.shootTimer = 0;
            // 4 vertical bullets with a 50px gap in the middle
            bullets.push(new Bullet(this.x - 50, this.y + 25, true, 1, 0));
            bullets.push(new Bullet(this.x - 25, this.y + 25, true, 1, 0));
            bullets.push(new Bullet(this.x + 25, this.y + 25, true, 1, 0));
            bullets.push(new Bullet(this.x + 50, this.y + 25, true, 1, 0));
          }

          // Spawns minions periodically
          this.minionTimer += dt;
          if (this.minionTimer >= 8.0) {
            this.minionTimer = 0;
            this.minionWaveCount++;
            
            // Spawn 2 minions (A and B)
            const minion1 = new Enemy('A', this.x - 45, this.y + 30, 2);
            const minion2 = new Enemy('B', this.x + 45, this.y + 30, 2);
            
            // Second leva, fourth leva, etc. drops a shield
            if (this.minionWaveCount % 2 === 0) {
              minion1.guaranteedDrop = 'SHIELD';
            }
            
            enemies.push(minion1);
            enemies.push(minion2);
          }
        } else if (this.type === 'BOSS3') {
          // Intergalactic Emperor (Escorpião): descende até Y=140 e segue o jogador
          if (this.y < 140) {
            this.y += 65 * dt;
          } else {
            this.y = 140 + Math.sin(waveTime * 2.0) * 15;
            // Slowly track player X coordinate
            this.x += (player.x - this.x) * 1.5 * dt;
          }

          // Firing large fireballs from the tail stinger (top/back of the scorpion)
          this.shootTimer += dt;
          if (this.shootTimer >= 3.0) {
            this.shootTimer = 0;
            const angle = Math.atan2(player.x - this.x, player.y - (this.y - 40));
            bullets.push(new Bullet(this.x, this.y - 40, true, 1, angle, 2.0, true));
          }

          // Random small bullets from claws (claw left and claw right)
          this.clawShootTimer += dt;
          if (this.clawShootTimer >= 0.8) {
            this.clawShootTimer = 0;
            const angleLeft = (Math.random() - 0.5) * 0.4;
            bullets.push(new Bullet(this.x - 50, this.y + 20, true, 1, angleLeft));
            const angleRight = (Math.random() - 0.5) * 0.4;
            bullets.push(new Bullet(this.x + 50, this.y + 20, true, 1, angleRight));
          }

          // Spawns minions periodically (same as Boss 2)
          this.minionTimer += dt;
          if (this.minionTimer >= 8.0) {
            this.minionTimer = 0;
            this.minionWaveCount++;
            
            // Spawn 2 minions (A and B) with 3 HP (slightly stronger)
            const minion1 = new Enemy('A', this.x - 45, this.y + 30, 3);
            const minion2 = new Enemy('B', this.x + 45, this.y + 30, 3);
            
            if (this.minionWaveCount % 2 === 0) {
              minion1.guaranteedDrop = 'SHIELD';
            }
            
            enemies.push(minion1);
            enemies.push(minion2);
          }
        }

        // Keep Boss within screen bounds vertically
        if (!this.type.startsWith('BOSS') && this.y > V_HEIGHT + 40) {
          this.active = false;
        }
      }

      takeDamage(amount) {
        this.hp -= amount;
        if (this.hp <= 0) {
          this.active = false;
          return true; // Destroyed
        }
        return false;
      }

      draw(ctx) {
        const pulse = 1.0 + Math.sin(this.pulseTime) * 0.08;
        const size = this.width / 2;

        if (this.type === 'A') {
          drawEnemyA(ctx, this.x, this.y, size, pulse);
        } else if (this.type === 'B') {
          drawEnemyB(ctx, this.x, this.y, size, pulse);
        } else if (this.type === 'C') {
          drawEnemyC(ctx, this.x, this.y, size, pulse);
        } else if (this.type === 'BOSS1') {
          drawBoss1(ctx, this.x, this.y, size, pulse);
        } else if (this.type === 'BOSS2') {
          drawBoss2(ctx, this.x, this.y, size, pulse);
        } else if (this.type === 'BOSS3') {
          drawBoss3(ctx, this.x, this.y, size, pulse);
        }

        // Render health bar if damaged (and not a boss)
        if (this.hp < this.maxHp && !this.type.startsWith('BOSS')) {
          ctx.save();
          const barW = 24;
          const barH = 3;
          ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
          ctx.fillRect(this.x - barW / 2, this.y - size - 8, barW, barH);
          ctx.fillStyle = '#39ff14';
          ctx.fillRect(this.x - barW / 2, this.y - size - 8, barW * (this.hp / this.maxHp), barH);
          ctx.restore();
        }
      }
    }

    // --- GAME STATE MANAGER & STAGE CONTROLLER ---
    class WaveManager {
      constructor() {
        this.currentWave = 1;
        this.state = 'TRANSITION'; // TRANSITION, PLAYING, FINISHED
        this.transitionDuration = 3.5; // Increased transition time (3.5s) as requested
        this.transitionTimer = 3.5;
        
        this.spawnQueue = [];
        this.spawnTimer = 0;
        this.spawnInterval = 0.3; // faster spacing default
        
        this.enemiesDestroyed = 0;
        this.enemiesTotal = 0;
        this.waveDamageTaken = false;
      }

      startWave(waveNum) {
        if (waveNum > 30) {
          gameState = 'VICTORY';
          if (score > highscore) {
            highscore = score;
            localStorage.setItem('intergalactic_neon_highscore', highscore.toString());
          }
          return;
        }

        this.currentWave = waveNum;
        this.state = 'TRANSITION';
        this.transitionTimer = this.transitionDuration;
        this.spawnQueue = [];
        this.spawnTimer = 0;
        this.enemiesDestroyed = 0;
        this.waveDamageTaken = false;

        let total = 0;
        let types = [];
        
        // hpIncrease: +1 enemy HP every 4 waves
        let hpIncrease = Math.floor((waveNum - 1) / 4);

        if (waveNum === 10) {
          this.enemiesTotal = 1;
          this.spawnQueue.push({ type: 'BOSS1', hp: 50, x: V_WIDTH / 2, y: -60 });
          this.spawnInterval = 0.5;
          return;
        } else if (waveNum === 20) {
          this.enemiesTotal = 1;
          this.spawnQueue.push({ type: 'BOSS2', hp: 100, x: V_WIDTH / 2, y: -60 });
          this.spawnInterval = 0.5;
          return;
        } else if (waveNum === 30) {
          this.enemiesTotal = 1;
          this.spawnQueue.push({ type: 'BOSS3', hp: 200, x: V_WIDTH / 2, y: -60 });
          this.spawnInterval = 0.5;
          return;
        }

        // Regular waves
        if (waveNum <= 3) {
          total = 6 + waveNum * 2; // W1: 8, W2: 10, W3: 12
          for (let i = 0; i < total; i++) {
            types.push({ type: Math.random() < 0.85 ? 'A' : 'B', hp: 1 });
          }
          this.spawnInterval = 0.35;
        } else if (waveNum <= 6) {
          total = 10 + waveNum; // W4: 14, W5: 15, W6: 16
          for (let i = 0; i < total; i++) {
            let r = Math.random();
            if (r < 0.6) types.push({ type: 'A', hp: 1 + hpIncrease });
            else if (r < 0.9) types.push({ type: 'B', hp: 1 + hpIncrease });
            else types.push({ type: 'C', hp: 1 + hpIncrease });
          }
          this.spawnInterval = 0.30;
        } else if (waveNum <= 9) {
          total = 12 + waveNum; // W7: 19, W8: 20, W9: 21
          for (let i = 0; i < total; i++) {
            let r = Math.random();
            if (r < 0.4) types.push({ type: 'A', hp: 1 + hpIncrease });
            else if (r < 0.75) types.push({ type: 'B', hp: 2 + hpIncrease });
            else types.push({ type: 'C', hp: 2 + hpIncrease });
          }
          this.spawnInterval = 0.28;
        } else if (waveNum <= 15) {
          total = 14 + waveNum; // W11-15
          for (let i = 0; i < total; i++) {
            let r = Math.random();
            if (r < 0.3) types.push({ type: 'A', hp: 2 + hpIncrease });
            else if (r < 0.7) types.push({ type: 'B', hp: 2 + hpIncrease });
            else types.push({ type: 'C', hp: 3 + hpIncrease });
          }
          this.spawnInterval = 0.25;
        } else if (waveNum <= 19) {
          total = 15 + waveNum; // W16-19
          for (let i = 0; i < total; i++) {
            let r = Math.random();
            if (r < 0.2) types.push({ type: 'A', hp: 2 + hpIncrease });
            else if (r < 0.6) types.push({ type: 'B', hp: 3 + hpIncrease });
            else types.push({ type: 'C', hp: 4 + hpIncrease });
          }
          this.spawnInterval = 0.23;
        } else if (waveNum <= 25) {
          total = 16 + waveNum; // W21-25
          for (let i = 0; i < total; i++) {
            let r = Math.random();
            if (r < 0.15) types.push({ type: 'A', hp: 3 + hpIncrease });
            else if (r < 0.5) types.push({ type: 'B', hp: 4 + hpIncrease });
            else types.push({ type: 'C', hp: 5 + hpIncrease });
          }
          this.spawnInterval = 0.20;
        } else {
          total = 18 + waveNum; // W26-29
          for (let i = 0; i < total; i++) {
            let r = Math.random();
            if (r < 0.1) types.push({ type: 'A', hp: 4 + hpIncrease });
            else if (r < 0.4) types.push({ type: 'B', hp: 5 + hpIncrease });
            else types.push({ type: 'C', hp: 6 + hpIncrease });
          }
          this.spawnInterval = 0.18;
        }
        
        this.enemiesTotal = total;

        // Choose formation based on current wave
        const formations = ['GRID', 'V_SHAPE', 'SINE_LINE'];
        const currentFormation = formations[(waveNum - 1) % formations.length];

        if (currentFormation === 'GRID') {
          const cols = Math.min(5, Math.ceil(Math.sqrt(total)));
          const rows = Math.ceil(total / cols);
          let idx = 0;
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              if (idx >= total) break;
              const x = 70 + c * (340 / (cols - 1 || 1));
              const y = -50 - r * 60;
              this.spawnQueue.push({ type: types[idx].type, hp: types[idx].hp, x, y });
              idx++;
            }
          }
        } else if (currentFormation === 'V_SHAPE') {
          const mid = Math.floor(total / 2);
          for (let i = 0; i < total; i++) {
            const x = 60 + i * (360 / (total - 1 || 1));
            const depth = Math.abs(i - mid) * 55;
            const y = -50 - depth;
            this.spawnQueue.push({ type: types[i].type, hp: types[i].hp, x, y });
          }
        } else {
          // SINE_LINE (Staggered entries)
          for (let i = 0; i < total; i++) {
            const x = 100 + Math.sin(i * 0.95) * 85;
            const y = -50 - i * 65;
            this.spawnQueue.push({ type: types[i].type, hp: types[i].hp, x, y });
          }
        }
      }

      update(dt, enemies) {
        if (this.state === 'TRANSITION') {
          this.transitionTimer -= dt;
          if (this.transitionTimer <= 0) {
            this.state = 'PLAYING';
          }
          return;
        }

        // Process spawning
        if (this.state === 'PLAYING' && this.spawnQueue.length > 0) {
          this.spawnTimer += dt;
          if (this.spawnTimer >= this.spawnInterval) {
            this.spawnTimer = 0;
            const item = this.spawnQueue.shift();
            enemies.push(new Enemy(item.type, item.x, item.y, item.hp));
          }
        }
      }
    }

    // --- SYSTEMS INITIALIZATION & LIFE CYCLES ---
    function startGame() {
      score = 0;
      enemies = [];
      bullets = [];
      particles = [];
      powerups = [];
      waveTime = 0;
      pointsTimer = 0;
      player.reset();
      waveManager.startWave(1);
      gameState = 'PLAYING';
    }

      gameState = 'MENU';
    }

    function triggerGameOver() {
      gameState = 'GAME_OVER';
      audioEngine.playGameOver();
      if (score > highscore) {
        highscore = score;
        localStorage.setItem('intergalactic_neon_highscore', highscore.toString());
      }
