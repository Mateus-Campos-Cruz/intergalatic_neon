    function drawBoss2(ctx, x, y, size, pulse) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(pulse, pulse);
      ctx.shadowBlur = 22;
      ctx.shadowColor = '#ff00ff';
      ctx.strokeStyle = '#ff00ff';
      ctx.lineWidth = 3.5;

      // Main rectangular heavy hull
      ctx.fillStyle = 'rgba(255, 0, 255, 0.12)';
      ctx.beginPath();
      ctx.rect(-size * 1.6, -size * 0.5, size * 3.2, size * 1.0);
      ctx.fill();
      ctx.stroke();

      // Central command bridge tower
      ctx.fillStyle = 'rgba(0, 255, 255, 0.25)';
      ctx.strokeStyle = '#00ffff';
      ctx.beginPath();
      ctx.moveTo(-size * 0.4, -size * 0.5);
      ctx.lineTo(-size * 0.3, -size * 0.9);
      ctx.lineTo(size * 0.3, -size * 0.9);
      ctx.lineTo(size * 0.4, -size * 0.5);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Cargo containers (3 blocks on the back deck)
      ctx.strokeStyle = '#ffaa00';
      ctx.fillStyle = 'rgba(255, 170, 0, 0.2)';
      const boxW = size * 0.6;
      const boxH = size * 0.5;
      const offsets = [-size * 1.1, -size * 0.3, size * 0.5];
      for (let i = 0; i < offsets.length; i++) {
        ctx.beginPath();
        ctx.rect(offsets[i], -size * 0.3, boxW, boxH);
        ctx.fill();
        ctx.stroke();
        // Cargo cross details
        ctx.beginPath();
        ctx.moveTo(offsets[i], -size * 0.3);
        ctx.lineTo(offsets[i] + boxW, -size * 0.3 + boxH);
        ctx.moveTo(offsets[i] + boxW, -size * 0.3);
        ctx.lineTo(offsets[i], -size * 0.3 + boxH);
        ctx.stroke();
      }

      // Side thruster pods
      ctx.strokeStyle = '#ff00ff';
      ctx.fillStyle = 'rgba(255, 0, 255, 0.2)';
      // Left thruster pod
      ctx.beginPath();
      ctx.rect(-size * 1.9, -size * 0.3, size * 0.3, size * 0.7);
      ctx.fill();
      ctx.stroke();
      // Right thruster pod
      ctx.beginPath();
      ctx.rect(size * 1.6, -size * 0.3, size * 0.3, size * 0.7);
      ctx.fill();
      ctx.stroke();

      // Engine fire glow from side pods
      ctx.fillStyle = '#00ffff';
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 10;
      if (Math.random() > 0.15) {
        ctx.beginPath();
        ctx.arc(-size * 1.75, size * 0.5, size * 0.18, 0, Math.PI * 2);
        ctx.arc(size * 1.75, size * 0.5, size * 0.18, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawBoss3(ctx, x, y, size, pulse, forcefieldActive) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(pulse, pulse);

      // 1. Forcefield Bubble (if active)
      if (forcefieldActive) {
        ctx.save();
        ctx.shadowBlur = 25;
        ctx.shadowColor = '#00ffff';
        ctx.strokeStyle = `rgba(0, 240, 255, ${0.7 + Math.sin(tick * 0.2) * 0.25})`;
        ctx.lineWidth = 4;
        ctx.fillStyle = `rgba(0, 200, 255, ${0.07 + Math.sin(tick * 0.1) * 0.03})`;
        
        ctx.beginPath();
        ctx.arc(0, -size * 0.2, size * 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Hexagonal/grid patterns inside shield
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.18)';
        ctx.lineWidth = 1;
        for (let a = 0; a < Math.PI * 2; a += Math.PI / 6) {
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * (size * 2.0), Math.sin(a) * (size * 2.0));
          ctx.lineTo(Math.cos(a) * (size * 2.5), Math.sin(a) * (size * 2.5));
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.arc(0, -size * 0.2, size * 2.0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // 2. Legs (8 legs, 4 on each side)
      ctx.save();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = '#00aeff';
      ctx.shadowColor = '#00aeff';
      ctx.shadowBlur = 10;
      
      const legSides = [-1, 1];
      legSides.forEach(side => {
        for (let l = 0; l < 4; l++) {
          // Base attachment point on the body
          let baseY = -size * 0.35 + l * (size * 0.15);
          let baseX = side * size * 0.4;
          
          // Joint 1: going outwards and upwards
          let j1x = baseX + side * size * (0.5 + l * 0.08);
          let j1y = baseY - size * (0.2 + l * 0.04);
          
          // Joint 2: bending downwards
          let j2x = j1x + side * size * (0.35 + l * 0.04);
          let j2y = j1y + size * 0.25;
          
          // Tip: pointing down and outwards
          let tipX = j2x + side * size * 0.15;
          let tipY = j2y + size * 0.45;
          
          ctx.beginPath();
          ctx.moveTo(baseX, baseY);
          ctx.lineTo(j1x, j1y);
          ctx.lineTo(j2x, j2y);
          ctx.lineTo(tipX, tipY);
          ctx.stroke();
          
          // Glowing joints
          ctx.fillStyle = '#00ffff';
          ctx.beginPath();
          ctx.arc(j1x, j1y, 2.5, 0, Math.PI * 2);
          ctx.arc(j2x, j2y, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      });
      ctx.restore();

      // 3. Tail Loop & Stinger
      // Define path for the tail curving up from the top of the body (0, -size*0.5)
      const tailPoints = [];
      const numSegments = 14;
      for (let i = 0; i < numSegments; i++) {
        let t = i / (numSegments - 1);
        let px, py;
        if (t < 0.25) {
          let nt = t / 0.25;
          px = nt * (size * 0.6);
          py = -size * 0.5 - nt * (size * 0.3);
        } else if (t < 0.5) {
          let nt = (t - 0.25) / 0.25;
          px = size * 0.6 + nt * (size * 0.15);
          py = -size * 0.8 - nt * (size * 0.7);
        } else if (t < 0.75) {
          let nt = (t - 0.5) / 0.25;
          px = size * 0.75 - nt * (size * 1.35);
          py = -size * 1.5 - Math.sin(nt * Math.PI) * (size * 0.45);
        } else {
          let nt = (t - 0.75) / 0.25;
          px = -size * 0.6 + nt * (size * 0.85);
          py = -size * 1.5 + Math.sin(nt * Math.PI * 0.8) * (size * 0.35);
        }
        tailPoints.push({ x: px, y: py });
      }

      // Draw tail segments (glowing hollow rings)
      tailPoints.forEach((p, idx) => {
        let r = size * 0.13 * (1.0 - (idx / numSegments) * 0.35);
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#00f3ff';
        
        ctx.strokeStyle = '#00f3ff';
        ctx.lineWidth = 2.5;
        ctx.fillStyle = 'rgba(0, 85, 255, 0.25)';
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.lineWidth = 1.0;
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.5, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      });

      // Draw Stinger
      const tip = tailPoints[tailPoints.length - 1];
      ctx.save();
      ctx.translate(tip.x, tip.y);
      ctx.rotate(-Math.PI * 0.25);
      
      ctx.fillStyle = '#00ffff';
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.moveTo(0, -10);
      ctx.lineTo(6, 4);
      ctx.quadraticCurveTo(0, 10, -6, 4);
      ctx.closePath();
      ctx.fill();
      
      ctx.strokeStyle = 'rgba(0, 243, 255, 0.6)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, 0, 14, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // 4. Scorpio Zodiac Sign ♏ inside the tail loop
      ctx.save();
      ctx.strokeStyle = '#00ffff';
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 15;
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      
      const cx = 0;
      const cy = -size * 1.65;
      const sw = size * 0.16;
      const sh = size * 0.35;
      
      ctx.beginPath();
      // Stem 1
      ctx.moveTo(cx - sw, cy - sh * 0.45);
      ctx.lineTo(cx - sw, cy + sh * 0.45);
      
      // Arch 1 & Stem 2
      ctx.moveTo(cx - sw, cy - sh * 0.2);
      ctx.quadraticCurveTo(cx - sw * 0.5, cy - sh * 0.55, cx, cy - sh * 0.45);
      ctx.lineTo(cx, cy + sh * 0.45);
      
      // Arch 2 & Stem 3 (with arrow tail)
      ctx.moveTo(cx, cy - sh * 0.2);
      ctx.quadraticCurveTo(cx + sw * 0.5, cy - sh * 0.55, cx + sw, cy - sh * 0.45);
      ctx.lineTo(cx + sw, cy + sh * 0.2);
      // Arrow tail curve
      ctx.quadraticCurveTo(cx + sw, cy + sh * 0.5, cx + sw * 1.6, cy + sh * 0.5);
      ctx.quadraticCurveTo(cx + sw * 2.2, cy + sh * 0.5, cx + sw * 2.4, cy + sh * 0.15);
      ctx.stroke();
      
      // Arrow Head
      ctx.beginPath();
      ctx.moveTo(cx + sw * 2.1, cy + sh * 0.25);
      ctx.lineTo(cx + sw * 2.4, cy + sh * 0.15);
      ctx.lineTo(cx + sw * 2.5, cy + sh * 0.4);
      ctx.stroke();
      ctx.restore();

      // 5. Body Segment Plates
      ctx.save();
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#00f3ff';
      ctx.strokeStyle = '#00f3ff';
      ctx.lineWidth = 2.5;
      
      for (let i = 0; i < 7; i++) {
        let segW = size * (0.8 - Math.abs(i - 3) * 0.12);
        let segH = size * 0.2;
        let segY = -size * 0.5 + i * (size * 0.18);
        
        ctx.fillStyle = i % 2 === 0 ? 'rgba(0, 85, 255, 0.25)' : 'rgba(0, 243, 255, 0.12)';
        ctx.beginPath();
        ctx.moveTo(-segW, segY);
        ctx.quadraticCurveTo(0, segY + segH * 0.5, segW, segY);
        ctx.quadraticCurveTo(segW * 1.1, segY + segH, segW, segY + segH);
        ctx.quadraticCurveTo(0, segY + segH + segH * 0.5, -segW, segY + segH);
        ctx.quadraticCurveTo(-segW * 1.1, segY + segH, -segW, segY);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
      ctx.restore();

      // 6. Claws (Left and Right, facing forward/bottom)
      ctx.save();
      ctx.strokeStyle = '#00f3ff';
      ctx.shadowColor = '#00f3ff';
      ctx.shadowBlur = 12;
      ctx.lineWidth = 3;
      
      legSides.forEach(side => {
        let armBaseX = side * size * 0.3;
        let armBaseY = size * 0.4;
        
        let elbowX = side * size * 1.25;
        let elbowY = size * 0.65;
        let wristX = side * size * 0.9;
        let wristY = size * 1.15;
        
        ctx.fillStyle = 'rgba(0, 85, 255, 0.18)';
        ctx.beginPath();
        ctx.moveTo(armBaseX, armBaseY);
        ctx.quadraticCurveTo(elbowX, elbowY, wristX, wristY);
        ctx.stroke();
        
        // Wrist joint
        ctx.fillStyle = '#00ffff';
        ctx.beginPath();
        ctx.arc(wristX, wristY, 4, 0, Math.PI * 2);
        ctx.fill();
        
        // Outer claw finger
        ctx.beginPath();
        ctx.moveTo(wristX, wristY);
        let outTipX = wristX - side * size * 0.2;
        let outTipY = wristY + size * 0.45;
        ctx.quadraticCurveTo(wristX - side * size * 0.35, wristY + size * 0.25, outTipX, outTipY);
        ctx.quadraticCurveTo(wristX - side * size * 0.15, wristY + size * 0.35, wristX, wristY);
        ctx.stroke();
        ctx.fill();
        
        // Inner claw finger
        ctx.beginPath();
        ctx.moveTo(wristX, wristY);
        let inTipX = wristX + side * size * 0.05;
        let inTipY = wristY + size * 0.35;
        ctx.quadraticCurveTo(wristX - side * size * 0.05, wristY + size * 0.25, inTipX, inTipY);
        ctx.quadraticCurveTo(wristX + side * size * 0.08, wristY + size * 0.2, wristX, wristY);
        ctx.stroke();
        ctx.fill();
      });
      ctx.restore();

      // 7. Glowing Eyes & Mandibles
      ctx.save();
      ctx.translate(0, size * 0.4);
      
      // Head base
      ctx.fillStyle = 'rgba(0, 85, 255, 0.35)';
      ctx.strokeStyle = '#00f3ff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-size * 0.3, 0);
      ctx.lineTo(size * 0.3, 0);
      ctx.lineTo(size * 0.15, size * 0.25);
      ctx.lineTo(-size * 0.15, size * 0.25);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      
      // Eyes
      ctx.fillStyle = '#00ffff';
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(-size * 0.15, size * 0.05);
      ctx.lineTo(-size * 0.05, size * 0.12);
      ctx.lineTo(-size * 0.18, size * 0.15);
      ctx.closePath();
      ctx.fill();
      
      ctx.beginPath();
      ctx.moveTo(size * 0.15, size * 0.05);
      ctx.lineTo(size * 0.05, size * 0.12);
      ctx.lineTo(size * 0.18, size * 0.15);
      ctx.closePath();
      ctx.fill();
      
      // Mandibles
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-size * 0.05, size * 0.22);
      ctx.quadraticCurveTo(-size * 0.08, size * 0.32, -size * 0.02, size * 0.35);
      ctx.moveTo(size * 0.05, size * 0.22);
      ctx.quadraticCurveTo(size * 0.08, size * 0.32, size * 0.02, size * 0.35);
      ctx.stroke();
      
      ctx.restore();

      ctx.restore();
    }

    class Enemy {
      constructor(type, x, y, hp) {
        this.type = type;
        this.x = x;
        this.y = y;
        this.hp = hp;
        this.maxHp = hp;
        
        if (type.startsWith('BOSS')) {
          this.width = 70;
          this.height = 70;
          this.shootTimer = 0;
          this.missileTimer = 0;       // Boss 2 homing missile timer
          this.scoreValue = type === 'BOSS1' ? 500 : (type === 'BOSS2' ? 1000 : 2500);
          this.color = type === 'BOSS1' ? '#ff003c' : (type === 'BOSS2' ? '#ff00ff' : '#00ffff');
          this.direction = 1;         // Boss 2 sweep direction
          this.minionWaveCount = 0;   // Boss 2 and 3 minion wave count
          this.minionTimer = 0;       // Boss 2 and 3 minion spawn frequency timer
          this.burstSequence = 6;     // Boss 1 burst sequence index (starts finished)
          this.burstTimer = 0;        // Boss 1 burst interval timer
          this.clawShootTimer = 0;    // Boss 3 claw firing timer
          if (type === 'BOSS3') {
            this.forcefieldActive = false;
            this.forcefieldTimer = 0;
          }
        } else {
          this.width = 34;
          this.height = 34;
          this.scoreValue = type === 'A' ? 10 : (type === 'B' ? 25 : 50);
          this.color = type === 'A' ? '#ff6600' : (type === 'B' ? '#ff0099' : '#ff003c');
        }
        
        this.active = true;
        this.pulseTime = Math.random() * 100;
        this.baseX = x;
        this.sineOffset = Math.random() * Math.PI * 2;
        this.superpowerHit = false;
      }

      update(dt, waveTime, speedMultiplier) {
        this.pulseTime += dt * 6;

        // Motion behaviors
        if (this.type === 'A') {
          // Standard descend + slight wiggle
          this.y += 60 * speedMultiplier * dt;
          this.x = this.baseX + Math.sin(waveTime * 2.5 + this.sineOffset) * 15;
        } else if (this.type === 'B') {
          // Sweeping sine path
          this.y += 75 * speedMultiplier * dt;
          this.x = this.baseX + Math.sin(waveTime * 3.5 + this.sineOffset) * 45;
        } else if (this.type === 'C') {
          // Rapid wide swooping movement
          this.y += 95 * speedMultiplier * dt;
          this.x = this.baseX + Math.sin(waveTime * 2.0 + this.sineOffset) * 75;
        } else if (this.type === 'BOSS1') {
          // Goliath Prime (Disco Voador): descende até Y=130 e oscila horizontalmente
          if (this.y < 130) {
            this.y += 65 * dt;
          } else {
            this.y = 130;
            this.x = V_WIDTH / 2 + Math.sin(waveTime * 1.5) * 120;
          }
          
          this.shootTimer += dt;
          if (this.shootTimer >= 5.0) {
            this.shootTimer = 0;
            this.burstSequence = 0;
            this.burstTimer = 0.15; // Trigger first burst immediately
          }

          if (this.burstSequence < 6) {
            this.burstTimer += dt;
            if (this.burstTimer >= 0.15) {
              this.burstTimer -= 0.15;
              const baseAngle = this.burstSequence * 0.25; // Rotating pattern over time
              // Fire 7 bullets in an 8-bullet circle, leaving a clear gap (omitting index 0)
              for (let i = 1; i < 8; i++) {
                const angle = baseAngle + i * (Math.PI * 2 / 8);
                bullets.push(new Bullet(this.x, this.y + 20, true, 1, angle));
              }
              this.burstSequence++;
            }
          }
        } else if (this.type === 'BOSS2') {
          // Nebula Dreadnought (Nave Cargueira): descende até Y=120 e varre horizontalmente
          if (this.y < 120) {
            this.y += 65 * dt;
          } else {
            this.y = 120;
            this.x += this.direction * 75 * dt;
            if (this.x > V_WIDTH - 80) {
              this.x = V_WIDTH - 80;
              this.direction = -1;
            } else if (this.x < 80) {
              this.x = 80;
              this.direction = 1;
            }
          }

          // Shoots vertical bullet streams with a clear gap in the middle
          this.shootTimer += dt;
          if (this.shootTimer >= 2.2) {
            this.shootTimer = 0;
            // 4 vertical bullets with a 50px gap in the middle
            bullets.push(new Bullet(this.x - 50, this.y + 25, true, 1, 0));
            bullets.push(new Bullet(this.x - 25, this.y + 25, true, 1, 0));
            bullets.push(new Bullet(this.x + 25, this.y + 25, true, 1, 0));
            bullets.push(new Bullet(this.x + 50, this.y + 25, true, 1, 0));
          }

          // Homing missiles every 5 seconds
          this.missileTimer += dt;
          if (this.missileTimer >= 5.0) {
            this.missileTimer = 0;
            missiles.push(new Missile(this.x, this.y + 30));
          }

          // Spawns minions periodically
          this.minionTimer += dt;
          if (this.minionTimer >= 8.0) {
            this.minionTimer = 0;
            this.minionWaveCount++;
            
            // Spawn 2 stronger minions (HP 5)
            const minion1 = new Enemy('A', this.x - 45, this.y + 30, 5);
            const minion2 = new Enemy('B', this.x + 45, this.y + 30, 5);
            
            // Second leva, fourth leva, etc. drops a shield
            if (this.minionWaveCount % 2 === 0) {
              minion1.guaranteedDrop = 'SHIELD';
            }
            
            enemies.push(minion1);
            enemies.push(minion2);
          }
        } else if (this.type === 'BOSS3') {
          // Intergalactic Emperor (Escorpião): descende até Y=140 e segue o jogador
          if (this.y < 140) {
            this.y += 65 * dt;
          } else {
            this.y = 140 + Math.sin(waveTime * 2.0) * 15;
            // Slowly track player X coordinate
            this.x += (player.x - this.x) * 1.5 * dt;
          }

          // Forcefield logic (7s off, 5s on)
          if (this.forcefieldActive === undefined) {
            this.forcefieldActive = false;
            this.forcefieldTimer = 0;
          }
          this.forcefieldTimer += dt;
          if (this.forcefieldActive) {
            if (this.forcefieldTimer >= 5.0) {
              this.forcefieldActive = false;
              this.forcefieldTimer = 0;
              audioEngine.playForcefieldOff();
            }
          } else {
            if (this.forcefieldTimer >= 7.0) {
              this.forcefieldActive = true;
              this.forcefieldTimer = 0;
              audioEngine.playForcefieldOn();
            }
          }

          // Firing large fireballs from the tail stinger (top/back of the scorpion)
          this.shootTimer += dt;
          if (this.shootTimer >= 3.0) {
            this.shootTimer = 0;
            const angle = Math.atan2(player.x - this.x, player.y - (this.y - 40));
            bullets.push(new Bullet(this.x, this.y - 40, true, 1, angle, 2.0, true));
          }

          // Random small bullets from claws (claw left and claw right)
          this.clawShootTimer += dt;
          if (this.clawShootTimer >= 0.8) {
            this.clawShootTimer = 0;
            const angleLeft = (Math.random() - 0.5) * 0.4;
            bullets.push(new Bullet(this.x - 50, this.y + 20, true, 1, angleLeft));
            const angleRight = (Math.random() - 0.5) * 0.4;
            bullets.push(new Bullet(this.x + 50, this.y + 20, true, 1, angleRight));
          }

          // Spawns minions periodically (same as Boss 2)
          this.minionTimer += dt;
          if (this.minionTimer >= 8.0) {
            this.minionTimer = 0;
            this.minionWaveCount++;
            
            // Spawn 2 minions (A and B) with 3 HP (slightly stronger)
            const minion1 = new Enemy('A', this.x - 45, this.y + 30, 3);
            const minion2 = new Enemy('B', this.x + 45, this.y + 30, 3);
            
            if (this.minionWaveCount % 2 === 0) {
              minion1.guaranteedDrop = 'SHIELD';
            }
            
            enemies.push(minion1);
            enemies.push(minion2);
          }
        }

        // Keep Boss within screen bounds vertically
        if (!this.type.startsWith('BOSS') && this.y > V_HEIGHT + 40) {
          this.active = false;
        }
      }

      takeDamage(amount, pierceForcefield = false) {
        if (this.type === 'BOSS3' && this.forcefieldActive && !pierceForcefield) {
          // Block damage and generate neon blue/cyan deflect particles
          for (let i = 0; i < 6; i++) {
            particles.push(new Particle(this.x + (Math.random() - 0.5) * 60, this.y + (Math.random() - 0.5) * 60, '#00ffff'));
          }
          audioEngine.playShieldDeflect();
          return false;
        }
        this.hp -= amount;
        if (this.hp <= 0) {
          this.active = false;
          return true; // Destroyed
        }
        return false;
      }

      draw(ctx) {
        const pulse = 1.0 + Math.sin(this.pulseTime) * 0.08;
        const size = this.width / 2;

        if (this.type === 'A') {
          drawEnemyA(ctx, this.x, this.y, size, pulse);
        } else if (this.type === 'B') {
          drawEnemyB(ctx, this.x, this.y, size, pulse);
        } else if (this.type === 'C') {
          drawEnemyC(ctx, this.x, this.y, size, pulse);
        } else if (this.type === 'BOSS1') {
          drawBoss1(ctx, this.x, this.y, size, pulse);
        } else if (this.type === 'BOSS2') {
          drawBoss2(ctx, this.x, this.y, size, pulse);
        } else if (this.type === 'BOSS3') {
          drawBoss3(ctx, this.x, this.y, size, pulse, this.forcefieldActive);
        }

        // Render health bar if damaged (and not a boss)
        if (this.hp < this.maxHp && !this.type.startsWith('BOSS')) {
          ctx.save();
          const barW = 24;
          const barH = 3;
          ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
          ctx.fillRect(this.x - barW / 2, this.y - size - 8, barW, barH);
          ctx.fillStyle = '#39ff14';
          ctx.fillRect(this.x - barW / 2, this.y - size - 8, barW * (this.hp / this.maxHp), barH);
          ctx.restore();
        }
      }
    }

    // --- GAME STATE MANAGER & STAGE CONTROLLER ---
    class WaveManager {
      constructor() {
        this.currentWave = 1;
        this.state = 'TRANSITION'; // TRANSITION, PLAYING, FINISHED
        this.transitionDuration = 3.5; // Increased transition time (3.5s) as requested
        this.transitionTimer = 3.5;
        
        this.spawnQueue = [];
        this.spawnTimer = 0;
        this.spawnInterval = 0.3; // faster spacing default
        
        this.enemiesDestroyed = 0;
        this.enemiesTotal = 0;
        this.waveDamageTaken = false;
      }

      startWave(waveNum) {
        if (waveNum > 24) {
          gameState = 'VICTORY';
          scoreSaved = false;
          if (score > highscore) {
            highscore = score;
            localStorage.setItem('intergalactic_neon_highscore', highscore.toString());
          }
          saveScore(playerName, score, 24);
          loadLeaderboard();
          return;
        }

        this.currentWave = waveNum;
        this.state = 'TRANSITION';
        this.transitionTimer = this.transitionDuration;
        this.spawnQueue = [];
        this.spawnTimer = 0;
        this.enemiesDestroyed = 0;
        this.waveDamageTaken = false;

        // Tag all currently active enemies as leftover so they do not count towards the new wave count
        if (typeof enemies !== 'undefined') {
          enemies.forEach(e => {
            e.isLeftover = true;
          });
        }

        let total = 0;
        let types = [];
        
        // hpIncrease: +1 enemy HP every 4 waves
        let hpIncrease = Math.floor((waveNum - 1) / 4);

        if (waveNum === 8) {
          this.enemiesTotal = 1;
          this.spawnQueue.push({ type: 'BOSS1', hp: 150, x: V_WIDTH / 2, y: -60 });
          this.spawnInterval = 0.5;
          weaponKitsDropped = 0; // Reset for next bracket (phases 9-15)
          return;
        } else if (waveNum === 16) {
          this.enemiesTotal = 1;
          this.spawnQueue.push({ type: 'BOSS2', hp: 150, x: V_WIDTH / 2, y: -60 });
          this.spawnInterval = 0.5;
          weaponKitsDropped = 0; // Reset for next bracket (phases 17-23)
          return;
        } else if (waveNum === 24) {
          this.enemiesTotal = 1;
          this.spawnQueue.push({ type: 'BOSS3', hp: 150, x: V_WIDTH / 2, y: -60 });
          this.spawnInterval = 0.5;
          return;
        }

        // Regular waves
        if (waveNum <= 2) {
          total = 6 + waveNum * 2; // W1: 8, W2: 10
          for (let i = 0; i < total; i++) {
            types.push({ type: Math.random() < 0.85 ? 'A' : 'B', hp: 1 });
          }
          this.spawnInterval = 0.35;
        } else if (waveNum <= 5) {
          total = 10 + waveNum; // W3: 13, W4: 14, W5: 15
          for (let i = 0; i < total; i++) {
            let r = Math.random();
            if (r < 0.6) types.push({ type: 'A', hp: 1 + hpIncrease });
            else if (r < 0.9) types.push({ type: 'B', hp: 1 + hpIncrease });
            else types.push({ type: 'C', hp: 1 + hpIncrease });
          }
          this.spawnInterval = 0.30;
        } else if (waveNum <= 7) {
          total = 12 + waveNum; // W6: 18, W7: 19
          for (let i = 0; i < total; i++) {
            let r = Math.random();
            if (r < 0.4) types.push({ type: 'A', hp: 1 + hpIncrease });
            else if (r < 0.75) types.push({ type: 'B', hp: 2 + hpIncrease });
            else types.push({ type: 'C', hp: 2 + hpIncrease });
          }
          this.spawnInterval = 0.28;
        } else if (waveNum <= 12) {
          total = 14 + waveNum; // W9-12
          for (let i = 0; i < total; i++) {
            let r = Math.random();
            if (r < 0.3) types.push({ type: 'A', hp: 2 + hpIncrease });
            else if (r < 0.7) types.push({ type: 'B', hp: 2 + hpIncrease });
            else types.push({ type: 'C', hp: 3 + hpIncrease });
          }
          this.spawnInterval = 0.25;
        } else if (waveNum <= 15) {
          total = 15 + waveNum; // W13-15
          for (let i = 0; i < total; i++) {
            let r = Math.random();
            if (r < 0.2) types.push({ type: 'A', hp: 2 + hpIncrease });
            else if (r < 0.6) types.push({ type: 'B', hp: 3 + hpIncrease });
            else types.push({ type: 'C', hp: 4 + hpIncrease });
          }
          this.spawnInterval = 0.23;
        } else if (waveNum <= 20) {
          total = 16 + waveNum; // W17-20
          for (let i = 0; i < total; i++) {
            let r = Math.random();
            if (r < 0.15) types.push({ type: 'A', hp: 3 + hpIncrease });
            else if (r < 0.5) types.push({ type: 'B', hp: 4 + hpIncrease });
            else types.push({ type: 'C', hp: 5 + hpIncrease });
          }
          this.spawnInterval = 0.20;
        } else {
          total = 18 + waveNum; // W21-23
          for (let i = 0; i < total; i++) {
            let r = Math.random();
            if (r < 0.1) types.push({ type: 'A', hp: 4 + hpIncrease });
            else if (r < 0.4) types.push({ type: 'B', hp: 5 + hpIncrease });
            else types.push({ type: 'C', hp: 6 + hpIncrease });
          }
          this.spawnInterval = 0.18;
        }
        
        this.enemiesTotal = total;

        // Choose formation based on current wave
        const formations = ['GRID', 'V_SHAPE', 'SINE_LINE'];
        const currentFormation = formations[(waveNum - 1) % formations.length];

        if (currentFormation === 'GRID') {
          const cols = Math.min(5, Math.ceil(Math.sqrt(total)));
          const rows = Math.ceil(total / cols);
          let idx = 0;
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              if (idx >= total) break;
              const x = 70 + c * (340 / (cols - 1 || 1));
              const y = -50 - r * 60;
              this.spawnQueue.push({ type: types[idx].type, hp: types[idx].hp, x, y });
              idx++;
            }
          }
        } else if (currentFormation === 'V_SHAPE') {
          const mid = Math.floor(total / 2);
          for (let i = 0; i < total; i++) {
            const x = 60 + i * (360 / (total - 1 || 1));
            const depth = Math.abs(i - mid) * 55;
            const y = -50 - depth;
            this.spawnQueue.push({ type: types[i].type, hp: types[i].hp, x, y });
          }
        } else {
          // SINE_LINE (Staggered entries)
          for (let i = 0; i < total; i++) {
            const x = 100 + Math.sin(i * 0.95) * 85;
            const y = -50 - i * 65;
            this.spawnQueue.push({ type: types[i].type, hp: types[i].hp, x, y });
          }
        }
      }

      update(dt, enemies) {
        if (this.state === 'TRANSITION') {
          this.transitionTimer -= dt;
          if (this.transitionTimer <= 0) {
            this.state = 'PLAYING';
            if (this.currentWave === 4 || this.currentWave === 12 || this.currentWave === 18) {
              spawnSuperpowerKit();
            }
          }
          return;
        }

        // Process spawning
        if (this.state === 'PLAYING' && this.spawnQueue.length > 0) {
          this.spawnTimer += dt;
          if (this.spawnTimer >= this.spawnInterval) {
            this.spawnTimer = 0;
            const item = this.spawnQueue.shift();
            enemies.push(new Enemy(item.type, item.x, item.y, item.hp));
          }
        }
      }
    }

    // --- VISUAL RENDERING ROUTINES ---
    function drawHeart(ctx, x, y, size) {
      ctx.save();
      ctx.translate(x, y);
      ctx.beginPath();
      const topY = -size / 2;
      ctx.moveTo(0, topY + size * 0.3);
      ctx.bezierCurveTo(-size * 0.35, topY, -size * 0.75, topY + size * 0.35, -size * 0.75, topY + size * 0.65);
      ctx.bezierCurveTo(-size * 0.75, topY + size * 1.1, -size * 0.2, topY + size * 1.45, 0, topY + size * 1.8);
      ctx.bezierCurveTo(size * 0.2, topY + size * 1.45, size * 0.75, topY + size * 1.1, size * 0.75, topY + size * 0.65);
      ctx.bezierCurveTo(size * 0.75, topY + size * 0.35, size * 0.35, topY, 0, topY + size * 0.3);
      ctx.closePath();
      ctx.fillStyle = '#ff0055';
      ctx.shadowColor = '#ff0055';
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.restore();
    }

    function drawHUD(ctx) {
      ctx.save();
      
      // Top background panel
      ctx.fillStyle = 'rgba(6, 0, 20, 0.75)';
      ctx.fillRect(0, 0, V_WIDTH, 50);

      // Bottom glowing border line
      ctx.strokeStyle = 'rgba(0, 255, 255, 0.25)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, 50);
      ctx.lineTo(V_WIDTH, 50);
      ctx.stroke();

      // Lives
      for (let i = 0; i < 3; i++) {
        if (i < player.lives) {
          drawHeart(ctx, 30 + i * 26, 26, 11);
        } else {
          // Empty/dashed heart outline
          ctx.save();
          ctx.translate(30 + i * 26, 26);
          ctx.beginPath();
          const size = 11;
          const topY = -size / 2;
          ctx.moveTo(0, topY + size * 0.3);
          ctx.bezierCurveTo(-size * 0.35, topY, -size * 0.75, topY + size * 0.35, -size * 0.75, topY + size * 0.65);
          ctx.bezierCurveTo(-size * 0.75, topY + size * 1.1, -size * 0.2, topY + size * 1.45, 0, topY + size * 1.8);
          ctx.bezierCurveTo(size * 0.2, topY + size * 1.45, size * 0.75, topY + size * 1.1, size * 0.75, topY + size * 0.65);
          ctx.bezierCurveTo(size * 0.75, topY + size * 0.35, size * 0.35, topY, 0, topY + size * 0.3);
          ctx.closePath();
          ctx.strokeStyle = 'rgba(255, 0, 85, 0.35)';
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.restore();
        }
      }

      // Shield Timer (if active)
      if (player.shieldActive) {
        ctx.font = `bold 10px 'Orbitron', monospace`;
        ctx.fillStyle = '#00ffff';
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 4;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(`SHIELD: ${Math.ceil(player.shieldTimer)}s`, 110, 25);
      }

      // Wave Status
      ctx.font = `14px 'Orbitron', monospace`;
      ctx.fillStyle = '#8888ff';
      ctx.shadowColor = '#8888ff';
      ctx.shadowBlur = 4;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`WAVE ${waveManager.currentWave}`, V_WIDTH / 2, 25);

      // Score
      ctx.font = `bold 16px 'Orbitron', monospace`;
      ctx.fillStyle = '#39ff14';
      ctx.shadowColor = '#39ff14';
      ctx.shadowBlur = 8;
      ctx.textAlign = 'right';
      ctx.fillText(`${score.toString().padStart(6, '0')}`, V_WIDTH - 25, 25);

      ctx.restore();

      // Boss Health Bar (if any boss is active)
      const activeBoss = enemies.find(e => e.type.startsWith('BOSS'));
      if (activeBoss) {
        ctx.save();
        const barW = 280;
        const barH = 8;
        const barX = (V_WIDTH - barW) / 2;
        const barY = 65;

        // Boss Name
        ctx.font = `bold 10px 'Orbitron', monospace`;
        ctx.fillStyle = activeBoss.color;
        ctx.shadowColor = activeBoss.color;
        ctx.shadowBlur = 6;
        ctx.textAlign = 'center';
        let bossName = "GOLIATH PRIME";
        if (activeBoss.type === 'BOSS2') bossName = "NEBULA DREADNOUGHT";
        if (activeBoss.type === 'BOSS3') bossName = "INTERGALACTIC EMPEROR";
        ctx.fillText(bossName, V_WIDTH / 2, barY - 6);

        // Bar Background
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.fillRect(barX, barY, barW, barH);

        // Bar Fill
        const ratio = activeBoss.hp / activeBoss.maxHp;
        ctx.fillStyle = activeBoss.color;
        ctx.shadowColor = activeBoss.color;
        ctx.shadowBlur = 10;
        ctx.fillRect(barX, barY, barW * ratio, barH);

        // Bar Border
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 1;
        ctx.strokeRect(barX, barY, barW, barH);
        ctx.restore();
      }
    }

    function drawGlitchText(ctx, text, x, y, fontSize, scaleRatio) {
      ctx.save();
      ctx.font = `${fontSize}px 'Orbitron', sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      let offset = 0;
      if (Math.floor(tick / 5) % 6 === 0 && Math.random() > 0.35) {

      }

        ctx.fillStyle = '#ff0055';
        ctx.fillText(text, x + offset, y + (Math.random() - 0.5) * 2);

        ctx.fillText(text, x - offset, y + (Math.random() - 0.5) * 2);
      }

      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 15;
      ctx.fillText(text, x, y);
      
    function drawSuperpowerButton(ctx, btn, x, y, radius) {

    function drawButton(ctx, btn, x, y, w, h) {
      btn.x = x - w / 2;
      btn.y = y - h / 2;
      btn.w = w;
      btn.h = h;

      ctx.save();
      ctx.translate(x, y);

      let pulse = 0.5 + Math.sin(tick * 0.12) * 0.5;
      
      ctx.fillStyle = btn.hover ? 'rgba(0, 255, 255, 0.18)' : 'rgba(10, 0, 32, 0.8)';
      ctx.fillRect(-w / 2, -h / 2, w, h);

      ctx.strokeStyle = btn.hover ? '#39ff14' : '#00ffff';
      ctx.shadowColor = btn.hover ? '#39ff14' : '#00ffff';
      ctx.shadowBlur = btn.hover ? 16 : 8 + pulse * 6;
      ctx.lineWidth = btn.hover ? 3 : 2;
      
      // Cyberpunk border details
      ctx.beginPath();
      const cut = 6;
      ctx.moveTo(-w/2 + cut, -h/2);
      ctx.lineTo(w/2 - cut, -h/2);
      ctx.lineTo(w/2, -h/2 + cut);
      ctx.lineTo(w/2, h/2 - cut);
      ctx.lineTo(w/2 - cut, h/2);
      ctx.lineTo(-w/2 + cut, h/2);
      ctx.lineTo(-w/2, h/2 - cut);
      ctx.lineTo(-w/2, -h/2 + cut);
      ctx.closePath();
      ctx.stroke();

      ctx.font = `bold 14px 'Orbitron', sans-serif`;
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowBlur = 3;
      ctx.fillText(btn.text, 0, 0);

      ctx.restore();
    }

    // --- GAME ENGINE PROCESSORS ---
    function triggerWaveClear() {
      shieldDroppedThisWave = false; // Reset shield cap for next wave
      // Perfect Wave Bonus Check
      if (!waveManager.waveDamageTaken) {
        score += 100;
        // Trigger visual celebration indicator
        for (let p = 0; p < 25; p++) {
          particles.push(new Particle(V_WIDTH / 2, V_HEIGHT / 2, '#39ff14'));
        }
      }
      audioEngine.playWaveClear();
      if (waveManager.currentWave >= 24) {
        gameState = 'VICTORY';
        if (score > highscore) {
          highscore = score;
          localStorage.setItem('intergalactic_neon_highscore', highscore.toString());
        }
      } else {
        waveManager.startWave(waveManager.currentWave + 1);
      }
    }

    function checkCollisions() {
      // 1. Bullet colliders
      for (let b = bullets.length - 1; b >= 0; b--) {
        const bullet = bullets[b];
        
        if (bullet.isEnemy) {
          // Check player collision
          if (gameState === 'PLAYING') {
            const hitRadius = Math.max(player.width, player.height) * 0.45;
            const dist = Math.hypot(bullet.x - player.x, bullet.y - player.y);
            const bulletRadius = bullet.isFireball ? 11 : 3;
            if (dist < hitRadius + bulletRadius) {
              bullet.active = false;
              if (!player.invulnerable && !player.shieldActive) {
                const hit = player.triggerDamage();
                if (hit) waveManager.waveDamageTaken = true;
                if (player.lives <= 0) triggerGameOver();
              } else if (player.shieldActive) {
                // Shield impact particles
                for (let i = 0; i < 5; i++) {
                  particles.push(new Particle(bullet.x, bullet.y, '#00ffff'));
                }
              }
            }
          }
        } else {
          // Player laser hits enemies
          for (let e = enemies.length - 1; e >= 0; e--) {
            const enemy = enemies[e];
            const dist = Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y);
            const colLimit = (bullet.width / 2) + (enemy.width / 2);
            
            if (dist < colLimit + 2) {
              bullet.active = false;
              
              const destroyed = enemy.takeDamage(bullet.damage);
              if (destroyed) {
                audioEngine.playEnemyExplosion();
                score += enemy.scoreValue;

                const isBossWave = (waveManager.currentWave === 8 || waveManager.currentWave === 16 || waveManager.currentWave === 24);
                if (!enemy.isLeftover && !isBossWave) {
                  waveManager.enemiesDestroyed++;
                }

                if (enemy.guaranteedDrop) {
                  powerups.push(new PowerUp(enemy.x, enemy.y, enemy.guaranteedDrop));
                } else if (isBossWave && enemy.type.startsWith('BOSS')) {
                  // Boss defeated → drop MEDKIT + MISSILE_KIT after BOSS2
                  powerups.push(new PowerUp(enemy.x, enemy.y + 30, 'MEDKIT'));
                  if (enemy.type === 'BOSS2') {
                    powerups.push(new PowerUp(enemy.x - 40, enemy.y + 60, 'MISSILE_KIT'));
                  }
                } else if (!isBossWave) {
                  // Collectible items spawned on even waves (only if not boss wave)
                  const isEvenWave = (waveManager.currentWave % 2 === 0);
                  if (isEvenWave && Math.random() < 0.22) { // 22% chance of drop
                    // Cap weapon kits at 2 per bracket; shield capped at 1 per wave
                    const canDropWeapon = weaponKitsDropped < 2;
                    const canDropShield = !shieldDroppedThisWave;
                    let type = null;
                    if (canDropWeapon && canDropShield) {
                      type = Math.random() < 0.5 ? 'WEAPON' : 'SHIELD';
                    } else if (canDropWeapon) {
                      type = 'WEAPON';
                    } else if (canDropShield) {
                      type = 'SHIELD';
                    }
                    if (type === 'WEAPON') weaponKitsDropped++;
                    if (type === 'SHIELD') shieldDroppedThisWave = true;
                    if (type) powerups.push(new PowerUp(enemy.x, enemy.y, type));
                  }
                }

                // Spawn explosion particles
                for (let i = 0; i < 12; i++) {
                  particles.push(new Particle(enemy.x, enemy.y, enemy.color));
                }

                // Check Wave Completion
                let waveCleared = false;
                if (isBossWave) {
                  if (enemy.type.startsWith('BOSS')) {
                    waveCleared = true;
                  }
                } else {
                  if (waveManager.enemiesDestroyed >= waveManager.enemiesTotal) {
                    waveCleared = true;
                  }
                }

                if (waveCleared) {
                  triggerWaveClear();
                }
              }
              break;
            }
          }
        }
      }

      // 2. Direct player ship collision with enemy bodies
      if (gameState === 'PLAYING') {
        for (let e = enemies.length - 1; e >= 0; e--) {
          const enemy = enemies[e];

          // Bosses are immune to body-ram — only bullets can damage them
          if (enemy.type.startsWith('BOSS')) {
            const hitRadius = Math.max(player.width, player.height) * 0.45;
            const bossRadius = enemy.width * 0.45;
            const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
            if (dist < hitRadius + bossRadius) {
              if (!player.invulnerable && !player.shieldActive) {
                const hit = player.triggerDamage();
                if (hit) waveManager.waveDamageTaken = true;
                if (player.lives <= 0) { triggerGameOver(); break; }
              } else if (player.shieldActive) {
                for (let i = 0; i < 8; i++) particles.push(new Particle(enemy.x, enemy.y, '#00ffff'));
              }
            }
            continue; // Skip the rest (no ramming death)
          }

          const hitRadius = Math.max(player.width, player.height) * 0.45;
          const enemyRadius = enemy.width * 0.45;
          const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
          
          if (dist < hitRadius + enemyRadius) {
            if (!player.invulnerable && !player.shieldActive) {
              const hit = player.triggerDamage();
              if (hit) waveManager.waveDamageTaken = true;
            } else if (player.shieldActive) {
              // Shield block particles
              for (let i = 0; i < 8; i++) {
                particles.push(new Particle(enemy.x, enemy.y, '#00ffff'));
              }
            }
            
            // Re-bound enemy damage and destroy
            enemy.active = false;
            waveManager.enemiesDestroyed++;
            audioEngine.playEnemyExplosion();

            const isBossWave = (waveManager.currentWave === 10 || waveManager.currentWave === 20 || waveManager.currentWave === 30);
            if (!enemy.isLeftover && !isBossWave) {
              waveManager.enemiesDestroyed++;
            }

            if (enemy.guaranteedDrop) {
              powerups.push(new PowerUp(enemy.x, enemy.y, enemy.guaranteedDrop));
            } else if (!isBossWave) {
              // Collectible items spawned on even waves (onda sim, onda não)
              const isEvenWave = (waveManager.currentWave % 2 === 0);
              if (isEvenWave && Math.random() < 0.22) {
                // Cap weapon kits at 2 per bracket; shield capped at 1 per wave
                const canDropWeapon = weaponKitsDropped < 2;
                const canDropShield = !shieldDroppedThisWave;
                let type = null;
                if (canDropWeapon && canDropShield) {
                  type = Math.random() < 0.5 ? 'WEAPON' : 'SHIELD';
                } else if (canDropWeapon) {
                  type = 'WEAPON';
                } else if (canDropShield) {
                  type = 'SHIELD';
                }
                if (type === 'WEAPON') weaponKitsDropped++;
                if (type === 'SHIELD') shieldDroppedThisWave = true;
                if (type) powerups.push(new PowerUp(enemy.x, enemy.y, type));
              }
            }

            for (let i = 0; i < 12; i++) {
              particles.push(new Particle(enemy.x, enemy.y, enemy.color));
            }

            if (player.lives <= 0) {
              triggerGameOver();
              break;
            }

            // Check wave completion if last enemy is rammed
            let waveCleared = false;
            if (isBossWave) {
              if (enemy.type.startsWith('BOSS')) {
                waveCleared = true;
              }
            } else {
              if (waveManager.enemiesDestroyed >= waveManager.enemiesTotal) {
                waveCleared = true;
              }
            }

            if (waveCleared) {
              triggerWaveClear();
            }
          }
        }
      }

      // 3. Player overlap with collectible powerups
      if (gameState === 'PLAYING') {
        for (let i = powerups.length - 1; i >= 0; i--) {
          const pu = powerups[i];
          const dist = Math.hypot(player.x - pu.x, player.y - pu.y);
          const colLimit = (player.width / 2) + (pu.width / 2);
          
          if (dist < colLimit) {
            pu.active = false;
            if (pu.type === 'WEAPON') {
              if (player.weaponLevel < 5) {
                player.weaponLevel++;
                audioEngine.playPowerUp();
              }
            } else if (pu.type === 'SHIELD') {
              player.activateShield(30);
              audioEngine.playPowerUp();
            } else if (pu.type === 'MEDKIT') {
              // Full life restore
              player.lives = 3;
              player.invulnerable = false;
              player.invulnerableTimer = 0;
              audioEngine.playPowerUp();
              // Celebration particles
              for (let p = 0; p < 20; p++) {
                particles.push(new Particle(player.x, player.y, '#ff0055'));
              }
            } else if (pu.type === 'MISSILE_KIT') {
              // Unlock permanent homing player missile
              playerMissileActive = true;
              playerMissileTimer = 0;
              audioEngine.playPowerUp();
              for (let p = 0; p < 25; p++) {
                particles.push(new Particle(player.x, player.y, '#bd00ff'));
              }
            } else if (pu.type === 'SUPERPOWER') {
              superpowerAvailable = true;
              audioEngine.playPowerUp();
              for (let p = 0; p < 25; p++) {
                particles.push(new Particle(player.x, player.y, '#ffd700'));
              }
            }
            score += 15;
          }
        }
      }

      // 4. Wave Completion Failsafe (normal waves only)
      if (gameState === 'PLAYING' && waveManager.state === 'PLAYING') {
        const isBossWave = (waveManager.currentWave === 8 || waveManager.currentWave === 16 || waveManager.currentWave === 24);
        if (!isBossWave) {
          if (waveManager.spawnQueue.length === 0) {
            const activeWaveEnemies = enemies.filter(e => !e.isLeftover && !e.type.startsWith('BOSS'));
            if (activeWaveEnemies.length === 0) {
              triggerWaveClear();
            }
          }
        }
      }

      // Cleanup inactive entities
      bullets = bullets.filter(b => b.active);
      enemies = enemies.filter(e => e.active);
    }

    // --- MAIN GAME LOOP IMPLEMENTATION ---
    let lastTime = performance.now();
    function loop(time) {
      const dt = Math.min(0.08, (time - lastTime) / 1000); // Caps deltaTime on tab unfocus
      lastTime = time;
      tick++;

      // Update background globally
      starfield.update(dt);

      // Rendering sequence
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      starfield.draw(ctx);

      // Set scale relative to playable virtual zone
      ctx.save();
      ctx.translate(offsetX, offsetY);
      ctx.scale(scale, scale);

      // Clip bounds
      ctx.beginPath();
      ctx.rect(0, 0, V_WIDTH, V_HEIGHT);
      ctx.clip();

      if (gameState === 'PLAYING') {
        waveTime += dt;
        
        // Dynamic +10 points every 10 seconds of active survival
        if (waveManager.state === 'PLAYING') {
          pointsTimer += dt;
          if (pointsTimer >= 10.0) {
            pointsTimer -= 10.0;
            score += 10;
          }
        }
        
        // 1. Update entities
        player.update(dt, bullets);
        waveManager.update(dt, enemies);

        // Enemies update & shooting
        const speedMult = 1.0 + (waveManager.currentWave - 1) * 0.08;
        enemies.forEach(e => {
          e.update(dt, waveTime, speedMult);
          
          // Random shooting chance (~1.5% chance per frame at 60fps)
          if (e.active && e.y > 0 && Math.random() < 0.015) {
            bullets.push(new Bullet(e.x, e.y + 12, true));
          }
        });

        bullets.forEach(b => b.update(dt));
        particles.forEach(p => p.update(dt));
        powerups.forEach(pu => pu.update(dt));
        missiles.forEach(m => m.update(dt));

        // Player homing missile spawn
        if (playerMissileActive && enemies.length > 0) {
          playerMissileTimer += dt;
          if (playerMissileTimer >= PLAYER_MISSILE_INTERVAL) {
            playerMissileTimer = 0;
            playerMissiles.push(new PlayerMissile(player.x, player.y - 10));
          }
        }
        playerMissiles.forEach(pm => pm.update(dt));

        // Superpower active update
        if (superpowerActive) {
          superpowerRadius += 550 * dt;
          if (superpowerRadius > Math.max(V_WIDTH, V_HEIGHT) * 1.25) {
            superpowerActive = false;
          }
          for (let i = enemies.length - 1; i >= 0; i--) {
            const e = enemies[i];
            if (!e.active) continue;
            if (e.superpowerHit) continue;
            
            const d = Math.hypot(e.x - superpowerCenter.x, e.y - superpowerCenter.y);
            if (d <= superpowerRadius) {
              e.superpowerHit = true;
              const isBoss = e.type.startsWith('BOSS');
              const dmg = isBoss ? 1.0 : 999;
              const destroyed = e.takeDamage(dmg, true); // pierceForcefield = true
              
              if (destroyed) {
                audioEngine.playEnemyExplosion();
                score += e.scoreValue;
                for (let p = 0; p < 20; p++) {
                  particles.push(new Particle(e.x, e.y, e.color));
                }
                const isBossWave = (waveManager.currentWave === 8 || waveManager.currentWave === 16 || waveManager.currentWave === 24);
                if (!e.isLeftover && !isBossWave) waveManager.enemiesDestroyed++;
                if (e.guaranteedDrop) {
                  powerups.push(new PowerUp(e.x, e.y, e.guaranteedDrop));
                } else if (isBossWave && isBoss) {
                  powerups.push(new PowerUp(e.x, e.y + 30, 'MEDKIT'));
                  if (e.type === 'BOSS2') {
                    powerups.push(new PowerUp(e.x - 40, e.y + 60, 'MISSILE_KIT'));
                  }
                  triggerWaveClear();
                }
              } else if (isBoss) {
                // If it is a boss and survived, generate golden sparks at impact
                for (let p = 0; p < 12; p++) {
                  particles.push(new Particle(e.x, e.y, '#ffd700'));
                }
              }
            }
          }
        }

        // 2. Resolve collisions
        checkCollisions();

        // Cleanup dead particles, powerups and missiles
        particles = particles.filter(p => p.life > 0);
        powerups = powerups.filter(pu => pu.active);
        missiles = missiles.filter(m => m.active);
        playerMissiles = playerMissiles.filter(pm => pm.active);

        // 3. Render entities
        enemies.forEach(e => e.draw(ctx));
        bullets.forEach(b => b.draw(ctx));
        missiles.forEach(m => m.draw(ctx));
        playerMissiles.forEach(pm => pm.draw(ctx));
        powerups.forEach(pu => pu.draw(ctx));
        particles.forEach(p => p.draw(ctx));
        player.draw(ctx);

        // Render superpower expanding shockwave ring
        if (superpowerActive) {
          ctx.save();
          ctx.shadowBlur = 35;
          ctx.shadowColor = '#ffd700';
          const colorCycle = Math.floor(tick / 3) % 360;
          ctx.strokeStyle = `hsla(${colorCycle}, 100%, 60%, ${0.9 * (1.0 - superpowerRadius / (Math.max(V_WIDTH, V_HEIGHT) * 1.25))})`;
          ctx.lineWidth = 12;
          ctx.beginPath();
          ctx.arc(superpowerCenter.x, superpowerCenter.y, superpowerRadius, 0, Math.PI * 2);
          ctx.stroke();

          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(superpowerCenter.x, superpowerCenter.y, superpowerRadius - 6, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        // Render Wave overlay if transitioning
        if (waveManager.state === 'TRANSITION') {
          drawWaveBanner(ctx, waveManager.currentWave, waveManager.transitionTimer, waveManager.transitionDuration);
        }

        // Playable side boundaries
        drawPlayableBorders(ctx);

        // HUD panel layer
        drawHUD(ctx);

        // Draw superpower button if available
        if (superpowerAvailable) {
          drawSuperpowerButton(ctx, buttons.superpowerButton, V_WIDTH - 45, V_HEIGHT - 45, 22);
        }

      } else if (gameState === 'MENU') {
        // Floating spaceship decoration
        const shipOsc = Math.sin(tick * 0.045) * 8;
        player.x = V_WIDTH / 2;
        player.y = V_HEIGHT - 210 + shipOsc;
        player.draw(ctx);

        // Title and buttons
        drawGlitchText(ctx, "INTERGALACTIC", V_WIDTH / 2, 215, 30, scale);
        drawGlitchText(ctx, "NEON", V_WIDTH / 2, 258, 44, scale);
        
        ctx.font = `bold 12px 'Orbitron', sans-serif`;
        ctx.fillStyle = '#ff6600';
        ctx.shadowColor = '#ff6600';
        ctx.shadowBlur = 6;
        ctx.textAlign = 'center';
        ctx.fillText("DEFEND THE GALAXY", V_WIDTH / 2, 308);

        // Show pilot name if set
        if (playerName) {
          ctx.font = `9px 'Orbitron', sans-serif`;
          ctx.fillStyle = 'rgba(0, 255, 255, 0.6)';
          ctx.shadowColor = '#00ffff';
          ctx.shadowBlur = 4;
          ctx.fillText(`PILOTO: ${playerName}`, V_WIDTH / 2, 355);
        }

        drawButton(ctx, buttons.startButton, V_WIDTH / 2, 410, 210, 48);
        buttons.rankingButton.text = 'RANKING';
        drawButton(ctx, buttons.rankingButton, V_WIDTH / 2, 478, 210, 42);
        drawPlayableBorders(ctx);

      } else if (gameState === 'GAME_OVER') {
        // Render background particles
        particles.forEach(p => p.update(dt));
        particles = particles.filter(p => p.life > 0);
        particles.forEach(p => p.draw(ctx));

        drawGlitchText(ctx, "GAME OVER", V_WIDTH / 2, 200, 36, scale);

        ctx.font = `15px 'Orbitron', sans-serif`;
        ctx.fillStyle = '#39ff14';
        ctx.textAlign = 'center';
        ctx.shadowBlur = 6;
        ctx.shadowColor = '#39ff14';
        ctx.fillText(`SCORE: ${score}`, V_WIDTH / 2, 270);
        
        ctx.fillStyle = '#00ffff';
        ctx.shadowColor = '#00ffff';
        ctx.fillText(`HIGH SCORE: ${highscore}`, V_WIDTH / 2, 302);

        // Saving indicator
        ctx.font = `8px 'Orbitron', sans-serif`;
        ctx.fillStyle = scoreSaved ? 'rgba(57,255,20,0.7)' : 'rgba(255,200,0,0.7)';
        ctx.shadowBlur = 0;
        ctx.fillText(scoreSaved ? '✓ PONTUACAO SALVA NO RANKING' : 'SALVANDO PONTUACAO...', V_WIDTH / 2, 328);

        buttons.restartButton.text = 'RESTART';
        buttons.menuButton.text = 'MENU';
        buttons.leaderboardButton.text = 'VER RANKING';
        drawButton(ctx, buttons.restartButton, V_WIDTH / 2, 390, 170, 42);
        drawButton(ctx, buttons.leaderboardButton, V_WIDTH / 2, 450, 180, 42);
        drawButton(ctx, buttons.menuButton, V_WIDTH / 2, 510, 170, 42);
        drawPlayableBorders(ctx);
      } else if (gameState === 'VICTORY') {
        // Render background particles
        particles.forEach(p => p.update(dt));
        particles = particles.filter(p => p.life > 0);
        particles.forEach(p => p.draw(ctx));

        drawGlitchText(ctx, "VICTORY", V_WIDTH / 2, 200, 40, scale);
        
        ctx.font = `bold 16px 'Orbitron', sans-serif`;
        ctx.fillStyle = '#ffd700';
        ctx.textAlign = 'center';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ffd700';
        ctx.fillText("VOCE SALVOU A GALAXIA!", V_WIDTH / 2, 265);

        ctx.font = `14px 'Orbitron', sans-serif`;
        ctx.fillStyle = '#39ff14';
        ctx.shadowColor = '#39ff14';
        ctx.shadowBlur = 6;
        ctx.fillText(`SCORE FINAL: ${score}`, V_WIDTH / 2, 305);

        ctx.fillStyle = '#00ffff';
        ctx.shadowColor = '#00ffff';
        ctx.fillText(`RECORD: ${highscore}`, V_WIDTH / 2, 335);

        ctx.font = `8px 'Orbitron', sans-serif`;
        ctx.fillStyle = scoreSaved ? 'rgba(57,255,20,0.7)' : 'rgba(255,200,0,0.7)';
        ctx.shadowBlur = 0;
        ctx.fillText(scoreSaved ? '✓ PONTUACAO SALVA NO RANKING' : 'SALVANDO PONTUACAO...', V_WIDTH / 2, 360);

        buttons.restartButton.text = 'RESTART';
        buttons.menuButton.text = 'MENU';
        buttons.leaderboardButton.text = 'VER RANKING';
        drawButton(ctx, buttons.restartButton, V_WIDTH / 2, 415, 170, 42);
        drawButton(ctx, buttons.leaderboardButton, V_WIDTH / 2, 472, 180, 42);
        drawButton(ctx, buttons.menuButton, V_WIDTH / 2, 530, 170, 42);
        drawPlayableBorders(ctx);
      } else if (gameState === 'LEADERBOARD') {
        // Render leaderboard screen
        ctx.fillStyle = 'rgba(5, 0, 25, 0.92)';
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

        drawGlitchText(ctx, 'RANKING', V_WIDTH / 2, 60, 30, scale);

        ctx.font = `bold 9px 'Orbitron', monospace`;
        ctx.textAlign = 'center';
        ctx.fillStyle = '#8888ff';
        ctx.shadowBlur = 0;
        ctx.fillText('TOP PILOTOS INTERGALACTICOS', V_WIDTH / 2, 92);

        const grad = ctx.createLinearGradient(30, 108, V_WIDTH - 30, 108);
        grad.addColorStop(0, 'transparent');
        grad.addColorStop(0.5, '#00ffff');
        grad.addColorStop(1, 'transparent');
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(30, 108);
        ctx.lineTo(V_WIDTH - 30, 108);
        ctx.stroke();

        if (!leaderboardLoaded) {
          ctx.font = `11px 'Orbitron', monospace`;
          ctx.fillStyle = '#00ffff';
          ctx.shadowColor = '#00ffff';
          ctx.shadowBlur = 8;
          ctx.textAlign = 'center';
          ctx.fillText('CARREGANDO...', V_WIDTH / 2, V_HEIGHT / 2);
        } else if (leaderboardError || leaderboard.length === 0) {
          ctx.font = `10px 'Orbitron', monospace`;
          ctx.fillStyle = leaderboardError ? '#ff0055' : '#8888ff';
          ctx.shadowBlur = 0;
          ctx.textAlign = 'center';
          ctx.fillText(leaderboardError ? 'ERRO AO CARREGAR RANKING' : 'NENHUM PILOTO REGISTRADO', V_WIDTH / 2, V_HEIGHT / 2 - 10);
          ctx.font = `8px 'Orbitron', monospace`;
          ctx.fillStyle = '#555588';
          ctx.fillText(leaderboardError ? 'VERIFIQUE A CONEXAO' : 'SEJA O PRIMEIRO!', V_WIDTH / 2, V_HEIGHT / 2 + 18);
        } else {
          const topEntries = leaderboard.slice(0, 10);
          const startY = 128;
          const rowH = 46;

          ctx.font = `bold 8px 'Orbitron', monospace`;
          ctx.fillStyle = '#444466';
          ctx.textAlign = 'left';
          ctx.shadowBlur = 0;
          ctx.fillText('#', 26, startY);
          ctx.fillText('PILOTO', 58, startY);
          ctx.textAlign = 'center';
          ctx.fillText('ONDA', V_WIDTH - 85, startY);
          ctx.textAlign = 'right';
          ctx.fillText('PONTOS', V_WIDTH - 20, startY);

          topEntries.forEach((entry, i) => {
            const y = startY + 20 + i * rowH;
            const isPlayer = entry.uid === PLAYER_UID;

            if (isPlayer) {
              ctx.fillStyle = 'rgba(0, 255, 255, 0.07)';
              ctx.fillRect(18, y - 15, V_WIDTH - 36, rowH - 4);
              ctx.strokeStyle = 'rgba(0, 255, 255, 0.22)';
              ctx.lineWidth = 1;
              ctx.strokeRect(18, y - 15, V_WIDTH - 36, rowH - 4);
            }

            let rankColor = '#444466';
            if (i === 0) rankColor = '#ffd700';
            else if (i === 1) rankColor = '#c0c0c0';
            else if (i === 2) rankColor = '#cd7f32';

            ctx.font = `bold 11px 'Orbitron', monospace`;
            ctx.fillStyle = rankColor;
            ctx.shadowColor = rankColor;
            ctx.shadowBlur = i < 3 ? 8 : 0;
            ctx.textAlign = 'center';
            ctx.fillText(`${i + 1}`, 32, y);

            ctx.font = `bold 12px 'Orbitron', monospace`;
            ctx.fillStyle = isPlayer ? '#00ffff' : '#ffffff';
            ctx.shadowColor = isPlayer ? '#00ffff' : 'transparent';
            ctx.shadowBlur = isPlayer ? 8 : 0;
            ctx.textAlign = 'left';
            ctx.fillText(entry.name.substring(0, 10), 58, y);

            if (isPlayer) {
              ctx.font = `7px 'Orbitron', monospace`;
              ctx.fillStyle = 'rgba(0,255,255,0.7)';
              ctx.shadowBlur = 3;
              ctx.fillText('< VOCE', 58, y + 13);
            }

            ctx.font = `10px 'Orbitron', monospace`;
            ctx.fillStyle = '#8888ff';
            ctx.shadowBlur = 0;
            ctx.textAlign = 'center';
            ctx.fillText(`W${entry.wave || '-'}`, V_WIDTH - 85, y);

            ctx.font = `bold 12px 'Orbitron', monospace`;
            ctx.fillStyle = i === 0 ? '#ffd700' : '#39ff14';
            ctx.shadowColor = i === 0 ? '#ffd700' : '#39ff14';
            ctx.shadowBlur = 5;
            ctx.textAlign = 'right';
            ctx.fillText(entry.score.toString().padStart(6, '0'), V_WIDTH - 20, y);
            ctx.shadowBlur = 0;

            if (i < topEntries.length - 1) {
              ctx.strokeStyle = 'rgba(80, 80, 130, 0.2)';
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(22, y + 19);
              ctx.lineTo(V_WIDTH - 22, y + 19);
              ctx.stroke();
            }
          });
        }

        buttons.backButton.text = '← MENU PRINCIPAL';
        drawButton(ctx, buttons.backButton, V_WIDTH / 2, V_HEIGHT - 52, 220, 44);
        drawPlayableBorders(ctx);
      }
      
      // Draw Mute Button globally on all screens
      drawMuteButton(ctx, buttons.muteButton.x, buttons.muteButton.y, buttons.muteButton.w, buttons.muteButton.h);

      ctx.restore();
      requestAnimationFrame(loop);
    }

    // --- HIGH-DPI CANVAS MANAGEMENT & SCALE FACTOR ---
    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const W = window.innerWidth;
      const H = window.innerHeight;
      
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      
      ctx.scale(dpr, dpr);
      
      // Compute responsive scaling constraints
      scale = Math.min(W / V_WIDTH, H / V_HEIGHT);
      offsetX = (W - V_WIDTH * scale) / 2;
      offsetY = (H - V_HEIGHT * scale) / 2;

      starfield.resize();
    }

    window.addEventListener('resize', resize);
    
    // --- CONTROLS LISTENERS ---
    function convertCoords(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const screenX = clientX - rect.left;
      const screenY = clientY - rect.top;
      const x = (screenX - offsetX) / scale;
      const y = (screenY - offsetY) / scale;
      return { x, y };
    }

    function handleMove(clientX, clientY) {
      const { x, y } = convertCoords(clientX, clientY);
      if (gameState === 'PLAYING') {
        if (superpowerAvailable && isInside(x, y, buttons.superpowerButton)) {
          return;
        }
        player.targetX = x;
        player.targetY = y;
      }
    }

    // Keyboard bindings for Desktop
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      audioEngine.init();
      audioEngine.resume();
    });
    window.addEventListener('keyup', e => {
      keys[e.key] = false;
    });

    // Process keyboard inputs on ticking frame
    function processKeyboardInputs() {
      if (gameState !== 'PLAYING') return;
      const moveSpeed = 360 * 0.016; // approx velocity frame scale
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
        player.targetX = player.x - moveSpeed;
      }
      if (keys['ArrowRight'] || keys['d'] || keys['D']) {
        player.targetX = player.x + moveSpeed;
      }
      if (keys['ArrowUp'] || keys['w'] || keys['W']) {
        player.targetY = player.y - moveSpeed;
      }
      if (keys['ArrowDown'] || keys['s'] || keys['S']) {
        player.targetY = player.y + moveSpeed;
      }
    }
    // inject into request loop cycle
    setInterval(processKeyboardInputs, 16);

    // Mouse movement binding
    window.addEventListener('mousemove', e => {
      if (isOverlayActive()) return;
      const { x, y } = convertCoords(e.clientX, e.clientY);
      
      buttons.muteButton.hover = isInside(x, y, buttons.muteButton);

      if (gameState === 'MENU') {
        buttons.startButton.hover = isInside(x, y, buttons.startButton);
        buttons.rankingButton.hover = isInside(x, y, buttons.rankingButton);
      } else if (gameState === 'GAME_OVER' || gameState === 'VICTORY') {
        buttons.restartButton.hover = isInside(x, y, buttons.restartButton);
        buttons.menuButton.hover = isInside(x, y, buttons.menuButton);
        buttons.leaderboardButton.hover = isInside(x, y, buttons.leaderboardButton);
      } else if (gameState === 'LEADERBOARD') {
        buttons.backButton.hover = isInside(x, y, buttons.backButton);
      } else if (gameState === 'PLAYING' && superpowerAvailable) {
        buttons.superpowerButton.hover = isInside(x, y, buttons.superpowerButton);
      } else {
        buttons.superpowerButton.hover = false;
      }
      handleMove(e.clientX, e.clientY);
    });

    // Touch support bindings
    window.addEventListener('touchstart', e => {
      if (isOverlayActive()) return;
      audioEngine.init();
      audioEngine.resume();
      if (e.touches.length > 0) {
        const touch = e.touches[0];
        const { x, y } = convertCoords(touch.clientX, touch.clientY);
        
        if (isInside(x, y, buttons.muteButton)) {
          audioEngine.toggleMute();
          e.preventDefault();
          return;
        }

        if (gameState === 'PLAYING') {
          if (superpowerAvailable && isInside(x, y, buttons.superpowerButton)) {
            activateSuperpower();
            e.preventDefault();
            return;
          }
          player.targetX = x;
          player.targetY = y;
        } else if (gameState === 'MENU') {
          if (isInside(x, y, buttons.startButton)) startGame();
          else if (isInside(x, y, buttons.rankingButton)) {
            leaderboardLoaded = false;
            loadLeaderboard();
            gameState = 'LEADERBOARD';
          }
        } else if (gameState === 'GAME_OVER' || gameState === 'VICTORY') {
          if (isInside(x, y, buttons.restartButton)) startGame();
          else if (isInside(x, y, buttons.leaderboardButton)) gameState = 'LEADERBOARD';
          else if (isInside(x, y, buttons.menuButton)) goToMenu();
        } else if (gameState === 'LEADERBOARD') {
          if (isInside(x, y, buttons.backButton)) goToMenu();
        }
      }
    }, { passive: false });

    window.addEventListener('touchmove', e => {
      if (isOverlayActive()) return;
      if (e.touches.length > 0) {
        const touch = e.touches[0];
        const { x, y } = convertCoords(touch.clientX, touch.clientY);
        if (gameState === 'PLAYING' && superpowerAvailable && isInside(x, y, buttons.superpowerButton)) {
          return;
        }
        handleMove(touch.clientX, touch.clientY);
      }
    }, { passive: false });

    // Desktop Click trigger trigger
    window.addEventListener('click', e => {
      if (isOverlayActive()) return;
      audioEngine.init();
      audioEngine.resume();
      const { x, y } = convertCoords(e.clientX, e.clientY);

      if (isInside(x, y, buttons.muteButton)) {
        audioEngine.toggleMute();
        return;
      }

      if (gameState === 'PLAYING' && superpowerAvailable) {
        if (isInside(x, y, buttons.superpowerButton)) {
          activateSuperpower();
          return;
        }
      }

      if (gameState === 'MENU') {
        if (isInside(x, y, buttons.startButton)) startGame();
        else if (isInside(x, y, buttons.rankingButton)) {
          leaderboardLoaded = false;
          loadLeaderboard();
          gameState = 'LEADERBOARD';
        }
      } else if (gameState === 'GAME_OVER' || gameState === 'VICTORY') {
        if (isInside(x, y, buttons.restartButton)) startGame();
        else if (isInside(x, y, buttons.leaderboardButton)) gameState = 'LEADERBOARD';
        else if (isInside(x, y, buttons.menuButton)) goToMenu();
      } else if (gameState === 'LEADERBOARD') {
        if (isInside(x, y, buttons.backButton)) goToMenu();
      }
    });

    // Launch application sequence
    resize();
    requestAnimationFrame(loop);

    // --- NAME INPUT OVERLAY LOGIC ---
    (function() {
      const overlay = document.getElementById('nameInputOverlay');
      const input = document.getElementById('playerNameInput');
      const confirmBtn = document.getElementById('confirmNameBtn');
      const errorEl = document.getElementById('nameInputError');

      // No stopPropagation to allow standard keyboard/focus browser behaviors.
      // Game input events are ignored while overlay is active via isOverlayActive checks.

      // If player name already saved, skip overlay
      if (playerName && playerName.length > 0) {
        overlay.style.display = 'none';
      } else {
        // Prevent canvas touch-action while overlay is visible
        overlay.style.touchAction = 'auto';
        setTimeout(() => input.focus(), 400);
      }

      function confirmName() {
        try {
          const name = input.value.trim().toUpperCase();
          if (name.length === 0) {
            errorEl.textContent = 'NOME OBRIGATORIO!';
            input.style.borderColor = '#ff0055';
            input.style.boxShadow = '0 0 25px rgba(255,0,85,0.4)';
            setTimeout(() => input.focus(), 100);
            return;
          }
          playerName = name;
          try {
            localStorage.setItem('ig_neon_playername', playerName);
          } catch (e) {
            console.warn("Storage write failed:", e);
          }
          overlay.style.display = 'none';
          audioEngine.init();
          audioEngine.resume();
        } catch (err) {
          errorEl.textContent = 'ERRO: ' + err.message;
          console.error(err);
        }
      }

      confirmBtn.addEventListener('click', confirmName);
      confirmBtn.addEventListener('touchstart', e => {
        confirmName();
        e.preventDefault();
      });
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); confirmName(); }
        errorEl.textContent = '';
        input.style.borderColor = '';
        input.style.boxShadow = '';
      });
    })();
  </script>
</body>
</html>
